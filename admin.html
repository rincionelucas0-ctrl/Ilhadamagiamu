<script type="text/ilha-module">/* Supabase bridge: no network mutations when not configured. Publishable key only. */
(()=>{'use strict';
const cfg=window.ILHA_CONFIG||{},sdk=window.supabase;
const ready=Boolean(sdk?.createClient&&/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(cfg.supabaseUrl||'')&&cfg.supabasePublishableKey);
const client=ready?sdk.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey):null;
const connectionMessage=()=>!sdk?.createClient?'No se pudo cargar la biblioteca Supabase. Revisá conexión a Internet o bloqueadores.':!cfg.supabasePublishableKey?'Falta la clave pública de Supabase.':'No se pudo iniciar la conexión Supabase.';
const must=(error)=>{if(error)throw error};
const backend={ready,client,userId:null,connectionMessage,
 async ensureGuest(){if(!ready)throw Error('Falta la conexión Supabase.');let {data:{session},error}=await client.auth.getSession();must(error);if(!session){let result=await client.auth.signInAnonymously();must(result.error);session=result.data.session}this.userId=session?.user?.id||null;return this.userId},
 async loadPublic(){if(!ready)return{places:[],events:[],settings:{}};const [p,e,c,o,m]=await Promise.all([client.from('places').select('*').eq('status','published').order('name'),client.from('events').select('*').eq('status','published').gte('end',new Date().toISOString().slice(0,10)).order('start'),client.from('app_settings').select('whatsapp').eq('id',1).maybeSingle(),client.from('offers').select('*').eq('status','published'),client.from('missions').select('*').eq('status','published')]);must(p.error);must(e.error);must(c.error);must(o.error);must(m.error);let auth=await client.auth.getUser();this.userId=auth.data?.user?.id||null;return {places:(p.data||[]).map(x=>({...x,description:x.description||'',recommendations:x.recommendations||'',region:x.region||'Florianópolis'})),events:(e.data||[]).map(x=>({...x,timeStart:x.time_start||'',timeEnd:x.time_end||'',free:x.is_free,photo:x.photo_url||'',review:x.review_status})),settings:c.data||{},offers:o.data||[],missions:m.data||[]}},
 async uploadPublicMedia(file){if(!ready)throw Error('Supabase no está disponible.');if(!file||!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>5*1024*1024)throw Error('Solo JPEG, PNG o WebP, hasta 5 MB.');const ext=file.type.split('/')[1].replace('jpeg','jpg');let path='admin/'+crypto.randomUUID()+'.'+ext;let r=await client.storage.from('public-media').upload(path,file,{contentType:file.type,upsert:false});must(r.error);return client.storage.from('public-media').getPublicUrl(path).data.publicUrl},
 async createEvent(v){await this.ensureGuest();let photoUrl=v.photoUrl||'';if(v.photoFile instanceof File&&v.photoFile.size){if(!v.photoFile.type.startsWith('image/')||v.photoFile.size>5*1024*1024)throw Error('La imagen debe pesar hasta 5 MB.');let filename=this.userId+'/'+crypto.randomUUID()+'.'+(v.photoFile.type==='image/png'?'png':v.photoFile.type==='image/webp'?'webp':'jpg');let up=await client.storage.from('event-flyers').upload(filename,v.photoFile,{contentType:v.photoFile.type,upsert:false});must(up.error);photoUrl=client.storage.from('event-flyers').getPublicUrl(filename).data.publicUrl}
 const row={name:v.name,description:v.description,category:v.category,start:v.start,end:v.end,time_start:v.timeStart||null,time_end:v.timeEnd||null,region:v.region,organizer:v.organizer,contact:v.contact||null,link:v.website||null,website:v.website||null,instagram:v.instagram||null,phone:v.phone||null,lat:v.lat,lng:v.lng,is_free:v.free,price:v.price||null,photo_url:photoUrl,owner_id:this.userId,mode:'community',status:'published',review_status:'pending'};
 const result=await client.from('events').insert(row).select().single();must(result.error);return {...result.data,timeStart:result.data.time_start||'',timeEnd:result.data.time_end||'',free:result.data.is_free,photo:result.data.photo_url||''};},
 async uploadCommercialMedia(file){await this.ensureGuest();if(!(file instanceof File)||!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>5*1024*1024)throw Error('Foto inválida: JPEG, PNG o WebP hasta 5 MB.');let ext=file.type==='image/jpeg'?'jpg':file.type.split('/')[1],path=this.userId+'/'+crypto.randomUUID()+'.'+ext;let r=await client.storage.from('commercial-media').upload(path,file,{contentType:file.type,upsert:false});must(r.error);return client.storage.from('commercial-media').getPublicUrl(path).data.publicUrl},
 async createCommercialRequest(data){await this.ensureGuest();if(!['basic','premium','event'].includes(data.plan_code))throw Error('Plan desconocido.');const row={...data,owner_id:this.userId,status:'pending',payment_confirmed:false};const r=await client.from('commercial_requests').insert(row).select('id,plan_code,business_name,status,created_at').single();must(r.error);return r.data},
 async signInAdmin(email,password){if(!ready)throw Error('Falta configuración de Supabase.');let r=await client.auth.signInWithPassword({email,password});must(r.error);let chk=await client.from('admin_users').select('user_id').eq('user_id',r.data.user.id).maybeSingle();must(chk.error);if(!chk.data){await client.auth.signOut();throw Error('Esta cuenta no está autorizada como ADMIN.')}this.userId=r.data.user.id;return r.data.user},
 async verifyAdmin(){let {data:{user},error}=await client.auth.getUser();if(error||!user)return false;let r=await client.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();return !r.error&&Boolean(r.data)},
 async signOut(){if(client)await client.auth.signOut();this.userId=null}
};window.ILHA_BACKEND=backend;
})();

<script type="text/ilha-module">/* ILHA DA MAGIA shared smart location/contact/photo form fields */
(()=>{'use strict';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cleanUrl=(value,kind='website')=>{let s=String(value||'').trim();if(!s)return '';if(kind==='phone')return s.replace(/[^\d+]/g,'');if(kind==='instagram'){s=s.replace(/^@/,'');if(!/^https?:\/\//i.test(s)){s='https://www.instagram.com/'+s.replace(/^instagram\.com\//i,'').replace(/\/+$/,'')+'/';}}
if(kind==='website'&&!/^https?:\/\//i.test(s))s='https://'+s;try{let u=new URL(s);if(!['http:','https:'].includes(u.protocol)||u.username||u.password)throw Error('URL insegura');if(kind==='instagram'&&!/^(www\.)?instagram\.com$/i.test(u.hostname))throw Error('Instagram inválido');return u.href}catch{throw Error('Verificá el enlace de '+(kind==='instagram'?'Instagram':'sitio web')+'.')}};
const contacts=(row={})=>`<div class="smart-contacts"><h4>🔗 Enlaces y contacto</h4><label>Sitio web<input name="website" type="text" inputmode="url" placeholder="minegocio.com.br" value="${esc(row.website||'')}"></label><label>Instagram<input name="instagram" type="text" placeholder="@minegocio" value="${esc(row.instagram||'')}"></label><label>Teléfono / WhatsApp<input name="phone" type="tel" placeholder="+55 48 99999-9999" value="${esc(row.phone||'')}"></label><p class="smart-note">Escribí solo el usuario de Instagram o la dirección web. Nosotros armamos los enlaces.</p></div>`;
const location=(row={})=>`<section class="smart-location" data-smart-location><h4>📍 Ubicación sin coordenadas</h4><label>Buscar lugar o dirección<input data-place-search type="search" placeholder="Ej.: Praia da Joaquina, Florianópolis" value="${esc(row.region||'')}"></label><div class="smart-tools"><button type="button" data-place-action="search">🔎 Buscar</button><button type="button" data-place-action="gps">◎ Usar GPS</button><button type="button" data-place-action="map">🗺️ Marcar en mapa</button></div><div data-place-results role="status"></div><div data-place-map class="smart-map" hidden></div><p data-place-status class="smart-note">${row.lat!=null&&row.lng!=null?'Ubicación guardada. Podés cambiarla.':'Buscá y elegí un resultado, usá GPS o marcá el punto en el mapa.'}</p><input type="hidden" name="lat" value="${esc(row.lat??'')}"><input type="hidden" name="lng" value="${esc(row.lng??'')}"><input type="hidden" name="region" value="${esc(row.region||'')}"></section>`;
const media=(row={})=>`<section class="smart-media"><h4>📷 Imagen</h4><label>Elegir imagen del dispositivo<input type="file" name="imageFile" accept="image/jpeg,image/png,image/webp" data-preview-file></label><label>Tomar foto<input type="file" name="cameraFile" accept="image/*" capture="environment" data-preview-file></label><label>O pegar un enlace de imagen<input type="url" name="imageUrl" placeholder="https://.../foto.jpg" value="${esc(row.photo_url||'')}"></label><img data-preview-image alt="Vista previa" style="${row.photo_url?'':'display:none;'}max-width:100%;max-height:190px;object-fit:contain;border-radius:12px" ${row.photo_url?'src="'+esc(row.photo_url)+'"':''}><p class="smart-note">JPEG, PNG o WebP. Máximo 5 MB. Si elegís un archivo, tendrá prioridad sobre el enlace.</p></section>`;
const mapCache=new WeakMap();let lastLookup=0;
function start(root=document){root.addEventListener('change',e=>{let input=e.target.closest('[data-preview-file]');if(!input?.files?.[0])return;let section=input.closest('.smart-media');section.querySelectorAll('[data-preview-file]').forEach(i=>{if(i!==input)i.value=''});let file=input.files[0];if(!/^image\/(jpeg|png|webp)$/.test(file.type)||file.size>5*1024*1024){alert('Usá una foto JPEG, PNG o WebP de hasta 5 MB.');input.value='';return}let img=section.querySelector('[data-preview-image]');if(img.dataset.blob)URL.revokeObjectURL(img.dataset.blob);img.dataset.blob=URL.createObjectURL(file);img.src=img.dataset.blob;img.style.display='block';});
root.addEventListener('click',async e=>{let btn=e.target.closest('[data-place-action]');if(!btn)return;const box=btn.closest('[data-smart-location]');const action=btn.dataset.placeAction,st=box.querySelector('[data-place-status]'),results=box.querySelector('[data-place-results]');const put=(lat,lng,name)=>{box.querySelector('[name=lat]').value=String(lat);box.querySelector('[name=lng]').value=String(lng);box.querySelector('[name=region]').value=name||box.querySelector('[data-place-search]').value||'Florianópolis';box.querySelector('[data-place-search]').value=name||box.querySelector('[data-place-search]').value;st.textContent='✓ Punto seleccionado. Se guardará automáticamente.';results.innerHTML=''};
if(action==='gps'){if(!navigator.geolocation||!isSecureContext){st.textContent='El GPS requiere HTTPS y permiso de ubicación.';return}st.textContent='Solicitando ubicación…';navigator.geolocation.getCurrentPosition(p=>{put(p.coords.latitude,p.coords.longitude,box.querySelector('[data-place-search]').value||'Ubicación seleccionada por GPS');},err=>st.textContent='No se pudo obtener ubicación: '+err.message,{enableHighAccuracy:true,timeout:15000});return}
if(action==='search'){let q=box.querySelector('[data-place-search]').value.trim();if(q.length<3){st.textContent='Escribí al menos tres caracteres.';return}if(Date.now()-lastLookup<1200){st.textContent='Esperá un momento antes de buscar de nuevo.';return}lastLookup=Date.now();btn.disabled=true;st.textContent='Buscando en OpenStreetMap…';try{let url='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&countrycodes=br&q='+encodeURIComponent(q);let r=await fetch(url,{headers:{'Accept':'application/json'}});if(!r.ok)throw Error('Servicio de búsqueda no disponible');let data=await r.json();results.innerHTML=data.map((p,i)=>`<button type="button" data-choice="${i}">${esc(p.display_name)}</button>`).join('')||'<p>No hubo resultados. Probá con el mapa.</p>';st.textContent='Resultados © OpenStreetMap contributors · Nominatim. Elegí un lugar.';results.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>{let p=data[Number(b.dataset.choice)];put(p.lat,p.lon,p.display_name)}))}catch(err){st.textContent=err.message}finally{btn.disabled=false}return}
if(action==='map'){let node=box.querySelector('[data-place-map]');node.hidden=!node.hidden;if(node.hidden)return;if(!window.L){st.textContent='No se cargó el mapa. Verificá tu conexión.';return}let map=mapCache.get(node);if(!map){let lat=Number(box.querySelector('[name=lat]').value)||-27.5949,lng=Number(box.querySelector('[name=lng]').value)||-48.5482;map=L.map(node).setView([lat,lng],11);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:19}).addTo(map);let marker=L.marker([lat,lng],{draggable:true}).addTo(map);const update=p=>{marker.setLatLng(p);put(p.lat,p.lng,box.querySelector('[data-place-search]').value||'Punto marcado en el mapa')};map.on('click',ev=>update(ev.latlng));marker.on('dragend',()=>update(marker.getLatLng()));mapCache.set(node,map)}setTimeout(()=>map.invalidateSize(),100);st.textContent='Tocá el mapa o arrastrá el marcador.'}})}
function formLocation(fd){let lat=String(fd.get('lat')||''),lng=String(fd.get('lng')||'');return {lat:lat===''?null:Number(lat),lng:lng===''?null:Number(lng),region:String(fd.get('region')||'').trim()};}
function formContacts(fd){return {website:cleanUrl(fd.get('website'),'website'),instagram:cleanUrl(fd.get('instagram'),'instagram'),phone:cleanUrl(fd.get('phone'),'phone')};}
function formImage(fd){let file=fd.get('cameraFile') instanceof File&&fd.get('cameraFile').size?fd.get('cameraFile'):fd.get('imageFile');let url=String(fd.get('imageUrl')||'').trim();return {file:file instanceof File&&file.size?file:null,url:url?cleanUrl(url,'website'):''};}
window.ILHA_SMART={location,contacts,media,start,formLocation,formContacts,formImage,cleanUrl};
})();
</script>
<script type="text/ilha-module">(()=>{'use strict';const root=document.getElementById('admin');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const backend=window.ILHA_BACKEND,db=backend.client;let section='places',rows=[],editing=null,setting=null;let businessMap={},eventModeFilter='all',placeFormOpen=false;let reqSearch='',reqStatus='all',reqPlan='all',reqPage=0,reqPageSize=30,reqTotal=0,reqSummary={total:0,pending:0,payment:0,approved:0},reqHistory={};

/* Galería de lugares naturales: reutiliza el campo recommendations, sin cambiar el esquema. */
const ILHA_GALLERY_TAG='@@ILHA_GALLERY_V1@@';
function placeGalleryData(raw){let s=String(raw||''),at=s.lastIndexOf('\n'+ILHA_GALLERY_TAG);if(at<0)return {notes:s,images:[],videos:[]};try{const payload=JSON.parse(decodeURIComponent(s.slice(at+1+ILHA_GALLERY_TAG.length)));return {notes:s.slice(0,at),images:Array.isArray(payload.images)?payload.images.filter(x=>typeof x==='string'):[],videos:Array.isArray(payload.videos)?payload.videos.filter(x=>typeof x==='string'):[]}}catch{return {notes:s,images:[],videos:[]}}}
function mediaUrl(raw){try{const u=new URL(String(raw||'').trim());return ['https:','http:'].includes(u.protocol)&&!u.username&&!u.password?u.href:''}catch{return ''}}
function galleryEditor(place={}){const g=placeGalleryData(place.recommendations);const current=[...g.images.map(url=>({url,type:'image'})),...g.videos.map(url=>({url,type:'video'}))];return `<section class="admin-gallery" aria-label="Galería del lugar"><h3>📸 Fotos y videos del lugar</h3><p class="smart-note">Arrastrá fotos o videos desde tu computadora y soltálos en los recuadros, o elegilos con un clic. Podés revisar y quitar archivos antes de guardar.</p>${current.length?`<p class="smart-note">Contenido actual (desmarcá para quitar de la ficha):</p><div class="admin-gallery-existing">${current.map(m=>`<label class="admin-gallery-old"><input type="checkbox" name="gallery_keep" value="${esc(m.type+':'+m.url)}" checked><span>${m.type==='video'?'🎬 Video':'🖼️ Foto'}</span><small>${esc(m.url)}</small></label>`).join('')}</div>`:''}<div class="ilha-dropzone" data-dropzone="image" role="button" tabindex="0" aria-label="Arrastrar o seleccionar imágenes"><span class="ilha-drop-icon">🖼️</span><strong>Arrastrá tus fotos aquí</strong><small>JPG, PNG o WebP · hasta 5 MB por imagen</small><span class="ilha-file-action">📁 Seleccionar imágenes</span><input type="file" name="gallery_images" accept="image/jpeg,image/png,image/webp" multiple tabindex="-1" aria-label="Elegir imágenes"></div><div class="ilha-media-preview" data-media-preview="image"></div><p class="ilha-drop-message" data-media-message="image" aria-live="polite">Ninguna foto nueva seleccionada.</p><div class="ilha-dropzone" data-dropzone="video" role="button" tabindex="0" aria-label="Arrastrar o seleccionar videos"><span class="ilha-drop-icon">🎬</span><strong>Arrastrá tus videos aquí</strong><small>MP4, WebM o MOV · hasta 25 MB por video</small><span class="ilha-file-action">📁 Seleccionar videos</span><input type="file" name="gallery_videos" accept="video/mp4,video/webm,video/quicktime" multiple tabindex="-1" aria-label="Elegir videos"></div><div class="ilha-media-preview" data-media-preview="video"></div><p class="ilha-drop-message" data-media-message="video" aria-live="polite">Ningún video nuevo seleccionado.</p><label>Enlaces de imágenes adicionales (uno por línea)<textarea name="gallery_image_urls" rows="2" placeholder="https://.../foto.jpg"></textarea></label><label>Enlaces de videos MP4/WebM (uno por línea)<textarea name="gallery_video_urls" rows="2" placeholder="https://.../video.mp4"></textarea></label><p class="smart-note">Máximo 20 fotos adicionales y 8 videos por lugar, contando los existentes y los enlaces. La foto principal o portada se configura en el campo Imagen de arriba. Los archivos se suben a Supabase cuando presionás Guardar.</p></section>`}
async function galleryUpload(file,type){const image=type==='image',allowed=image?['image/jpeg','image/png','image/webp']:['video/mp4','video/webm','video/quicktime'],limit=image?5*1024*1024:25*1024*1024;if(!allowed.includes(file.type)||file.size>limit)throw Error('Archivo no permitido o demasiado grande: '+file.name);const ext=file.type==='image/jpeg'?'jpg':file.type==='video/quicktime'?'mov':file.type.split('/')[1];const path='admin/'+crypto.randomUUID()+'.'+ext;const r=await db.storage.from('public-media').upload(path,file,{contentType:file.type,upsert:false});if(r.error)throw Error('No se pudo subir '+file.name+': '+r.error.message+' (verificá los tipos permitidos y límites del bucket public-media).');return db.storage.from('public-media').getPublicUrl(path).data.publicUrl}
async function galleryForSubmit(fd,old){let g=placeGalleryData(old?.recommendations);let keep=new Set(fd.getAll('gallery_keep').map(String));let images=g.images.filter(url=>keep.has('image:'+url)),videos=g.videos.filter(url=>keep.has('video:'+url));const lines=key=>String(fd.get(key)||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);for(let u of lines('gallery_image_urls')){let safe=mediaUrl(u);if(!safe)throw Error('Enlace de imagen inválido: '+u);images.push(safe)}for(let u of lines('gallery_video_urls')){let safe=mediaUrl(u);if(!safe)throw Error('Enlace de video inválido: '+u);videos.push(safe)}const filesImages=fd.getAll('gallery_images').filter(x=>x instanceof File&&x.size),filesVideos=fd.getAll('gallery_videos').filter(x=>x instanceof File&&x.size);if(images.length+filesImages.length>20||videos.length+filesVideos.length>8)throw Error('Máximo 20 imágenes adicionales y 8 videos por lugar.');for(const f of [...filesImages,...filesVideos]){const image=filesImages.includes(f),allowed=image?['image/jpeg','image/png','image/webp']:['video/mp4','video/webm','video/quicktime'];if(!allowed.includes(f.type)||f.size>(image?5:25)*1024*1024)throw Error('Tipo o tamaño de archivo no permitido: '+f.name)}for(const file of filesImages)images.push(await galleryUpload(file,'image'));for(const file of filesVideos)videos.push(await galleryUpload(file,'video'));return {images:[...new Set(images)],videos:[...new Set(videos)]}}

shell(`<h2>${spec.title} · ${rows.length}</h2><div class="plain-card"><h3>${editing?'Editar registro':'Nuevo registro'}</h3><form class="admin-form" id="record-form">${spec.fields.map(f=>fieldHtml(f,editing||{})).join('')}${ILHA_SMART.location(editing||{})}${ILHA_SMART.contacts(editing||{})}${ILHA_SMART.media(editing||{})}<button type="submit" class="primary">${editing?'Guardar cambios':'Crear'}</button>${editing?'<button class="secondary" type="button" data-a="cancel">Cancelar edición</button>':''}</form></div><div style="margin-top:24px">${rows.length?rows.map(r=>`<div class="admin-row"><div><strong>${esc(r.name)}</strong><small>${esc(r.category||r.region||'')} · ${esc(r.status)}</small></div><button data-a="edit" data-id="${r.id}">Editar</button><button data-a="delete" data-id="${r.id}">Eliminar</button></div>`).join(''):'<div class="empty">Sin registros. Creá el primero desde el formulario.</div>'}</div>`)}
function filterPlaces(){const q=(document.getElementById('place-search-filter')?.value||'').trim().toLocaleLowerCase(),category=document.getElementById('place-category-filter')?.value||'',status=document.getElementById('place-status-filter')?.value||'';let visible=0;root.querySelectorAll('[data-place-row]').forEach(el=>{const show=(!q||el.dataset.name.toLocaleLowerCase().includes(q))&&(!category||el.dataset.category===category)&&(!status||el.dataset.status===status);el.hidden=!show;if(show)visible++});const count=document.getElementById('place-result-count');if(count)count.textContent='Mostrando '+visible+' de '+rows.length+' lugares';const empty=document.getElementById('place-no-results');if(empty)empty.hidden=visible>0;}

async function load(){editing=null;try{if(section==='settings'){let r=await db.from('app_settings').select('*').eq('id',1).single();if(r.error)throw r.error;setting=r.data;rows=[]}else if(section==='requests'){await loadRequestSummary();let q=db.from('commercial_requests').select('*',{count:'exact'}).order('created_at',{ascending:false});if(reqStatus!=='all')q=q.eq('status',reqStatus);if(reqPlan!=='all')q=q.eq('plan_code',reqPlan);if(reqSearch.trim())q=q.ilike('business_name','%'+reqSearch.trim().replace(/[\%_]/g,'\\$&')+'%');let r=await q.range(reqPage*reqPageSize,(reqPage+1)*reqPageSize-1);if(r.error)throw r.error;reqTotal=r.count||0;rows=r.data||[];if(reqPage>0&&!rows.length&&reqTotal){reqPage=Math.floor((reqTotal-1)/reqPageSize);return load()}reqHistory={};if(rows.length){let h=await db.from('commercial_request_history').select('request_id,previous_status,new_status,note,created_at').in('request_id',rows.map(x=>x.id)).order('created_at',{ascending:false});if(h.error)throw h.error;for(const el of h.data||[])(reqHistory[el.request_id]||=[]).push(el)}}else{let r=await db.from(section).select('*').order('created_at',{ascending:false}).limit(250);if(r.error)throw r.error;rows=r.data||[];if(section==='offers'||section==='missions')rows=rows.filter(x=>!!x.source_request_id);if(['offers','missions','events'].includes(section)){const ids=[...new Set(rows.map(x=>x.source_request_id).filter(Boolean))];businessMap={};if(ids.length){let owners=await db.from('commercial_requests').select('id,business_name,plan_code,status').in('id',ids);if(owners.error)throw owners.error;businessMap=Object.fromEntries((owners.data||[]).map(x=>[x.id,x]))}}}render()}catch(e){shell(`<div class="admin-err">No se pudieron cargar datos: ${esc(e.message)}</div>`)} }
root.addEventListener('submit',async e=>{let form=e.target.closest('form');if(!form)return;e.preventDefault();let f=new FormData(form);if(form.id==='admin-login'){try{await backend.signInAdmin(f.get('email'),f.get('password'));await load()}catch(err){login(err.message)}return}if(form.id==='request-filters'){reqSearch=String(f.get('search')||'').trim();reqStatus=String(f.get('status')||'all');reqPlan=String(f.get('plan')||'all');reqPage=0;await load();return}if(form.id==='setting-form'){let whatsapp=String(f.get('whatsapp')||'').replace(/\D/g,'');try{let r=await db.from('app_settings').update({whatsapp}).eq('id',1);if(r.error)throw r.error;await load();say('Contacto guardado.')}catch(err){say('Error: '+err.message)}return}if(form.id==='admin-free-event'){let btn=form.querySelector('[type=submit]');btn.disabled=true;try{let start=String(f.get('start')||''),end=String(f.get('end')||'');const today=new Date().toLocaleDateString('en-CA');if(start<today||end<start)throw Error('Revisá las fechas del evento.');let loc=ILHA_SMART.formLocation(f),contacts=ILHA_SMART.formContacts(f),image=ILHA_SMART.formImage(f);let photo='';if(image.file)photo=await backend.uploadPublicMedia(image.file);else if(image.url)photo=image.url;let reservation=String(f.get('reservationLink')||'').trim();let session=await db.auth.getUser();if(session.error||!session.data?.user?.id)throw Error('Debés iniciar sesión de administrador.');let row={owner_id:session.data.user.id,name:String(f.get('name')).trim(),description:String(f.get('description')).trim(),category:String(f.get('category')),start,end,time_start:f.get('time_start')||null,time_end:f.get('time_end')||null,organizer:String(f.get('organizer')).trim(),region:loc.region||'Florianópolis',lat:loc.lat,lng:loc.lng,contact:contacts.phone||null,phone:contacts.phone||null,website:contacts.website||null,instagram:contacts.instagram||null,link:reservation?ILHA_SMART.cleanUrl(reservation):contacts.website||null,photo_url:photo||null,is_free:true,mode:'community',status:'published',review_status:'pending',price:null};let save=await db.from('events').insert(row).select('id').single();if(save.error)throw save.error;await load();say('Evento GRATIS publicado y registrado para revisión.')}catch(err){say('No se pudo publicar: '+err.message)}finally{btn.disabled=false}return}if(form.id==='record-form'){let saveButton=form.querySelector('button[type=submit]');if(saveButton?.disabled)return;if(saveButton)saveButton.disabled=true;let row={};for(let [key,label,type] of specs[section].fields){let val=String(f.get(key)??'').trim();row[key]=type==='number'?(val===''?null:Number(val)):val||null}try{const loc=ILHA_SMART.formLocation(f),links=ILHA_SMART.formContacts(f),image=ILHA_SMART.formImage(f);Object.assign(row,links);if(section==='places'||section==='missions'||section==='offers')Object.assign(row,loc);if(section==='offers')row.contact=links.phone||null;if(section==='offers'&&row.link)row.link=ILHA_SMART.cleanUrl(row.link);if(section==='places'){const gallery=await galleryForSubmit(f,editing);row.recommendations=encodePlaceGallery(row.recommendations,gallery)}if(image.file)row.photo_url=await backend.uploadPublicMedia(image.file);else if(image.url)row.photo_url=image.url;else if(!editing)row.photo_url=null;let r=editing?await db.from(section).update(row).eq('id',editing.id):await db.from(section).insert(row);if(r.error)throw r.error;placeFormOpen=false;await load();say('Registro guardado correctamente.')}catch(err){say('Error: '+err.message)}finally{if(saveButton?.isConnected)saveButton.disabled=false}}});
/* Selector visual para la galería: arrastrar/soltar, selección múltiple acumulativa y vista previa. */
const ilhaMediaSelections=new WeakMap();
function ilhaMediaState(input){let state=ilhaMediaSelections.get(input);if(!state){state={files:[],urls:[]};ilhaMediaSelections.set(input,state)}return state}
function ilhaMediaRender(zone){const input=zone.querySelector('input[type=file]'),type=zone.dataset.dropzone,state=ilhaMediaState(input),preview=zone.parentElement.querySelector('[data-media-preview="'+type+'"]'),message=zone.parentElement.querySelector('[data-media-message="'+type+'"]');state.urls.forEach(u=>URL.revokeObjectURL(u));state.urls=[];preview.replaceChildren();state.files.forEach((file,index)=>{const item=document.createElement('div');item.className='ilha-media-item';const url=URL.createObjectURL(file);state.urls.push(url);const media=document.createElement(type==='image'?'img':'video');media.src=url;if(type==='image'){media.alt='Vista previa de '+file.name}else{media.controls=true;media.preload='metadata'}item.appendChild(media);const name=document.createElement('span');name.className='ilha-file-name';name.title=file.name;name.textContent=file.name;item.appendChild(name);const remove=document.createElement('button');remove.type='button';remove.textContent='✕ Quitar';remove.addEventListener('click',()=>{state.files.splice(index,1);ilhaMediaSync(input,state);ilhaMediaRender(zone)});item.appendChild(remove);preview.appendChild(item)});if(!message.classList.contains('error'))message.textContent=state.files.length?state.files.length+' '+(type==='image'?'foto(s)':'video(s)')+' lista(s) para subir al guardar.':'Ningún archivo nuevo seleccionado.'}
function ilhaMediaSync(input,state){const dt=new DataTransfer();state.files.forEach(file=>dt.items.add(file));input.files=dt.files}
function ilhaMediaAdd(zone,incoming){const input=zone.querySelector('input[type=file]'),type=zone.dataset.dropzone,state=ilhaMediaState(input),message=zone.parentElement.querySelector('[data-media-message="'+type+'"]'),allowed=type==='image'?['image/jpeg','image/png','image/webp']:['video/mp4','video/webm','video/quicktime'],max=type==='image'?5*1024*1024:25*1024*1024;let rejected=[];for(const file of incoming){if(!allowed.includes(file.type)||file.size>max){rejected.push(file.name);continue}if(!state.files.some(f=>f.name===file.name&&f.size===file.size&&f.lastModified===file.lastModified))state.files.push(file)}ilhaMediaSync(input,state);message.classList.toggle('error',rejected.length>0);message.textContent=rejected.length?'Archivos no admitidos (tipo o tamaño): '+rejected.join(', '):'';ilhaMediaRender(zone)}
root.addEventListener('click',e=>{const zone=e.target.closest('[data-dropzone]');if(zone&&!e.target.closest('input'))zone.querySelector('input[type=file]').click()});
root.addEventListener('keydown',e=>{const zone=e.target.closest('[data-dropzone]');if(zone&&(e.key==='Enter'||e.key===' ')){e.preventDefault();zone.querySelector('input[type=file]').click()}});
root.addEventListener('change',e=>{const input=e.target;if(!input.matches('[data-dropzone] input[type=file]'))return;const files=Array.from(input.files||[]),zone=input.closest('[data-dropzone]');ilhaMediaAdd(zone,files)});
for(const name of ['dragenter','dragover','dragleave','drop'])root.addEventListener(name,e=>{const zone=e.target.closest('[data-dropzone]');if(!zone)return;e.preventDefault();e.stopPropagation();if(name==='dragenter'||name==='dragover'){zone.classList.add('is-dragging');if(e.dataTransfer)e.dataTransfer.dropEffect='copy'}else if(name==='dragleave'){if(!zone.contains(e.relatedTarget))zone.classList.remove('is-dragging')}else{zone.classList.remove('is-dragging');ilhaMediaAdd(zone,Array.from(e.dataTransfer?.files||[]))}});
root.addEventListener('input',e=>{if(e.target.id==='place-search-filter')filterPlaces()});root.addEventListener('change',e=>{if(['place-category-filter','place-status-filter'].includes(e.target.id))filterPlaces();if(e.target.id==='event-mode-filter'){eventModeFilter=e.target.value;render()}});ILHA_SMART.start(root);root.addEventListener('click',async e=>{let el=e.target.closest('[data-a]');if(!el)return;let action=el.dataset.a,id=el.dataset.id;if(action==='new-place'){editing=null;placeFormOpen=true;render();document.getElementById('place-editor')?.scrollIntoView({behavior:'smooth'});return}if(action==='close-place-form'){editing=null;placeFormOpen=false;render();return}if(action==='refresh'){await load();return}if(action==='request-detail'){let e2=document.getElementById('req-detail-'+id);if(e2)e2.hidden=!e2.hidden;return}if(action==='request-reset'){reqSearch='';reqPlan='all';reqStatus='all';reqPage=0;await load();return}if(action==='request-refresh'){await load();return}if(action==='request-prev'){if(reqPage>0){reqPage--;await load()}return}if(action==='request-next'){if((reqPage+1)*reqPageSize<reqTotal){reqPage++;await load()}return}if(action==='request-status'||action==='request-save-note'){let current=rows.find(r=>r.id===id);if(!current)return;let value=el.dataset.value;let note=document.getElementById('req-note-'+id)?.value?.trim()||'';if(note.length>2000){say('Máximo 2000 caracteres.');return}if(value==='approved'&&!current.payment_confirmed){say('Primero confirmá el pago.');return}if(value==='approved'&&!confirm('¿Confirmás aprobar y publicar esta solicitud?'))return;const patch={reviewer_note:note};if(action==='request-status'){if(value==='payment_confirmed'){patch.payment_confirmed=true;patch.status='payment_confirmed'}else{patch.status=value;if(value==='approved')patch.approved_at=new Date().toISOString()}}let result=await db.from('commercial_requests').update(patch).eq('id',id).select('id').single();if(result.error)say('Error: '+result.error.message);else{await load();say(value==='approved'?'Solicitud aprobada y publicada.':'Solicitud actualizada.')}return}if(action==='logout'){await backend.signOut();login();return}if(action==='tab'){section=el.dataset.tab;placeFormOpen=false;await load();return}if(action==='edit'){editing=rows.find(x=>x.id===id)||null;placeFormOpen=true;render();document.getElementById('place-editor')?.scrollIntoView({behavior:'smooth'});return}if(action==='cancel'){editing=null;render();return}if(action==='delete'){if(!confirm('¿Eliminar permanentemente este registro?'))return;let r=await db.from(section).delete().eq('id',id);if(r.error)say('Error: '+r.error.message);else{await load();say('Registro eliminado.')}return}if(action==='review'){let v=el.dataset.value;let r=await db.from('events').update({review_status:v,status:v==='rejected'?'hidden':'published'}).eq('id',id);if(r.error)say('Error: '+r.error.message);else{await load();say('Revisión actualizada.')}}});
(async()=>{if(!backend.ready){login(backend.connectionMessage());return}if(await backend.verifyAdmin())await load();else login()})();
})();
