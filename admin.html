<script type="text/ilha-module">/* Supabase bridge: no network mutations when not configured. Publishable key only. */
(()=>{'use strict';
const cfg=window.ILHA_CONFIG||{},sdk=window.supabase;
const ready=Boolean(sdk?.createClient&&/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(cfg.supabaseUrl||'')&&cfg.supabasePublishableKey);
const client=ready?sdk.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey):null;
const connectionMessage=()=>!sdk?.createClient?'No se pudo cargar la biblioteca Supabase. Revisá conexión a Internet o bloqueadores.':!cfg.supabasePublishableKey?'Falta la clave pública de Supabase.':'No se pudo iniciar la conexión Supabase.';
const must=(error)=>{if(error)throw error};
const backend={ready,client,userId:null,connectionMessage,
 async ensureGuest(){if(!ready)throw Error('Falta la conexión Supabase.');let {data:{session},error}=await client.auth.getSession();must(error);if(!session){let result=await client.auth.signInAnonymously();must(result.error);session=result.data.session}this.userId=session?.user?.id||null;return this.userId},
 async loadPublic(){if(!ready)return{places:[],events:[],settings:{}};const [p,e,c,o,m]=await Promise.all([client.from('places').select('*').eq('status','published').order('name'),client.from('events').select('*').eq('status','published').gte('end',new Date().toISOString().slice(0,10)).order('start'),client.from('app_settings').select('whatsapp').eq('id',1).maybeSingle(),client.from('offers').select('*').eq('status','published'),client.from('missions').select('*').eq('status','published')]);must(p.error);must(e.error);must(c.error);must(o.error);must(m.error);let auth=await client.auth.getUser();this.userId=auth.data?.user?.id||null;return {places:(p.data||[]).map(x=>({...x,description:x.description||'',recommendations:x.recommendations||'',region:x.region||'Florianópolis'})),events:(e.data||[]).map(x=>({...x,timeStart:x.time_start||'',timeEnd:x.time_end||'',free:x.is_free,photo:x.photo_url||'',review:x.review_status})),settings:c.data||{},offers:o.data||[],missions:m.data||[]}},
 async uploadPublicMedia(file){if(!ready)throw Error('Supabase no está disponible.');if(!file||!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>5*1024*1024)throw Error('Solo JPEG, PNG o WebP, hasta 5 MB.');const ext=file.type.split('/')[1].replace('jpeg','jpg');let path='admin/'+crypto.randomUUID()+'.'+ext;let r=await client.storage.from('public-media').upload(path,file,{contentType:file.type,upsert:false});must(r.error);return client.storage.from('public-media').getPublicUrl(path).data.publicUrl},

 const row={name:v.name,description:v.description,category:v.category,start:v.start,end:v.end,time_start:v.timeStart||null,time_end:v.timeEnd||null,region:v.region,organizer:v.organizer,contact:v.contact||null,link:v.website||null,website:v.website||null,instagram:v.instagram||null,phone:v.phone||null,lat:v.lat,lng:v.lng,is_free:v.free,price:v.price||null,photo_url:photoUrl,owner_id:this.userId,mode:'community',status:'published',review_status:'pending'};
 const result=await client.from('events').insert(row).select().single();must(result.error);return {...result.data,timeStart:result.data.time_start||'',timeEnd:result.data.time_end||'',free:result.data.is_free,photo:result.data.photo_url||''};},
 async uploadCommercialMedia(file){await this.ensureGuest();if(!(file instanceof File)||!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>5*1024*1024)throw Error('Foto inválida: JPEG, PNG o WebP hasta 5 MB.');let ext=file.type==='image/jpeg'?'jpg':file.type.split('/')[1],path=this.userId+'/'+crypto.randomUUID()+'.'+ext;let r=await client.storage.from('commercial-media').upload(path,file,{contentType:file.type,upsert:false});must(r.error);return client.storage.from('commercial-media').getPublicUrl(path).data.publicUrl},

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cleanUrl=(value,kind='website')=>{let s=String(value||'').trim();if(!s)return '';if(kind==='phone')return s.replace(/[^\d+]/g,'');if(kind==='instagram'){s=s.replace(/^@/,'');if(!/^https?:\/\//i.test(s)){s='https://www.instagram.com/'+s.replace(/^instagram\.com\//i,'').replace(/\/+$/,'')+'/';}}
if(kind==='website'&&!/^https?:\/\//i.test(s))s='https://'+s;try{let u=new URL(s);if(!['http:','https:'].includes(u.protocol)||u.username||u.password)throw Error('URL insegura');if(kind==='instagram'&&!/^(www\.)?instagram\.com$/i.test(u.hostname))throw Error('Instagram inválido');return u.href}catch{throw Error('Verificá el enlace de '+(kind==='instagram'?'Instagram':'sitio web')+'.')}};
const contacts=(row={})=>`<div class="smart-contacts"><h4>🔗 Enlaces y contacto</h4><label>Sitio web<input name="website" type="text" inputmode="url" placeholder="minegocio.com.br" value="${esc(row.website||'')}"></label><label>Instagram<input name="instagram" type="text" placeholder="@minegocio" value="${esc(row.instagram||'')}"></label><label>Teléfono / WhatsApp<input name="phone" type="tel" placeholder="+55 48 99999-9999" value="${esc(row.phone||'')}"></label><p class="smart-note">Escribí solo el usuario de Instagram o la dirección web. Nosotros armamos los enlaces.</p></div>`;
const location=(row={})=>`<section class="smart-location" data-smart-location><h4>📍 Ubicación sin coordenadas</h4><label>Buscar lugar o dirección<input data-place-search type="search" placeholder="Ej.: Praia da Joaquina, Florianópolis" value="${esc(row.region||'')}"></label><div class="smart-tools"><button type="button" data-place-action="search">🔎 Buscar</button><button type="button" data-place-action="gps">◎ Usar GPS</button><button type="button" data-place-action="map">🗺️ Marcar en mapa</button></div><div data-place-results role="status"></div><div data-place-map class="smart-map" hidden></div><p data-place-status class="smart-note">${row.lat!=null&&row.lng!=null?'Ubicación guardada. Podés cambiarla.':'Buscá y elegí un resultado, usá GPS o marcá el punto en el mapa.'}</p><input type="hidden" name="lat" value="${esc(row.lat??'')}"><input type="hidden" name="lng" value="${esc(row.lng??'')}"><input type="hidden" name="region" value="${esc(row.region||'')}"></section>`;
const media=(row={})=>`<section class="smart-media"><h4>📷 Imagen</h4><label>Elegir imagen del dispositivo<input type="file" name="imageFile" accept="image/jpeg,image/png,image/webp" data-preview-file></label><label>Tomar foto<input type="file" name="cameraFile" accept="image/*" capture="environment" data-preview-file></label><label>O pegar un enlace de imagen<input type="url" name="imageUrl" placeholder="https://.../foto.jpg" value="${esc(row.photo_url||'')}"></label><img data-preview-image alt="Vista previa" style="${row.photo_url?'':'display:none;'}max-width:100%;max-height:190px;object-fit:contain;border-radius:12px" ${row.photo_url?'src="'+esc(row.photo_url)+'"':''}><p class="smart-note">JPEG, PNG o WebP. Máximo 5 MB. Si elegís un archivo, tendrá prioridad sobre el enlace.</p></section>`;
const mapCache=new WeakMap();let lastLookup=0;
function start(root=document){root.addEventListener('change',e=>{let input=e.target.closest('[data-preview-file]');if(!input?.files?.[0])return;let section=input.closest('.smart-media');section.querySelectorAll('[data-preview-file]').forEach(i=>{if(i!==input)i.value=''});let file=input.files[0];if(!/^image\/(jpeg|png|webp)$/.test(file.type)||file.size>5*1024*1024){alert('Usá una foto JPEG, PNG o WebP de hasta 5 MB.');input.value='';return}let img=section.querySelector('[data-preview-image]');if(img.dataset.blob)URL.revokeObjectURL(img.dataset.blob);img.dataset.blob=URL.createObjectURL(file);img.src=img.dataset.blob;img.style.display='block';});
root.addEventListener('click',async e=>{let btn=e.target.closest('[data-place-action]');if(!btn)return;const box=btn.closest('[data-smart-location]');const action=btn.dataset.placeAction,st=box.querySelector('[data-place-status]'),results=box.querySelector('[data-place-results]');const put=(lat,lng,name)=>{box.querySelector('[name=lat]').value=String(lat);box.querySelector('[name=lng]').value=String(lng);box.querySelector('[name=region]').value=name||box.querySelector('[data-place-search]').value||'Florianópolis';box.querySelector('[data-place-search]').value=name||box.querySelector('[data-place-search]').value;st.textContent='✓ Punto seleccionado. Se guardará automáticamente.';results.innerHTML=''};
if(action==='gps'){if(!navigator.geolocation||!isSecureContext){st.textContent='El GPS requiere HTTPS y permiso de ubicación.';return}st.textContent='Solicitando ubicación…';navigator.geolocation.getCurrentPosition(p=>{put(p.coords.latitude,p.coords.longitude,box.querySelector('[data-place-search]').value||'Ubicación seleccionada por GPS');},err=>st.textContent='No se pudo obtener ubicación: '+err.message,{enableHighAccuracy:true,timeout:15000});return}
if(action==='search'){let q=box.querySelector('[data-place-search]').value.trim();if(q.length<3){st.textContent='Escribí al menos tres caracteres.';return}if(Date.now()-lastLookup<1200){st.textContent='Esperá un momento antes de buscar de nuevo.';return}lastLookup=Date.now();btn.disabled=true;st.textContent='Buscando en OpenStreetMap…';try{let url='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&countrycodes=br&q='+encodeURIComponent(q);let r=await fetch(url,{headers:{'Accept':'application/json'}});if(!r.ok)throw Error('Servicio de búsqueda no disponible');let data=await r.json();results.innerHTML=data.map((p,i)=>`<button type="button" data-choice="${i}">${esc(p.display_name)}</button>`).join('')||'<p>No hubo resultados. Probá con el mapa.</p>';st.textContent='Resultados © OpenStreetMap contributors · Nominatim. Elegí un lugar.';results.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>{let p=data[Number(b.dataset.choice)];put(p.lat,p.lon,p.display_name)}))}catch(err){st.textContent=err.message}finally{btn.disabled=false}return}
if(action==='map'){let node=box.querySelector('[data-place-map]');node.hidden=!node.hidden;if(node.hidden)return;if(!window.L){st.textContent='No se cargó el mapa. Verificá tu conexión.';return}let map=mapCache.get(node);if(!map){let lat=Number(box.querySelector('[name=lat]').value)||-27.5949,lng=Number(box.querySelector('[name=lng]').value)||-48.5482;map=L.map(node).setView([lat,lng],11);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:19}).addTo(map);let marker=L.marker([lat,lng],{draggable:true}).addTo(map);const update=p=>{marker.setLatLng(p);put(p.lat,p.lng,box.querySelector('[data-place-search]').value||'Punto marcado en el mapa')};map.on('click',ev=>update(ev.latlng));marker.on('dragend',()=>update(marker.getLatLng()));mapCache.set(node,map)}setTimeout(()=>map.invalidateSize(),100);st.textContent='Tocá el mapa o arrastrá el marcador.'}})}
function formLocation(fd){let lat=String(fd.get('lat')||''),lng=String(fd.get('lng')||'');return {lat:lat===''?null:Number(lat),lng:lng===''?null:Number(lng),region:String(fd.get('region')||'').trim()};}
function formContacts(fd){return {website:cleanUrl(fd.get('website'),'website'),instagram:cleanUrl(fd.get('instagram'),'instagram'),phone:cleanUrl(fd.get('phone'),'phone')};}
function formImage(fd){let file=fd.get('cameraFile') instanceof File&&fd.get('cameraFile').size?fd.get('cameraFile'):fd.get('imageFile');let url=String(fd.get('imageUrl')||'').trim();return {file:file instanceof File&&file.size?file:null,url:url?cleanUrl(url,'website'):''};}
window.ILHA_SMART={location,contacts,media,start,formLocation,formContacts,formImage,cleanUrl};
})();
</script>
<script type="text/ilha-module">(()=>{'use strict';const root=document.getElementById('admin');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const backend=window.ILHA_BACKEND,db=backend.client;let section='places',rows=[],editing=null,setting=null;
const say=s=>{let el=document.createElement('div');el.className='admin-msg';el.textContent=s;root.prepend(el);setTimeout(()=>el.remove(),5500)};
function login(message=''){root.innerHTML=`<div class="plain-card" style="max-width:480px;margin:30px auto"><h2>Acceso privado</h2><p>Ingresá con una cuenta autorizada en Supabase. No es el acceso público de visitantes.</p><form class="admin-form" id="admin-login"><label>Email<input name="email" type="email" required autocomplete="email"></label><label>Contraseña<input name="password" type="password" required autocomplete="current-password"></label><button class="primary" type="submit">Ingresar</button><p class="admin-err">${esc(message)}</p></form></div>`}
const specs={places:{title:'Lugares naturales',fields:[['name','Nombre','text',true],['category','Categoría','select',true],['description','Descripción','textarea',false],['recommendations','Recomendaciones','textarea',false],['status','Estado','status',true]]},offers:{title:'Ofertas',fields:[['name','Título','text',true],['description','Descripción','textarea',false],['link','Enlace de la oferta','text',false],['starts_on','Desde','date',false],['ends_on','Hasta','date',false],['status','Estado','status',true]]},missions:{title:'Misiones',fields:[['name','Título','text',true],['description','Descripción','textarea',false],['instructions','Instrucciones','textarea',false],['starts_on','Desde','date',false],['ends_on','Hasta','date',false],['status','Estado','status',true]]}};
function shell(inner){root.innerHTML=`<div class="row-between"><strong>Administración de contenidos</strong><button class="secondary" data-a="logout">Cerrar sesión</button></div><nav class="admin-nav">${[['requests','Solicitudes'],['places','Lugares'],['events','Eventos'],['offers','Ofertas'],['missions','Misiones'],['settings','Contacto']].map(([k,v])=>`<button data-a="tab" data-tab="${k}" class="${section===k?'active':''}">${v}</button>`).join('')}</nav><div id="admin-body">${inner}</div>`}
function fieldHtml([key,label,type,required],obj={}){let val=obj[key]??'',attrs=required?'required':'',body='';if(type==='textarea')body=`<textarea name="${key}" ${attrs}>${esc(val)}</textarea>`;else if(type==='select')body=`<select name="${key}">${['Praias','Trilhas','Mirantes','Cachoeiras','Piscinas Naturais','Parques','Natureza','Ilhas'].map(c=>`<option ${val===c?'selected':''}>${c}</option>`).join('')}</select>`;else if(type==='status')body=`<select name="${key}">${['draft','published','hidden'].map(c=>`<option ${val===c?'selected':''} value="${c}">${c==='draft'?'Borrador':c==='published'?'Publicado':'Oculto'}</option>`).join('')}</select>`;else body=`<input type="${type}" name="${key}" ${attrs} ${type==='number'?'step="any"':''} value="${esc(val)}">`;return `<label>${label}${body}</label>`}
function render(){if(section==='requests'){shell(`<h2>Solicitudes comerciales · ${rows.length}</h2><p>Solo publicar después de confirmar el pago y aprobar. Las publicaciones se crean automáticamente desde Supabase cuando aprobás.</p>${rows.length?rows.map(r=>{let details=r.plan_code==='event'?[r.payload?.event]:r.payload?.items||[];return `<div class="plain-card" style="margin:14px 0"><div class="row-between"><strong>${esc(r.business_name)} · ${esc(r.plan_code.toUpperCase())}</strong><span class="tag">${esc(r.status)}</span></div><small>${esc(r.id)} · ${esc(r.created_at?.slice(0,10)||'')}</small><p>Responsable: ${esc(r.responsible_name)} · ${esc(r.contact_phone)}${r.contact_email?' · '+esc(r.contact_email):''}</p><p>📍 ${esc(r.region||'Sin ubicación')}</p>${r.lat!=null&&r.lng!=null?`<a target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(r.lat+','+r.lng)}">Abrir Google Maps ↗</a>`:''}<div>${r.website?`<a href="${esc(r.website)}" target="_blank" rel="noopener noreferrer">Sitio web ↗</a>`:''} ${r.instagram?`<a href="${esc(r.instagram)}" target="_blank" rel="noopener noreferrer">Instagram ↗</a>`:''}</div>${details.map(d=>`<div class="notice" style="margin:12px 0"><b>${esc(d?.kind||r.payload?.event?.category||'Publicación')}: ${esc(d?.name||'')}</b><p>${esc(d?.description||'')}</p>${d?.benefit?`<p>Beneficio: ${esc(d.benefit)}</p>`:''}${d?.instructions?`<p>Instrucciones: ${esc(d.instructions)}</p>`:''}${d?.price?`<p>Precio: ${esc(d.price)}</p>`:''}${d?.start?`<p>Fecha: ${esc(d.start)} a ${esc(d.end)}</p>`:''}${d?.photo_url?`<img src="${esc(d.photo_url)}" loading="lazy" alt="Foto de publicación" style="max-height:180px;max-width:100%;border-radius:12px">`:''}</div>`).join('')}<p>Pago: <b>${r.payment_confirmed?'CONFIRMADO':'PENDIENTE'}</b></p><div class="smart-tools" style="display:flex;flex-wrap:wrap;gap:7px"><a target="_blank" rel="noopener noreferrer" href="https://wa.me/${esc(String(r.contact_phone).replace(/\D/g,''))}?text=${encodeURIComponent('Hola, soy de ILHA DA MAGIA. Te contacto por tu solicitud '+r.id)}">WhatsApp ↗</a>${r.status!=='approved'&&r.status!=='rejected'?`<button data-a="request-status" data-id="${r.id}" data-value="in_contact">En contacto</button><button data-a="request-status" data-id="${r.id}" data-value="awaiting_payment">Esperando pago</button><button data-a="request-status" data-id="${r.id}" data-value="payment_confirmed">Confirmar pago</button><button data-a="request-status" data-id="${r.id}" data-value="approved" ${r.payment_confirmed?'':'disabled title="Primero confirmá el pago"'}>Aprobar y publicar</button><button data-a="request-status" data-id="${r.id}" data-value="changes_requested">Pedir cambios</button><button data-a="request-status" data-id="${r.id}" data-value="rejected">Rechazar</button>`:''}</div></div>`}).join(''):'<div class="empty">Todavía no hay solicitudes.</div>'}`);return}if(section==='settings'){shell(`<div class="plain-card"><h2>Contacto comercial</h2><p>Se mostrará en INDEX como enlace de WhatsApp.</p><form class="admin-form" id="setting-form"><label>WhatsApp con código de país (solo números)<input name="whatsapp" inputmode="tel" maxlength="20" value="${esc(setting?.whatsapp||'')}"></label><button class="primary">Guardar contacto</button></form></div>`);return}if(section==='events'){shell(`<h2>Eventos · ${rows.length}</h2><p>Los eventos comunitarios se publican inmediatamente y llegan pendientes de revisión. Los vencidos se conservan aquí.</p>${rows.length?rows.map(item=>`<div class="admin-row"><div><strong>${esc(item.name)}</strong><small>${esc(item.region)} · ${esc(item.start)} a ${esc(item.end)}</small><small>Publicación: ${esc(item.status)} · Revisión: ${esc(item.review_status)} · ${esc(item.mode)}</small></div><button data-a="review" data-id="${item.id}" data-value="approved">Aprobar</button><button data-a="review" data-id="${item.id}" data-value="rejected">Ocultar</button></div>`).join(''):'<div class="empty">No hay eventos cargados.</div>'}`);return}
let spec=specs[section];shell(`<h2>${spec.title} · ${rows.length}</h2><div class="plain-card"><h3>${editing?'Editar registro':'Nuevo registro'}</h3><form class="admin-form" id="record-form">${spec.fields.map(f=>fieldHtml(f,editing||{})).join('')}${ILHA_SMART.location(editing||{})}${ILHA_SMART.contacts(editing||{})}${ILHA_SMART.media(editing||{})}<button type="submit" class="primary">${editing?'Guardar cambios':'Crear'}</button>${editing?'<button class="secondary" type="button" data-a="cancel">Cancelar edición</button>':''}</form></div><div style="margin-top:24px">${rows.length?rows.map(r=>`<div class="admin-row"><div><strong>${esc(r.name)}</strong><small>${esc(r.category||r.region||'')} · ${esc(r.status)}</small></div><button data-a="edit" data-id="${r.id}">Editar</button><button data-a="delete" data-id="${r.id}">Eliminar</button></div>`).join(''):'<div class="empty">Sin registros. Creá el primero desde el formulario.</div>'}</div>`)}
async function load(){editing=null;try{if(section==='settings'){let r=await db.from('app_settings').select('*').eq('id',1).single();if(r.error)throw r.error;setting=r.data;rows=[]}else {let r=await db.from(section).select('*').order('created_at',{ascending:false}).limit(250);if(r.error)throw r.error;rows=r.data||[]}render()}catch(e){shell(`<div class="admin-err">No se pudieron cargar datos: ${esc(e.message)}</div>`)} }
root.addEventListener('submit',async e=>{let form=e.target.closest('form');if(!form)return;e.preventDefault();let f=new FormData(form);if(form.id==='admin-login'){try{await backend.signInAdmin(f.get('email'),f.get('password'));await load()}catch(err){login(err.message)}return}if(form.id==='setting-form'){let whatsapp=String(f.get('whatsapp')||'').replace(/\D/g,'');try{let r=await db.from('app_settings').update({whatsapp}).eq('id',1);if(r.error)throw r.error;await load();say('Contacto guardado.')}catch(err){say('Error: '+err.message)}return}if(form.id==='record-form'){let row={};for(let [key,label,type] of specs[section].fields){let val=String(f.get(key)??'').trim();row[key]=type==='number'?(val===''?null:Number(val)):val||null}try{const loc=ILHA_SMART.formLocation(f),links=ILHA_SMART.formContacts(f),image=ILHA_SMART.formImage(f);Object.assign(row,links);if(section==='places'||section==='missions'||section==='offers')Object.assign(row,loc);if(section==='offers')row.contact=links.phone||null;if(section==='offers'&&row.link)row.link=ILHA_SMART.cleanUrl(row.link);if(image.file)row.photo_url=await backend.uploadPublicMedia(image.file);else if(image.url)row.photo_url=image.url;else if(!editing)row.photo_url=null;let r=editing?await db.from(section).update(row).eq('id',editing.id):await db.from(section).insert(row);if(r.error)throw r.error;await load();say('Registro guardado correctamente.')}catch(err){say('Error: '+err.message)}}});
ILHA_SMART.start(root);root.addEventListener('click',async e=>{let el=e.target.closest('[data-a]');if(!el)return;let action=el.dataset.a,id=el.dataset.id;if(action==='request-status'){let current=rows.find(r=>r.id===id);if(!current)return;let value=el.dataset.value;if(value==='approved'&&!current.payment_confirmed){say('Primero confirmá el pago.');return}if(value==='approved'&&!confirm('¿Confirmás aprobar y publicar esta solicitud?'))return;let patch=value==='payment_confirmed'?{payment_confirmed:true,status:'payment_confirmed'}:{status:value};if(value==='approved')patch.approved_at=new Date().toISOString();let result=await db.from('commercial_requests').update(patch).eq('id',id);if(result.error)say('Error: '+result.error.message);else{await load();say(value==='approved'?'Solicitud aprobada y publicación activada.':'Estado actualizado.')}return}if(action==='logout'){await backend.signOut();login();return}if(action==='tab'){section=el.dataset.tab;await load();return}if(action==='edit'){editing=rows.find(x=>x.id===id)||null;render();window.scrollTo({top:0,behavior:'smooth'});return}if(action==='cancel'){editing=null;render();return}if(action==='delete'){if(!confirm('¿Eliminar permanentemente este registro?'))return;let r=await db.from(section).delete().eq('id',id);if(r.error)say('Error: '+r.error.message);else{await load();say('Registro eliminado.')}return}if(action==='review'){let v=el.dataset.value;let r=await db.from('events').update({review_status:v,status:v==='rejected'?'hidden':'published'}).eq('id',id);if(r.error)say('Error: '+r.error.message);else{await load();say('Revisión actualizada.')}}});
(async()=>{if(!backend.ready){login(backend.connectionMessage());return}if(await backend.verifyAdmin())await load();else login()})();
})();
</script>
<script>
window.addEventListener('DOMContentLoaded',async()=>{
 const load=src=>new Promise((res,rej)=>{let s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('No se pudo cargar '+src));document.head.appendChild(s)});
 async function sources(list){for(const u of list){try{await load(u);return true}catch(e){console.warn(e.message)}}return false}
 const sdkOk=await sources(['https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js','https://unpkg.com/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js']);
 await sources(['https://unpkg.com/leaflet@1.9.4/dist/leaflet.js','https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js']);
 try {for(const script of document.querySelectorAll('script[type="text/ilha-module"]')) {new Function(script.textContent)();}}catch(e){console.error(e);const el=document.getElementById('admin')||document.getElementById('app');if(el)el.insertAdjacentHTML('beforeend','<p style="padding:16px;color:#b42318">No se pudo iniciar la aplicación. '+String(e.message).replace(/[<>]/g,'')+'</p>')}
});</script></body></html>
