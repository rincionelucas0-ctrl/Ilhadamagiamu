<script type="text/ilha-module">/* ILHA DA MAGIA shared smart location/contact/photo form fields */
(()=>{'use strict';

if(kind==='website'&&!/^https?:\/\//i.test(s))s='https://'+s;try{let u=new URL(s);if(!['http:','https:'].includes(u.protocol)||u.username||u.password)throw Error('URL insegura');if(kind==='instagram'&&!/^(www\.)?instagram\.com$/i.test(u.hostname))throw Error('Instagram inválido');return u.href}catch{throw Error('Verificá el enlace de '+(kind==='instagram'?'Instagram':'sitio web')+'.')}};
const contacts=(row={})=>`<div class="smart-contacts"><h4>🔗 Enlaces y contacto</h4><label>Sitio web<input name="website" type="text" inputmode="url" placeholder="minegocio.com.br" value="${esc(row.website||'')}"></label><label>Instagram<input name="instagram" type="text" placeholder="@minegocio" value="${esc(row.instagram||'')}"></label><label>Teléfono / WhatsApp<input name="phone" type="tel" placeholder="+55 48 99999-9999" value="${esc(row.phone||'')}"></label><p class="smart-note">Escribí solo el usuario de Instagram o la dirección web. Nosotros armamos los enlaces.</p></div>`;

function start(root=document){root.addEventListener('change',e=>{let input=e.target.closest('[data-preview-file]');if(!input?.files?.[0])return;let section=input.closest('.smart-media');section.querySelectorAll('[data-preview-file]').forEach(i=>{if(i!==input)i.value=''});let file=input.files[0];if(!/^image\/(jpeg|png|webp)$/.test(file.type)||file.size>5*1024*1024){alert('Usá una foto JPEG, PNG o WebP de hasta 5 MB.');input.value='';return}let img=section.querySelector('[data-preview-image]');if(img.dataset.blob)URL.revokeObjectURL(img.dataset.blob);img.dataset.blob=URL.createObjectURL(file);img.src=img.dataset.blob;img.style.display='block';});
root.addEventListener('click',async e=>{let btn=e.target.closest('[data-place-action]');if(!btn)return;const box=btn.closest('[data-smart-location]');const action=btn.dataset.placeAction,st=box.querySelector('[data-place-status]'),results=box.querySelector('[data-place-results]');const put=(lat,lng,name)=>{box.querySelector('[name=lat]').value=String(lat);box.querySelector('[name=lng]').value=String(lng);box.querySelector('[name=region]').value=name||box.querySelector('[data-place-search]').value||'Florianópolis';box.querySelector('[data-place-search]').value=name||box.querySelector('[data-place-search]').value;st.textContent='✓ Punto seleccionado. Se guardará automáticamente.';results.innerHTML=''};

function formLocation(fd){let lat=String(fd.get('lat')||''),lng=String(fd.get('lng')||'');return {lat:lat===''?null:Number(lat),lng:lng===''?null:Number(lng),region:String(fd.get('region')||'').trim()};}
function formContacts(fd){return {website:cleanUrl(fd.get('website'),'website'),instagram:cleanUrl(fd.get('instagram'),'instagram'),phone:cleanUrl(fd.get('phone'),'phone')};}
function formImage(fd){let file=fd.get('cameraFile') instanceof File&&fd.get('cameraFile').size?fd.get('cameraFile'):fd.get('imageFile');let url=String(fd.get('imageUrl')||'').trim();return {file:file instanceof File&&file.size?file:null,url:url?cleanUrl(url,'website'):''};}

})();
</script>

function contactLink(v){let x=String(v||'').trim(),digits=x.replace(/\D/g,'');if(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(x))return `<a class="maplink" href="mailto:${esc(x)}">Enviar correo ↗</a>`;if(digits.length>=10&&digits.length<=15)return `<a class="maplink" target="_blank" rel="noopener noreferrer" href="https://wa.me/${digits}">Contactar por WhatsApp ↗</a>`;if(safeExternal(x))return `<a class="maplink" target="_blank" rel="noopener noreferrer" href="${esc(x)}">Abrir contacto ↗</a>`;return ''}

function miniPlace(p){let saved=store.saved.some(s=>s.type==='place'&&s.id===p.id);return `<article class="place-card"><div class="place-art">${icons[p.category]||'🌴'}</div><div class="place-body"><h3>${esc(p.name)}</h3><p>${esc(p.region)}${distLabel(p)}</p><span class="tag">${esc(p.category)}</span><div class="card-actions"><button class="primary" data-go="place" data-id="${p.id}">Ver lugar</button><button class="heart-btn" aria-label="${saved?'Quitar de guardados':'Guardar lugar'}" data-action="save" data-type="place" data-id="${p.id}">${saved?'♥':'♡'}</button></div></div></article>`}
function smallEvent(e){return `<div class="list-card"><div class="list-icon">📅</div><div class="list-main"><strong>${esc(e.name)}</strong><small>${fmt(e.start)}${e.start!==e.end?' — '+fmt(e.end):''} · ${esc(e.region||'Florianópolis')}<br>${esc(e.free?'Gratuito':'Entrada paga')}</small></div><button class="textlink" data-go="event" data-id="${esc(e.id)}">Ver</button></div>`}
function home(){let found=discoveryCount(),left=Math.max(0,places.length-found),near=filteredPlaces(ui.nearCategory,'',true).slice(0,3),todayEvents=matchingEvents(today());return `${header()}<div class="hero"><div class="eyebrow">ILHA DA MAGIA · FLORIANÓPOLIS</div><h1>${t('question')}</h1><p>${t('intro')}</p><div class="location"><span>📍 &nbsp;${store.location?t('locOn'):t('locAsk')}</span><button data-action="location">${store.location?'✓':t('activate')}</button></div>${searchbar('Playas, lugares, comer, hacer...')}</div><main class="content"><section class="section">${head('⏱️ '+t('discover'),t('discoverSub'),'discoveries','Ver misiones')}<div class="feature"><div class="eyebrow">${t('adventure')}</div><div class="floating-count"><strong>${found}</strong><small>DESCUBIERTOS</small></div><h3>Te faltan ${left} lugares</h3><p>Descubriste ${found} de ${places.length} lugares publicados. La meta del catálogo es reunir 128 o más lugares verificados.</p><div class="progress"><span style="width:${Math.min(places.length?found/places.length*100:0,100)}%"></span></div><div class="feature-foot"><span>${found}/${places.length} descubiertos · ${places.length?Math.round(found/places.length*100):0}%</span><button class="soft-btn" data-go="discoveries">${t('continue')}</button></div></div></section><section class="section">${head('📍 '+t('near'),t('nearSub'),'near')}${chips([[t('all'),'Todo'],['🏖️ Playas','Praias'],['🥾 Trilhas','Trilhas'],['👀 Miradores','Mirantes'],['🌿 Naturaleza','Natureza']],'near',ui.nearCategory)}${store.location?`<div class="card-grid">${near.map(miniPlace).join('')}</div>`:`<div class="empty"><strong>Activá la ubicación para ordenar por cercanía</strong><br><span class="small">También podés explorar todos los lugares sin compartir tu ubicación.</span><br><button class="secondary" data-go="near" style="margin-top:15px">Explorar lugares</button></div>`}</section><section class="section">${head('📅 '+t('today'),t('todaySub'),'events')}${todayEvents.length?todayEvents.map(smallEvent).join(''):'<div class="empty">No hay actividades, eventos ni propuestas cargadas para hoy.</div>'}</section><section class="section">${head('🎯 '+t('premium'),t('premiumSub'),'missions')}<div class="feature premium"><div class="eyebrow">PREMIUM</div><h3>Misiones especiales</h3><p>${(window.ILHA_MISSIONS||[]).length ? (window.ILHA_MISSIONS||[]).length+' misión(es) disponibles.' : 'Las ofertas no son misiones. Aparecen aquí solo misiones Premium aprobadas.'}</p><button class="soft-btn" data-go="missions" style="margin-top:16px">Explorar misiones →</button></div></section><section class="section">${head('🎁 '+t('offers'),t('offersSub'),'offers')}${(window.ILHA_OFFERS||[]).length?(window.ILHA_OFFERS||[]).slice(0,3).map(x=>`<div class="plain-card" style="margin:12px 0"><h3>${esc(x.name)}</h3>${itemPhoto(x)}<p>${esc(x.description||'')}</p>${socialLinks(x)}</div>`).join(''):'<div class="empty">Todavía no hay ofertas comerciales publicadas.</div>'}</section><section class="section"><div class="plain-card"><h3>${t('publish')}</h3><p>Mostrá tu negocio, servicio o experiencia a quienes buscan qué hacer en la isla. Elegí cómo contactarte y revisá las condiciones de publicación.</p><button class="primary" data-go="publish">${t('create')}</button></div></section></main>`}
function explore(){return `${header()}${subhead(t('explore'))}<div class="feature subhero"><div class="eyebrow">🧭 DESCUBRÍ</div><h2>${t('exploreTitle')}</h2><p>${t('exploreSub')}</p></div><div class="sub-search">${searchbar('Buscar lugares y experiencias')}${chips([[t('all'),'Todo'],['Gratis','Gratis'],['Hoy','Hoy'],['Cerca','Cerca']],'explore','Todo')}</div><main class="content"><section class="section">${head(t('natural'),'Descubrí y conocé la isla.')}<div class="category-grid">${categories.map(([icon,name])=>`<button class="category" data-go="catalog" data-category="${esc(name)}"><span>${icon}</span><strong>${esc(name)}</strong><small>${places.filter(p=>p.category===name).length} lugares para descubrir</small></button>`).join('')}</div></section><section class="section">${head(t('more'),'Descubrí lugares, planes y experiencias.')}${[['🍽️','Comer','offers'],['🎯','Qué hacer','missions'],['🌌','Experiencias','offers'],['🎁','Ofertas','offers'],['📍','Cerca','near'],['🔥','Eventos','events'],['🎯','Viví Ilha','discoveries']].map(([icon,label,page])=>menu(icon,label,'Explorar esta área',page)).join('')}</section></main>`}
function menu(icon,label,desc,page){return `<button class="menu-card" data-go="${page}"><span class="menu-icon">${icon}</span><span class="menu-copy"><strong>${esc(label)}</strong><small>${esc(desc)}</small></span><span class="chev">›</span></button>`}
function events(){let dates=Array.from({length:12},(_,i)=>addDay(today(),i)),weekdays=['DOMINGO','LUNES','MARTES','MIÉRCOLES','JUEVES','VIERNES','SÁBADO'],dayEvents=matchingEvents(ui.date);return `${subhead('Eventos y Tours')}<div class="feature subhero"><div class="eyebrow">📅 EVENTOS Y TOURS</div><h2>${t('eventTitle')}</h2><p>${t('eventSub')}</p></div><main class="content"><h2 class="detail-title">${t('week')}</h2><p class="muted-title">${t('chooseDay')}</p><div class="dates">${dates.map((d,i)=>`<button class="day ${d===ui.date?'selected':''}" data-action="date" data-value="${d}"><b>${i===0?'HOY':weekdays[dateOnly(d).getDay()]}</b><strong>${dateOnly(d).getDate()}</strong><span>${matchingEvents(d).length||'−'}</span></button>`).join('')}</div>${dayEvents.length?dayEvents.map(smallEvent).join(''):'<div class="empty" style="padding:65px 25px">Todavía no hay eventos o tours cargados para esta fecha.</div>'}<div class="plain-card" style="margin-top:24px"><h3>¿Organizás un evento?</h3><p>Los eventos comunitarios son gratuitos y sin límite de cantidad. Las publicaciones comerciales requieren Plan Evento.</p><button class="primary" data-go="publish">Publicar evento</button></div></main>`}
function saved(){const items=store.saved.filter(s=>ui.savedCategory==='Todo'||(ui.savedCategory==='Lugares'&&s.type==='place')||(ui.savedCategory==='Planes'&&s.type==='event')||(ui.savedCategory==='Misiones'&&s.type==='mission')||(ui.savedCategory==='Ofertas'&&s.type==='offer'));return `${subhead(t('saved'))}<div class="feature subhero pink"><div class="eyebrow">♡ TU ILHA DA MAGIA</div><h2>${t('savedTitle')}</h2><p>${t('savedSub')}</p><div class="stat-grid"><div class="stat"><strong>${store.saved.length}</strong><span>guardados</span></div><div class="stat"><strong>${favorites('mission').length}</strong><span>misiones</span></div><div class="stat"><strong>${favorites('place').length}</strong><span>lugares</span></div></div></div><main class="content">${chips([[t('all'),'Todo'],['⏱️ Lugares','Lugares'],['🎉 Planes','Planes'],['🎁 Ofertas','Ofertas'],['🎯 Misiones','Misiones']],'saved',ui.savedCategory)}${items.length?`<div style="margin-top:18px">${items.map(s=>{let p=places.find(x=>s.type==='place'&&x.id===s.id),e=store.events.find(x=>s.type==='event'&&x.id===s.id),name=p?.name||e?.name||'Contenido no disponible';return `<div class="list-card"><div class="list-icon">${p?icons[p.category]:'📅'}</div><div class="list-main"><strong>${esc(name)}</strong><small>${esc(p?.region||e?.region||'')}</small></div><button class="textlink" data-go="${p?'place':'event'}" data-id="${esc(s.id)}">Ver</button><button class="ghost-icon" aria-label="Quitar de guardados" data-action="save" data-id="${esc(s.id)}" data-type="${esc(s.type)}">♥</button></div>`}).join('')}</div>`:`<div class="offer center" style="margin-top:20px;padding:65px 23px"><div class="big-heart">♡</div><h3>Todavía no guardaste nada</h3><p>Cuando encuentres algo que quieras volver a vivir, tocá ♡ y lo vas a tener acá.</p><button class="primary full" data-go="explore" style="margin-top:29px">Explorar ahora</button></div>`}</main>`}
const myStats=()=>[store.posts.length+store.events.length,discoveryCount(),store.missions.length,store.photoRecords.length];
function profile(){let stats=myStats();return `${header()}${subhead(t('profile'))}<main class="content"><div class="feature"><div class="profile-top"><div class="avatar">🙂</div><div style="flex:1"><h2>${esc(store.profile.name||t('profile'))}</h2><p>${t('profileSub')}</p></div><button class="soft-btn" data-go="editprofile">Editar<br>perfil</button></div><div class="profile-stat">${['Publicaciones','Lugares','Misiones','Fotos'].map((label,i)=>`<div class="stat"><strong>${stats[i]}</strong><span>${label}</span></div>`).join('')}</div></div><section class="section" style="margin-top:31px">${head('Mi actividad','Todo lo que hacés dentro de la isla.')}<div class="badge-note">📸 Cada foto que compartís ayuda a que la isla se vea desde experiencias reales.</div>${menu('📋','Mis solicitudes comerciales','Seguimiento, estado del pago y estadísticas verificadas.','commercial-requests')}${[['📊','Mi actividad','Descubrimientos, publicaciones y resultados.','activity'],['🌴','Descubrimientos','Lugares, categorías y progreso.','discoveries'],['🎯','Misiones','Tus misiones y el progreso dentro de la isla.','missions'],['📸','Fotos','Tus fotos y aportes guardados en este dispositivo.','photos']].map(x=>menu(...x)).join('')}</section><section class="section">${head('Mi cuenta','Gestioná tu participación y tus preferencias.')}${[['📣','Publicaciones','Ver y administrar lo que enviaste.','my-posts'],['🔔','Notificaciones','Preferencias y novedades.','notifications'],['⚙️','Configuración','Preferencias y privacidad.','settings'],['❔','Ayuda y soporte','Preguntas frecuentes y contacto.','help'],['📲','Instalar aplicación','Agregá Ilha da Magia a tu celular.','install']].map(x=>menu(...x)).join('')}</section><div class="footer-note">ILHA DA MAGIA · Florianópolis</div></main>`}
function catalog(){let list=filteredPlaces(ui.category,ui.search,false);return `${header()}${subhead(ui.category==='Todo'?'Descubrí Ilha da Magia':ui.category)}<div class="feature subhero"><div class="eyebrow">🌴 LUGARES NATURALES</div><h2>${ui.category==='Todo'?'Descubrí la isla':esc(ui.category)}</h2><p>${list.length} lugares cargados para explorar.</p></div><div class="sub-search">${searchbar('Buscar por nombre, región o categoría')}${chipsCat('catalog',ui.category)}</div><main class="content"><p class="muted-title">Catálogo conectado: ${places.length} lugares públicos. El administrador incorporará y verificará nuevas fichas.</p><div class="card-grid">${list.map(miniPlace).join('')}</div>${!list.length?`<div class="empty">${t('noResults')}</div>`:''}</main>`}
function near(){let list=filteredPlaces(ui.nearCategory,'',true);return `${header()}${subhead('Cerca de vos')}<div class="feature subhero"><div class="eyebrow">📍 TU ENTORNO</div><h2>Descubrí lo que está cerca</h2><p>Los mismos lugares de la aventura, ordenados por distancia.</p></div><main class="content">${store.location?`<div class="notice">📍 Ubicación disponible solamente en este dispositivo. Las distancias son aproximadas. <button class="textlink" data-action="clear-location">Desactivar</button></div>`:`<div class="plain-card"><h3>Activá tu ubicación</h3><p>Con tu permiso, te mostramos los lugares por cercanía. También podés explorar sin ubicación.</p><button class="primary" data-action="location">Activar ubicación</button></div>`}<div style="margin-top:17px">${chipsCat('near',ui.nearCategory)}</div><div class="card-grid">${list.map(miniPlace).join('')}</div></main>`}
function place(){let p=places.find(x=>x.id===ui.selectedId);if(!p)return missing();let saved=store.saved.some(x=>x.type==='place'&&x.id===p.id),done=store.discovered.includes(p.id);return `${header()}${subhead('Lugar natural')}<div class="feature subhero"><div class="eyebrow">${icons[p.category]} ${esc(p.category)}</div><h2>${esc(p.name)}</h2><p>${esc(p.region)}${distLabel(p)}</p></div><main class="content"><div class="plain-card"><h3>Conocé este lugar</h3>${itemPhoto(p)}<p>${esc(p.description)}</p><div class="divider"></div><span class="tag">${esc(p.category)}</span><p style="margin-top:15px">${esc(p.recommendations)}</p><p style="margin-top:12px">📍 ${esc(p.region)} · Ubicación publicada</p>${socialLinks(p)}<div class="card-actions"><button class="primary" data-action="discover" data-id="${p.id}">${done?'✓ Descubierto':'✓ Marcar como descubierto'}</button><button class="heart-btn" data-action="save" data-type="place" data-id="${p.id}" aria-label="Guardar">${saved?'♥':'♡'}</button></div>${Number.isFinite(p.lat)&&Number.isFinite(p.lng)?`<a class="maplink" style="display:inline-block;margin-top:20px" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.lat+','+p.lng)}">Abrir ubicación en Google Maps ↗</a>`:"<p>Ubicación de Maps pendiente de cargar.</p>"}</div><div class="notice">El registro de descubrimiento es estadístico y no entrega puntos ni recompensas. No equivale a completar una misión Premium.</div></main>`}
function discoveries(){let done=places.filter(p=>store.discovered.includes(p.id)),cats=new Set(done.map(p=>p.category));return `${header()}${subhead('Descubrimientos')}<div class="feature subhero"><div class="eyebrow">🌴 TU AVENTURA</div><h2>${discoveryCount()} lugares descubiertos</h2><p>Explorá, conocé y registrá tu recorrido por la isla.</p><div class="progress"><span style="width:${Math.min(places.length?discoveryCount()/places.length*100:0,100)}%"></span></div><div class="feature-foot">${discoveryCount()}/${places.length} · ${places.length?Math.round(discoveryCount()/places.length*100):0}% de tu objetivo</div></div><main class="content"><div class="two"><div class="plain-card"><h3>${cats.size}/8</h3><p>Categorías exploradas</p></div><div class="plain-card"><h3>${store.missions.length}</h3><p>Misiones completadas</p></div></div><section class="section" style="margin-top:25px">${head('Mis descubrimientos','Los lugares que marcaste como conocidos.')} ${done.length?done.map(p=>`<div class="list-card"><div class="list-icon">${icons[p.category]}</div><div class="list-main"><strong>${esc(p.name)}</strong><small>${esc(p.category)}</small></div><button class="textlink" data-go="place" data-id="${p.id}">Ver</button></div>`).join(''):'<div class="empty">Todavía no registraste descubrimientos.</div>'}<button class="primary full" data-go="catalog">Descubrir lugares</button></section></main>`}
function mission(){let items=window.ILHA_MISSIONS||[];return `${header()}${subhead('Misiones')}<div class="feature subhero premium"><div class="eyebrow">🎯 MISIONES</div><h2>Experiencias que dejan huella</h2><p>Misiones creadas por comercios y experiencias habilitadas.</p><button class="soft-btn" data-action="refresh-public">↻ Actualizar misiones</button></div><main class="content"><div class="plain-card"><h3>¿Cómo se completa una misión?</h3><p>Se requiere check-in de ubicación y fotografía de participación. El envío y la validación de ambas pruebas se habilitarán en una etapa posterior.</p></div>${items.length?items.map(x=>`<div class="plain-card" style="margin-top:15px"><h3>${esc(x.name)}</h3>${itemPhoto(x)}<p>${esc(x.description)}</p>${socialLinks(x)}<div class="notice">${esc(x.instructions||'Instrucciones pendientes')}</div></div>`).join(''):'<div class="empty" style="margin-top:17px">Todavía no hay misiones activas.</div>'}</main>`}
function offers(){let items=window.ILHA_OFFERS||[];return `${header()}${subhead('Ofertas')}<div class="feature subhero premium"><div class="eyebrow">🎁 BENEFICIOS</div><h2>Ofertas en la isla</h2><p>Promociones y beneficios publicados por comercios.</p><button class="soft-btn" data-action="refresh-public">↻ Actualizar publicaciones</button></div><main class="content">${items.length?items.map(x=>`<div class="plain-card" style="margin-top:14px"><h3>${esc(x.name)}</h3>${itemPhoto(x)}<p>${esc(x.description)}</p>${socialLinks(x)}${x.contact&&!x.phone?contactLink(x.contact):''}${safeExternal(x.link)?`<a class="maplink" target="_blank" rel="noopener noreferrer" href="${esc(safeExternal(x.link))}">Abrir oferta ↗</a>`:''}</div>`).join(''):'<div class="empty">Todavía no hay ofertas comerciales habilitadas.</div>'}<div class="plain-card" style="margin-top:20px"><h3>¿Tenés un negocio?</h3><p>Conocé cómo funcionan los planes Básico, Premium y Evento.</p><button class="primary" data-go="plans">Ver planes comerciales</button></div></main>`}
function plans(){return `${header()}${subhead('Planes comerciales')}<main class="content">${[['basic','Básico','1 publicación de oferta por mes','Productos, servicios, ofertas y descuentos.'],['premium','Premium','Hasta 3 publicaciones por mes','Ofertas y misiones con actividades y descuentos especiales.'],['event','Plan Evento','1 evento por contratación','Evento pago, turismo, boliche, fiesta o actividad.']].map(([code,name,limit,desc])=>`<div class="plain-card" style="margin-bottom:15px"><span class="tag">PLAN ${name.toUpperCase()}</span><h3 style="margin-top:11px">${name}</h3><p>${desc}</p><div class="notice">${limit}</div><button class="primary" data-go="commercial-form" data-plan="${code}">Elegir este plan →</button></div>`).join('')}<p class="fineprint">Enviá tus datos. La solicitud se registra en ADMIN y después podés contactar por WhatsApp para coordinar el pago. No se publica antes de confirmar el pago y aprobar el contenido.</p></main>`}
function publish(){return `${header()}${subhead('Crear publicación')}<div class="feature subhero"><div class="eyebrow">📣 ILHA DA MAGIA</div><h2>¿Qué querés publicar?</h2><p>Completá el formulario según la modalidad.</p></div><main class="content"><div class="plain-card"><div class="form-field"><label>Modalidad</label><select id="publish-kind"><option value="event" ${ui.publishType==='event'?'selected':''}>Evento comunitario · GRATIS</option><option value="offer" ${ui.publishType==='offer'?'selected':''}>Plan Básico · ofertas</option><option value="premium" ${ui.publishType==='premium'?'selected':''}>Plan Premium · ofertas + misiones</option><option value="commercial-event" ${ui.publishType==='commercial-event'?'selected':''}>Plan Evento · comercial</option></select></div><div id="publish-explain">${publishExplain()}</div><button class="primary full" data-action="publish-next">Continuar →</button></div></main>`}
function publishExplain(){return ui.publishType==='event'?`<div class="notice">GRATIS · Evento comunitario sin precio y sin límite. Publicación inmediata, revisión posterior.</div>`:`<div class="notice">Plan comercial: formulario completo → solicitud a ADMIN → mensaje preparado de WhatsApp → pago y aprobación → publicación.</div>`}
function commercialForm(){let plan=ui.commercialPlan||'basic',event=plan==='event',premium=plan==='premium';let kinds=['Turismo','Eventos y fiestas','Boliches y vida nocturna','Música','Gastronomía','Deportes y aventura','Cultura','Ferias','Experiencias','Otros'];return `${header()}${subhead('Solicitar Plan '+({basic:'Básico',premium:'Premium',event:'Evento'}[plan]))}<main class="content"><div class="plain-card"><p>Completá los datos. La solicitud se guarda en ADMIN antes de abrir WhatsApp. No se realizará ningún cobro automático.</p><form data-form="commercial" id="commercial-request"><div class="form-field"><label>Nombre del comercio u organizador *</label><input name="business_name" required maxlength="160"></div><div class="form-field"><label>Responsable *</label><input name="responsible_name" required maxlength="140"></div><div class="form-field"><label>WhatsApp de contacto con código de país *</label><input name="contact_phone" type="tel" inputmode="tel" required placeholder="Ej. +55 48 99999-9999"></div><div class="form-field"><label>Correo (opcional)</label><input name="contact_email" type="email"></div>${ILHA_SMART.contacts()}${ILHA_SMART.location()}${event?`<h3>Actividad o evento comercial</h3><div class="form-field"><label>Nombre *</label><input name="eventName" required maxlength="100"></div><div class="form-field"><label>Categoría *</label><select name="eventCategory">${kinds.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="form-field"><label>Descripción y actividad *</label><textarea name="eventDescription" required minlength="10" maxlength="1500"></textarea></div><div class="two"><div class="form-field"><label>Inicio *</label><input name="eventStart" type="date" min="${today()}" required></div><div class="form-field"><label>Finalización *</label><input name="eventEnd" type="date" min="${today()}" required></div></div><div class="two"><div class="form-field"><label>Horario inicial</label><input name="eventTimeStart" type="time"></div><div class="form-field"><label>Horario final</label><input name="eventTimeEnd" type="time"></div></div><div class="form-field"><label>Precio de entrada o actividad (R$) *</label><input name="eventPrice" required maxlength="60" placeholder="Ej.: R$ 50"></div>`:Array.from({length:premium?3:1},(_,i)=>`<section class="plain-card" style="margin:12px 0;background:#f4faf9"><h3>${premium?'Publicación '+(i+1)+(i?' · opcional':' · obligatoria'):'Tu oferta o producto'}</h3>${premium?`<div class="form-field"><label>Tipo de publicación (seleccioná “Misión” para crear una misión real)</label><select name="kind${i}"><option value="offer">Oferta / producto / servicio (no es misión)</option><option value="mission">Misión con actividad y superdescuento</option></select></div>`:''}<div class="form-field"><label>Título ${i===0?'*':''}</label><input name="itemName${i}" maxlength="150" ${i===0?'required':''}></div><div class="form-field"><label>Descripción ${i===0?'*':''}</label><textarea name="itemDescription${i}" maxlength="1500" ${i===0?'required':''}></textarea></div><div class="form-field"><label>Beneficio, descuento y condiciones</label><textarea name="itemBenefit${i}" maxlength="700" placeholder="Ej.: 30% de descuento; válido para..."></textarea></div>${premium?`<div class="form-field"><label>Instrucciones de misión (si elegiste misión)</label><textarea name="itemInstructions${i}" maxlength="1000" placeholder="Ej.: realizar una actividad, check-in y fotografía..."></textarea></div>`:''}<div class="form-field"><label>Elegir foto del dispositivo</label><input name="itemFile${i}" type="file" accept="image/jpeg,image/png,image/webp"></div><div class="form-field"><label>O tomar una foto</label><input name="itemCamera${i}" type="file" accept="image/*" capture="environment"></div><div class="form-field"><label>O enlace de imagen</label><input name="itemUrl${i}" type="url" placeholder="https://..."></div></section>`).join('')}<h3>Imagen principal ${event?'del evento':'del negocio'} (opcional)</h3>${ILHA_SMART.media()}<div class="form-field"><label><input type="checkbox" name="confirm" required> Confirmo que puedo publicar estos datos y acepto que la solicitud requiere revisión y pago.</label></div><button class="primary full" type="submit">Guardar solicitud y contactar por WhatsApp</button></form></div></main>`}

async function refreshPublic(){const backend=window.ILHA_BACKEND;if(!backend?.ready){toast('Sin conexión a Supabase.');return}try{const data=await backend.loadPublic();places.splice(0,places.length,...(data.places||[]));store.events=data.events||[];window.ILHA_SETTINGS=data.settings||{};window.ILHA_OFFERS=data.offers||[];window.ILHA_MISSIONS=data.missions||[];render();if(data.errors?.length)toast('Algunos contenidos no cargaron: '+data.errors.join(' · '));else toast('Publicaciones actualizadas.')}catch(err){toast('No se pudo actualizar: '+err.message)}}

function handleLocation(){if(!navigator.geolocation){toast('Este navegador no dispone de geolocalización.');return}if(!window.isSecureContext){toast('La ubicación requiere HTTPS o localhost.');return}navigator.geolocation.getCurrentPosition(p=>{store.location={lat:p.coords.latitude,lng:p.coords.longitude,at:Date.now()};persist();toast('Ubicación activada.');render()},()=>toast('No se pudo obtener tu ubicación. Revisá los permisos del navegador.'),{enableHighAccuracy:false,timeout:12000,maximumAge:60000})}
function photoRead(file){return new Promise(resolve=>{if(!file){resolve('');return}if(!file.type.startsWith('image/')){resolve('');return}let r=new FileReader();r.onload=()=>{let img=new Image();img.onload=()=>{let scale=Math.min(1,800/img.width,800/img.height),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.63))};img.onerror=()=>resolve('');img.src=r.result};r.onerror=()=>resolve('');r.readAsDataURL(file)})}
