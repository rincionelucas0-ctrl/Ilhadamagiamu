async function ilhaSyncLanguage(){
 try{
 const backend=window.ILHA_BACKEND;if(!backend?.ready)return;
 const uid=await backend.ensureGuest();if(!uid)return;
 const data={language:store.lang,updated_at:new Date().toISOString()};
 const db=backend.client;
 // Update only language, without resetting the visitor's category or push preferences.
 const {data:updated,error}=await db.from('notification_preferences').update(data).eq('user_id',uid).select('user_id').maybeSingle();
 if(error)throw error;
 if(!updated){
   const {error:insertError}=await db.from('notification_preferences').insert({user_id:uid,...data});
   if(insertError){
     if(insertError.code!=='23505')throw insertError;
     const again=await db.from('notification_preferences').update(data).eq('user_id',uid);
     if(again.error)throw again.error;
   }
 }
 }catch(e){console.warn('Idioma: la sincronización se reintentará al abrir notificaciones',e?.message||e)}
}

function ilhaTranslateInterface(){
 if(store.lang==='ES')return;
 const root=document.body;if(!root)return;
 // Never translate published place, offer, event, mission, user-photo or business copy.
 const protectedSelectors='.detail-description,.detail-head h2,.place-body h3,.place-body p,.place-card h3,.place-card p,.list-card h3,.list-card p,.offer h3,.offer p,.community-gallery,.community-photo,.ilha-notif h3,.ilha-notif p,.gallery,.media-gallery,[translate="no"],input,textarea,select,option,script,style';
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
 const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
 for(const node of nodes){const parent=node.parentElement;if(!parent||parent.closest(protectedSelectors))continue;
 const raw=node.nodeValue;const leading=raw.match(/^\s*/)?.[0]||'';const trailing=raw.match(/\s*$/)?.[0]||'';const normalized=raw.trim();
 if(!normalized)continue;
 const exact=ilhaUiTranslate(normalized);
 if(exact!==normalized){node.nodeValue=leading+exact+trailing;continue;}
 // Keep numerical values and user-created names unchanged while translating fixed UI prefixes.
 let match=normalized.match(/^(\d+) sin leer · (\d+) avisos$/);
 if(match){node.nodeValue=store.lang==='PT'?`${match[1]} não lidas · ${match[2]} avisos`:`${match[1]} unread · ${match[2]} alerts`;continue;}
 if(normalized==='sin leer')node.nodeValue=store.lang==='PT'?'não lidas':'unread';
 }
 for(const el of root.querySelectorAll('input[placeholder],textarea[placeholder],button[aria-label],input[aria-label],[title],[aria-label]')){
  for(const attr of ['placeholder','aria-label','title']){if(!el.hasAttribute(attr))continue;const original=el.getAttribute(attr);const translated=ilhaUiTranslate(original);if(translated!==original)el.setAttribute(attr,translated);}
 }
}

let communityRows=[],communityUserId=null,communityLoading=false,communityFetched=false;
let pendingDiscoveryFile=null,pendingDiscoveryPreview='';
ui.discoveryOpen=false;
function contributionPhoto(row){if(!/^[0-9a-f-]{36}\/[0-9a-f-]{36}\.(jpg|png|webp)$/i.test(String(row.photo_path||'')))return '';let api=window.ILHA_BACKEND;if(!api?.client)return '';return api.client.storage.from('community-discoveries').getPublicUrl(row.photo_path).data.publicUrl}
const myCommunity=()=>communityRows.filter(x=>communityUserId&&x.user_id===communityUserId);
const discoveryCount=()=>store.discovered.filter(id=>places.some(p=>p.id===id)).length;
function communityDate(v){try{return new Date(v).toLocaleDateString(store.lang==='PT'?'pt-BR':store.lang==='EN'?'en-US':'es-AR',{day:'numeric',month:'short',year:'numeric'})}catch{return ''}}
function communitySection(place){const rows=communityRows.filter(r=>r.place_id===place.id);return `<section class="detail-section" id="community-photos"><h3>📸 Aportes de la comunidad ${rows.length?'· '+rows.length:''}</h3><p class="community-empty">Fotografías compartidas por visitantes que descubrieron este lugar.</p>${rows.length?`<div class="community-contributions">${rows.map(r=>{const url=contributionPhoto(r);return url?`<article class="community-contribution"><img src="${esc(url)}" loading="lazy" alt="Foto compartida por ${esc(r.display_name)}" data-community-photo="${esc(url)}"><div class="community-byline"><strong>📍 ${esc(r.display_name)}</strong><small>Descubierto · ${esc(communityDate(r.created_at))}</small></div></article>`:''}).join('')}</div>`:'<p class="community-empty">Todavía no hay aportes. ¡Podés compartir el primero!</p>'}</section>`}
function discoveryForm(place){return !ui.discoveryOpen?'':`<form class="community-picker" data-form="community-discovery"><h4>📷 Compartí tu descubrimiento</h4><p>La fotografía se publicará con el nombre <strong>${esc(store.profile.name)}</strong> y aparecerá en los aportes de ${esc(place.name)}.</p><div class="community-picker-options"><label class="community-pick"><span>🖼️</span>Elegir de la galería<input name="community_gallery" type="file" accept="image/jpeg,image/png,image/webp"></label><label class="community-pick"><span>📷</span>Tomar una foto<input name="community_camera" type="file" accept="image/jpeg,image/png,image/webp,image/*" capture="environment"></label></div><img id="community-image-preview" class="community-preview" alt="Vista previa de tu foto" hidden><p class="community-empty" id="community-photo-status">Elegí una imagen JPEG, PNG o WebP de hasta 5 MB.</p><div class="community-picker-actions"><button class="secondary" type="button" data-action="cancel-discover">Cancelar</button><button class="primary" type="submit" id="community-submit" disabled>Publicar descubrimiento</button></div></form>`}
async function syncCommunity(){if(communityLoading||!window.ILHA_BACKEND?.ready)return;communityLoading=true;const api=window.ILHA_BACKEND;try{try{communityUserId=await api.ensureGuest()}catch(e){console.warn('Sesión de descubrimientos:',e.message)}const publicQuery=api.client.from('community_discoveries').select('id,place_id,user_id,display_name,photo_path,created_at').order('created_at',{ascending:false}).limit(1000);const ownQuery=communityUserId?api.client.from('community_discoveries').select('id,place_id,user_id,display_name,photo_path,created_at').eq('user_id',communityUserId).order('created_at',{ascending:false}).limit(1000):null;const [r,mine]=await Promise.all([publicQuery,ownQuery||Promise.resolve({data:[],error:null})]);if(r.error)throw r.error;if(mine.error)throw mine.error;communityRows=[...new Map([...(r.data||[]),...(mine.data||[])].map(x=>[x.id,x])).values()];communityFetched=true;if(communityUserId){store.discovered=[...new Set(myCommunity().map(x=>x.place_id))];persist()}if(['place','profile','discoveries','photos','activity','home'].includes(ui.page))render()}catch(e){console.warn('Aportes comunitarios:',e.message);if(!communityFetched)toast('No se pudieron cargar los aportes: '+e.message.slice(0,110))}finally{communityLoading=false}}
async function publishDiscovery(form){const file=pendingDiscoveryFile,api=window.ILHA_BACKEND,placeId=ui.selectedId,name=String(store.profile.name||'').trim();if(!api?.ready)throw Error('No hay conexión con Supabase');if(!name)throw Error('Configurá un nombre visible en tu perfil');if(!file||!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>5*1024*1024)throw Error('Elegí una foto JPG, PNG o WebP de hasta 5 MB');const userId=await api.ensureGuest();communityUserId=userId;if(!userId)throw Error('No se pudo crear tu sesión');const ext=file.type==='image/jpeg'?'jpg':file.type.split('/')[1],path=userId+'/'+crypto.randomUUID()+'.'+ext;const upload=await api.client.storage.from('community-discoveries').upload(path,file,{contentType:file.type,upsert:false});if(upload.error)throw upload.error;const saved=await api.client.from('community_discoveries').insert({place_id:placeId,user_id:userId,display_name:name,photo_path:path}).select('id').single();if(saved.error){try{await api.client.storage.from('community-discoveries').remove([path])}catch{}throw saved.error}store.discovered=[...new Set([...store.discovered,placeId])];persist();ui.discoveryOpen=false;pendingDiscoveryFile=null;if(pendingDiscoveryPreview)URL.revokeObjectURL(pendingDiscoveryPreview);pendingDiscoveryPreview='';await syncCommunity();toast('¡Descubrimiento publicado en tu perfil y en la comunidad!')}

const activeEvents=()=>store.events.filter(e=>e.status==='published'&&e.end>=today());
const matchingEvents=(d)=>activeEvents().filter(e=>e.start<=d&&e.end>=d);
const favorites=(type)=>store.saved.filter(x=>!type||x.type===type);
function distance(a,b){if(!store.location)return Infinity;let R=6371,rad=Math.PI/180,dlat=(a-store.location.lat)*rad,dlng=(b-store.location.lng)*rad,z=Math.sin(dlat/2)**2+Math.cos(store.location.lat*rad)*Math.cos(a*rad)*Math.sin(dlng/2)**2;return 2*R*Math.atan2(Math.sqrt(z),Math.sqrt(1-z))}
function filteredPlaces(cat='Todo',query='',near=false){let q=query.trim().toLocaleLowerCase();let data=places.filter(p=>p.status==='published'&&(cat==='Todo'||p.category===cat)&&(!q||(p.name+' '+p.region+' '+p.description+' '+p.category).toLocaleLowerCase().includes(q)));if(near&&store.location)data.sort((a,b)=>distance(a.lat,a.lng)-distance(b.lat,b.lng));return data}
const safeExternal=u=>{try{let x=new URL(u);return ['https:','http:'].includes(x.protocol)?x.href:''}catch{return ''}};
const safeGoogleMapsUrl=value=>{try{let raw=String(value||'').trim();if(!raw)return '';if(!/^https?:\/\//i.test(raw))raw='https://'+raw;let u=new URL(raw),host=u.hostname.toLowerCase(),allowed=host==='maps.app.goo.gl'||host==='maps.google.com'||host==='maps.google.com.br'||(host==='goo.gl'&&/^\/maps(?:\/|$)/i.test(u.pathname))||(['google.com','www.google.com','google.com.br','www.google.com.br'].includes(host)&&/^\/maps(?:\/|$)/i.test(u.pathname));return allowed&&!u.username&&!u.password&&['https:','http:'].includes(u.protocol)?(u.protocol='https:',u.href):''}catch{return ''}};
const hasCoords=p=>p&&p.lat!==null&&p.lng!==null&&Number.isFinite(Number(p.lat))&&Number.isFinite(Number(p.lng));
const proximityDistance=p=>store.location&&hasCoords(p)?distance(Number(p.lat),Number(p.lng)):null;
const distLabel=p=>{let d=proximityDistance(p);return d!==null&&Number.isFinite(d)?` · A ${d<1?Math.round(d*1000)+' m':d.toFixed(1)+' km'}`:''};
const eventDateProximity=item=>{if(!item?.start)return '';let now=today(),start=String(item.start).slice(0,10),end=String(item.end||item.start).slice(0,10);if(start<=now&&end>=now)return start<now?'EN CURSO':'HOY';let days=Math.round((dateOnly(start)-dateOnly(now))/86400000);if(days===1)return 'MAÑANA';if(days>1)return `EN ${days} DÍAS`;return end<now?'FINALIZADO':''};
function miniPlace(p){let saved=store.saved.some(s=>s.type==='place'&&s.id===p.id);return `<article class="place-card"><div class="place-art">${p.photo_url?`<img src="${esc(p.photo_url)}" loading="lazy" alt="${esc(p.name)}">`:`<span aria-hidden="true">${icons[p.category]||'🌴'}</span>`}<span class="card-photo-label">${esc(p.category)}</span></div><div class="place-body"><p class="card-kicker">📍 ${esc(p.region||'Florianópolis')}${distLabel(p)}</p><h3>${esc(p.name)}</h3><p class="card-excerpt">${esc(p.description||'Descubrí este rincón de la isla.')}</p><div class="card-actions"><button class="primary" data-go="place" data-id="${p.id}">Ver lugar <span aria-hidden="true">↗</span></button><button class="heart-btn" aria-label="${saved?'Quitar de guardados':'Guardar lugar'}" data-action="save" data-type="place" data-id="${p.id}">${saved?'♥':'♡'}</button></div></div></article>`}
function smallEvent(e){return visualCard(e,'event')}
function visualPhoto(item,ico='🌴'){let photo=safeExternal(item.photo_url||item.photo||'');return `<div class="visual-photo">${photo?`<img src="${esc(photo)}" alt="${esc(item.name||'Fotografía')}" loading="lazy">`:`<span class="photo-placeholder" aria-hidden="true">${ico}</span>`}</div>`}
function visualCard(item,type){let typeNames={offer:'OFERTA',mission:'MISIÓN PREMIUM',event:'EVENTO',place:'LUGAR'},kind=typeNames[type]||'EXPERIENCIA';let detail=type==='offer'?'offer-detail':type==='mission'?'mission-detail':type==='event'?'event':'place';let desc=String(item.description||'').trim();let date=type==='event'?fmt(item.start):null;let region=String(item.region||item.category||'').trim();let meta=type==='event'?[date,region].filter(Boolean).join(' · '):(region||'Florianópolis');let shortDesc=desc.split(/\n/).map(x=>x.trim()).filter(Boolean).filter(x=>!/^beneficio\s*:/i.test(x)).join(' ');let benefit=type==='mission'||type==='offer'?desc.split(/\n/).find(x=>/^beneficio\s*:/i.test(x.trim())):'';let free=Boolean(item.is_free||item.free);let km=type==='place'?proximityDistance(item):null;let distancePill=km!==null&&Number.isFinite(km)?`<span class="proximity-pill proximity-distance">📍 ${km<1?Math.round(km*1000)+' m':'A '+km.toFixed(1)+' km'}</span>`:'';let dateLabel=type==='event'?eventDateProximity(item):'';let datePill=dateLabel?`<span class="proximity-pill proximity-date">⏱ ${dateLabel}</span>`:'';return `<article class="visual-card visual-card--${type}">${visualPhoto(item,type==='mission'?'🎯':type==='offer'?'🎁':type==='event'?'📅':'🌴')}<div class="visual-card-content"><span class="visual-eyebrow">${kind}${free?' · GRATIS':''}</span><h3>${esc(item.name)}</h3><p class="visual-card-meta">${esc(meta)}</p>${distancePill||datePill?`<div class="visual-proximity">${distancePill}${datePill}</div>`:''}${shortDesc?`<p class="visual-card-excerpt">${esc(shortDesc)}</p>`:''}${benefit?`<p class="visual-benefit">${esc(benefit)}</p>`:''}<button class="visual-card-btn" data-go="${detail}" data-id="${esc(item.id)}">Ver detalles <span aria-hidden="true">→</span></button></div></article>`}
function swipeCards(items,type){return `<div class="swipe-cards ${items.length===1?'is-single':''}" role="region" aria-label="${type==='mission'?'Misiones Premium':type==='offer'?'Ofertas':type==='event'?'Eventos':'Lugares'}; deslizá horizontalmente" tabindex="0">${items.map(x=>visualCard(x,type)).join('')}</div>`}
function detailsPhoto(item,kind){return `<div class="detail-media">${visualPhoto(item,kind)}<span class="detail-photo-tag">${esc(kind==='🎯'?'MISIÓN PREMIUM':kind==='🎁'?'OFERTA':kind==='📅'?(item.free?'GRATIS':'EVENTO'):'DESCUBRÍ')}</span></div>`}
function detailButtonLinks(item,showMap=true){let parts=[];let phone=String(item.phone||item.contact||'').replace(/\D/g,'');if(phone.length>=10&&phone.length<=15)parts.push(`<a href="https://wa.me/${phone}" rel="noopener noreferrer" target="_blank" class="detail-action primary-action">WhatsApp ↗</a>`);let webpage=safeExternal(item.website||item.link||'');if(webpage)parts.push(`<a href="${esc(webpage)}" rel="noopener noreferrer" target="_blank" class="detail-action">Sitio web ↗</a>`);let instagram=safeExternal(item.instagram||'');if(instagram)parts.push(`<a href="${esc(instagram)}" rel="noopener noreferrer" target="_blank" class="detail-action">Instagram ↗</a>`);if(showMap){let mapsUrl=safeGoogleMapsUrl(item.google_maps_url);if(mapsUrl)parts.push(`<a href="${esc(mapsUrl)}" rel="noopener noreferrer" target="_blank" class="detail-action">Cómo llegar ↗</a>`);else{let map=item.lat!=null&&item.lng!=null?item.lat+','+item.lng:(item.region?item.region+', Florianópolis SC':null);if(map)parts.push(`<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(map)}" rel="noopener noreferrer" target="_blank" class="detail-action">Ver en mapa ↗</a>`)}}return parts.length?`<div class="detail-action-grid">${parts.join('')}</div>`:''}
function detailInfo(label,value){return value?`<div class="detail-info-row"><span>${label}</span><strong>${esc(value)}</strong></div>`:''}

function home(){let found=discoveryCount(),left=Math.max(0,places.length-found),near=filteredPlaces(ui.nearCategory,'',true).slice(0,12),todayEvents=matchingEvents(today());return `${header()}<div class="hero"><div class="eyebrow">ILHA DA MAGIA · FLORIANÓPOLIS</div><h1>${t('question')}</h1><p>${t('intro')}</p><div class="location"><span>📍 &nbsp;${store.location?t('locOn'):t('locAsk')}</span><button data-action="location">${store.location?'✓':t('activate')}</button></div>${searchbar('Playas, lugares, comer, hacer...')}</div><main class="content"><section class="section">${head('⏱️ '+t('discover'),t('discoverSub'),'discoveries','Ver progreso')}<div class="feature"><div class="feature-topline"><div class="eyebrow">${t('adventure')}</div><div class="floating-count"><strong>${found}</strong><small>DESCUBIERTOS</small></div></div><h3>${store.lang==='PT'?`Faltam ${left} lugares`:store.lang==='EN'?`${left} places remaining`:`Te faltan ${left} lugares`}</h3><p>${store.lang==='PT'?`Você descobriu ${found} de ${places.length} lugares publicados.`:store.lang==='EN'?`You discovered ${found} of ${places.length} published places.`:`Descubriste ${found} de ${places.length} lugares publicados.`}</p><div class="progress"><span style="width:${Math.min(places.length?found/places.length*100:0,100)}%"></span></div><div class="feature-foot"><span>${found}/${places.length} ${store.lang==='PT'?'descobertos':store.lang==='EN'?'discovered':'descubiertos'}</span><button class="soft-btn" data-go="discoveries">Ver detalles →</button></div></div></section><section class="section">${head('📍 '+t('near'),t('nearSub'),'near')}${chips([[t('all'),'Todo'],['🏖️ Playas','Praias'],['🥾 Trilhas','Trilhas'],['👀 Miradores','Mirantes'],['🌿 Naturaleza','Natureza']],'near',ui.nearCategory)}${store.location?near.length?swipeCards(near,'place'):'<div class="empty">Sin lugares publicados para este filtro.</div>':`<div class="empty"><strong>Activá la ubicación para ver lo que está cerca</strong><p>También podés explorar sin compartir tu ubicación.</p><button class="secondary" data-go="near" style="margin-top:12px">Ver detalles →</button></div>`}</section><section class="section">${head('📅 '+t('today'),t('todaySub'),'events')}${todayEvents.length?swipeCards(todayEvents,'event'):'<div class="empty">No hay eventos para hoy.<p>Consultá el calendario mensual para ver otras fechas.</p><button class="secondary" data-go="events" style="margin-top:12px">Ver calendario →</button></div>'}</section><section class="section">${head('🎯 '+t('premium'),t('premiumSub'),'missions')}${(window.ILHA_MISSIONS||[]).length?swipeCards((window.ILHA_MISSIONS||[]),'mission'):'<div class="empty">Todavía no hay misiones Premium disponibles. <button class="textlink" data-go="missions">Ver detalles →</button></div>'}</section><section class="section">${head('🎁 '+t('offers'),t('offersSub'),'offers')}${(window.ILHA_OFFERS||[]).length?swipeCards((window.ILHA_OFFERS||[]),'offer'):'<div class="empty">Todavía no hay ofertas comerciales publicadas. <button class="textlink" data-go="offers">Ver detalles →</button></div>'}</section><section class="section"><div class="ilha-home-install"><div><strong>📲 Llevá Ilha da Magia con vos</strong><p>Accedé desde el inicio de tu celular.</p></div><button type="button" data-action="open-install-guide">Instalar en mi celular →</button></div></section><section class="section"><div class="plain-card"><h3>${t('publish')}</h3><p>Mostrá tu negocio, servicio o experiencia en la isla.</p><button class="primary" data-go="publish">Ver opciones para publicar →</button></div></section></main>`}

function businessDirectory(){let bs=window.ILHA_BUSINESSES||[],cat=ui.category||'Todo';let filtered=cat==='Todo'?bs:bs.filter(x=>x.category===cat);let activeCategories=ilhaBusinessCategories.map(([icon,n])=>({icon,name:n,count:bs.filter(b=>b.category===n).length,desc:ilhaBusinessDescriptions[n]||'Descubrí negocios de esta categoría.'}));return `${header()}${subhead('Negocios y servicios')}<main class="content"><div class="ilha-business-hero"><h2>Negocios de Florianópolis</h2><p>Explorá comercios, servicios y experiencias con publicaciones vigentes dentro de Ilha da Magia.</p><div class="ilha-business-hero-stats"><div><strong>${bs.length}</strong><span>Negocios visibles</span></div><div><strong>${activeCategories.filter(x=>x.count>0).length}</strong><span>Categorías activas</span></div><div><strong>${filtered.length}</strong><span>${cat==='Todo'?'Resultados actuales':`En ${cat}`}</span></div></div></div><div class="ilha-business-filter"><button data-go="businesses" data-category="Todo" class="chip ${cat==='Todo'?'selected':''}">Todos</button>${ilhaBusinessCategories.map(([icon,n])=>`<button data-go="businesses" data-category="${esc(n)}" class="chip ${cat===n?'selected':''}">${icon} ${esc(n)}</button>`).join('')}</div>${cat==='Todo'?`<section class="ilha-panel"><div class="ilha-panel-head"><div><h2>Explorá por rubro</h2><p>Elegí una categoría para descubrir negocios relacionados.</p></div></div><div class="ilha-business-category-grid">${activeCategories.map(item=>`<button class="ilha-business-category" data-go="businesses" data-category="${esc(item.name)}"><span>${item.icon}</span><strong>${esc(item.name)}</strong><small>${item.count?`${item.count} ${item.count===1?'negocio visible':'negocios visibles'}`:'Próximamente'} · ${esc(item.desc)}</small></button>`).join('')}</div></section>`:''}<div class="ilha-business-list">${filtered.map(b=>`<article class="ilha-business-card"><div class="ilha-business-cover">${b.cover_url?`<img src="${esc(b.cover_url)}" alt="" loading="lazy" onerror="this.style.display='none'">`:(b.logo_url?`<img src="${esc(b.logo_url)}" alt="" loading="lazy" onerror="this.style.display='none'">`:'🏪')}</div><div class="ilha-business-card-copy"><small>${esc(b.category)} · ${esc(b.subcategory)}</small><h3>${esc(b.name)}</h3><p>${esc((b.description||'Conocé este negocio y sus publicaciones vigentes en Ilha da Magia.').slice(0,165))}</p><div class="ilha-business-card-meta">${b.region?`<span>📍 ${esc(b.region)}</span>`:''}${b.website?`<span>🌐 Sitio web</span>`:''}${b.instagram?`<span>📸 Instagram</span>`:''}</div><button class="secondary" data-go="business-detail" data-id="${esc(b.id)}">Ver ficha comercial →</button></div></article>`).join('')||'<div class="ilha-business-empty">Todavía no hay negocios con publicaciones vigentes en esta categoría.</div>'}</div></main>`}
function businessDetail(){let b=(window.ILHA_BUSINESSES||[]).find(x=>String(x.id)===String(ui.selectedId));if(!b)return missing();let number=String(b.phone||'').replace(/\D/g,'');let links=[number.length>=10&&number.length<=15?`<a class="detail-action primary-action" href="https://wa.me/${number}?text=${encodeURIComponent('Hola, vi '+b.name+' en Ilha da Magia y quiero consultar.')}" target="_blank" rel="noopener noreferrer">WhatsApp ↗</a>`:'',b.lat!=null&&b.lng!=null?`<a class="detail-action" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(b.lat+','+b.lng)}" target="_blank" rel="noopener noreferrer">Cómo llegar ↗</a>`:'',b.instagram?`<a class="detail-action" href="${esc(b.instagram)}" target="_blank" rel="noopener noreferrer">Instagram ↗</a>`:'',b.website?`<a class="detail-action" href="${esc(b.website)}" target="_blank" rel="noopener noreferrer">Sitio web ↗</a>`:''].filter(Boolean);let media=b.cover_url||b.logo_url;return `${header()}${subhead('Ficha comercial')}<main class="content detail-page"><div class="ilha-business-detail-shell"><div class="ilha-business-detail-hero">${media?`<img src="${esc(media)}" alt="Imagen de ${esc(b.name)}" onerror="this.style.display='none'">`:''}<div class="ilha-business-detail-summary"><div class="ilha-business-logo">${b.logo_url?`<img src="${esc(b.logo_url)}" alt="Logo de ${esc(b.name)}" onerror="this.style.display='none'">`:'🏪'}</div><div class="ilha-business-summary-copy"><span class="detail-category">${esc(b.category)} · ${esc(b.subcategory)}</span><h2>${esc(b.name)}</h2><p>📍 ${esc(b.region||'Florianópolis')}</p></div></div></div><div class="ilha-business-meta-strip"><div class="ilha-mini-stat"><span>Rubro</span><strong>${esc(b.category)}</strong></div><div class="ilha-mini-stat"><span>Subcategoría</span><strong>${esc(b.subcategory||'General')}</strong></div><div class="ilha-mini-stat"><span>Ubicación</span><strong>${esc(b.region||'Florianópolis')}</strong></div></div><section class="ilha-business-info-card"><h3>Sobre el negocio</h3><p>${esc(b.description||'Conocé este negocio y sus publicaciones activas dentro de Ilha da Magia.')}</p></section><section class="ilha-business-info-card"><h3>Contacto y accesos</h3><div class="ilha-business-action-grid">${links.join('')||'<div class="ilha-business-empty">Todavía no hay enlaces públicos para mostrar.</div>'}</div></section><section class="ilha-business-info-card"><h3>Publicaciones activas</h3><div id="ilha-business-publications" data-business="${esc(b.id)}" class="ilha-business-publications"><div class="ilha-business-empty">Cargando publicaciones…</div></div></section><section class="ilha-business-info-card"><h3>Compartir negocio</h3><div class="ilha-business-action-grid"><button class="detail-action" data-action="share-business" data-id="${esc(b.id)}">↗ Compartir ficha</button><button class="detail-action" data-go="businesses" data-category="${esc(b.category)}">Ver más de este rubro</button></div></section></div></main>`}
async function ilhaLoadBusinessPublications(){let el=document.getElementById('ilha-business-publications');if(!el)return;let id=el.dataset.business;try{const db=window.ILHA_BACKEND?.client;if(!db)throw Error('Sin conexión');let r=await db.rpc('get_public_business_publications',{p_business_id:id});if(r.error)throw r.error;if(!document.getElementById('ilha-business-publications')||document.getElementById('ilha-business-publications').dataset.business!==id)return;el=document.getElementById('ilha-business-publications');el.innerHTML=(r.data||[]).map(x=>`<article class="ilha-business-publication">${x.photo_url?`<img src="${esc(x.photo_url)}" loading="lazy" alt="">`:''}<div><small>${x.kind==='mission'?'🎯 Misión Premium':'🏷️ Publicación comercial'}</small><strong>${esc(x.name||'Publicación')}</strong><p>${esc((x.description||'').slice(0,240))}</p><button class="secondary" data-go="${x.kind==='mission'?'mission-detail':'offer-detail'}" data-id="${esc(x.id)}">Ver publicación →</button></div></article>`).join('')||'<div class="ilha-business-empty">Este negocio no tiene publicaciones activas para mostrar en este momento.</div>'}catch(e){el.innerHTML='<div class="ilha-business-empty">No se pudieron cargar las publicaciones. '+esc(String(e.message||e).slice(0,80))+'</div>'}}

er catálogo →</button></div><div class="ilha-business-list">${featured.map(b=>`<article class="ilha-business-card"><div class="ilha-business-cover">${b.cover_url?`<img src="${esc(b.cover_url)}" alt="" loading="lazy" onerror="this.style.display='none'">`:(b.logo_url?`<img src="${esc(b.logo_url)}" alt="" loading="lazy" onerror="this.style.display='none'">`:'🏪')}</div><div class="ilha-business-card-copy"><small>${esc(b.category)} · ${esc(b.subcategory)}</small><h3>${esc(b.name)}</h3><p>${esc((b.description||'Conocé este negocio dentro de Ilha da Magia.').slice(0,150))}</p><div class="ilha-business-card-meta">${b.region?`<span>📍 ${esc(b.region)}</span>`:''}</div><button class="secondary" data-go="business-detail" data-id="${esc(b.id)}">Conocer negocio →</button></div></article>`).join('')}</div></section>`:''}</div></main>`}

function monthCalendar(){let y=Number(ui.calendarMonth.slice(0,4)),m=Number(ui.calendarMonth.slice(5,7))-1;let start=new Date(y,m,1),offset=(start.getDay()+6)%7,total=new Date(y,m+1,0).getDate(),cells=Math.ceil((offset+total)/7)*7;let monthLabel=new Intl.DateTimeFormat(store.lang==='PT'?'pt-BR':store.lang==='EN'?'en-US':'es-AR',{month:'long',year:'numeric'}).format(start);let weekdays=store.lang==='EN'?['M','T','W','T','F','S','S']:store.lang==='PT'?['S','T','Q','Q','S','S','D']:['L','M','X','J','V','S','D'];return `<section class="calendar-box" aria-label="Calendario mensual de eventos"><div class="calendar-toolbar"><div><p class="calendar-kicker">EXPLORÁ POR FECHA</p><h3>${esc(monthLabel.charAt(0).toUpperCase()+monthLabel.slice(1))}</h3></div><div class="calendar-controls"><button type="button" data-action="month-prev" aria-label="Mes anterior">‹</button><button type="button" data-action="month-today" aria-label="Volver a este mes">Hoy</button><button type="button" data-action="month-next" aria-label="Mes siguiente">›</button></div></div><div class="calendar-weekdays">${weekdays.map(d=>`<span>${d}</span>`).join('')}</div><div class="calendar-grid">${Array.from({length:cells},(_,i)=>{let num=i-offset+1; if(num<1||num>total)return `<span class="calendar-blank" aria-hidden="true"></span>`;let d=[y,String(m+1).padStart(2,'0'),String(num).padStart(2,'0')].join('-'),count=matchingEvents(d).length,selected=ui.date===d,isToday=d===today();return `<button type="button" class="calendar-day ${selected?'selected':''} ${isToday?'is-today':''}" data-action="date" data-value="${d}" aria-label="${num} de ${esc(monthLabel)}, ${count} evento${count===1?'':'s'}" aria-pressed="${selected}"><span>${num}</span>${count?`<i class="calendar-dot" title="${count} eventos"></i>`:'<i class="calendar-dot empty-dot"></i>'}</button>`}).join('')}</div><p class="calendar-hint"><span class="calendar-dot"></span> Días con eventos publicados</p></section>`}
function events(){let dayEvents=matchingEvents(ui.date);return `${subhead('Eventos y Tours')}<div class="feature subhero"><div class="eyebrow">📅 EVENTOS Y TOURS</div><h2>${t('eventTitle')}</h2><p>${t('eventSub')}</p></div><main class="content">${monthCalendar()}<section class="section calendar-results"><div class="heading"><div><h2>${fmt(ui.date)}</h2><p>${dayEvents.length?dayEvents.length+' evento(s) para este día':'Actividades para el día seleccionado'}</p></div></div>${dayEvents.length?`<div class="visual-list">${dayEvents.map(smallEvent).join('')}</div>`:'<div class="empty">No hay eventos publicados para este día. Elegí otra fecha del calendario.</div>'}</section><div class="plain-card" style="margin-top:24px"><h3>¿Organizás un evento?</h3><p>Los eventos comunitarios son gratuitos y sin límite de cantidad. Las publicaciones comerciales requieren Plan Evento.</p><button class="primary" data-go="publish">Publicar evento</button></div></main>`}

/* Galería de lugares naturales: lee el bloque guardado en recommendations. */
const ILHA_GALLERY_TAG='@@ILHA_GALLERY_V1@@';
function placeGalleryData(raw){let s=String(raw||''),at=s.lastIndexOf('\n'+ILHA_GALLERY_TAG);if(at<0)return {notes:s,images:[],videos:[]};try{const payload=JSON.parse(decodeURIComponent(s.slice(at+1+ILHA_GALLERY_TAG.length)));return {notes:s.slice(0,at),images:Array.isArray(payload.images)?payload.images.filter(x=>typeof x==='string'):[],videos:Array.isArray(payload.videos)?payload.videos.filter(x=>typeof x==='string'):[]}}catch{return {notes:s,images:[],videos:[]}}}
function galleryPlaceView(place){const data=placeGalleryData(place.recommendations),photo=safeExternal(place.photo_url||''),images=[photo,...data.images].filter(Boolean),videos=data.videos.filter(Boolean),uniqueImages=[...new Set(images.map(x=>safeExternal(x)).filter(Boolean))],uniqueVideos=[...new Set(videos.map(x=>safeExternal(x)).filter(Boolean))];if(!uniqueImages.length&&!uniqueVideos.length)return '';return `<section class="detail-section"><h3>Galería · ${uniqueImages.length} fotos y ${uniqueVideos.length} videos</h3><div class="ilha-place-gallery" tabindex="0" aria-label="Galería de fotos y videos, deslizá hacia los lados">${uniqueImages.map((url,n)=>`<figure class="ilha-gallery-item"><img src="${esc(url)}" loading="lazy" alt="${esc(place.name)} · Foto ${n+1}"><figcaption>Foto ${n+1} de ${uniqueImages.length}</figcaption></figure>`).join('')}${uniqueVideos.map((url,n)=>`<figure class="ilha-gallery-item"><video controls playsinline preload="metadata" src="${esc(url)}" aria-label="${esc(place.name)} · Video ${n+1}"></video><figcaption>Video ${n+1} de ${uniqueVideos.length}</figcaption></figure>`).join('')}</div><p class="fineprint">Deslizá hacia un costado para ver más fotos y videos.</p></section>`}

function publish(){return `${header()}${subhead('Crear publicación')}<div class="feature subhero"><div class="eyebrow">📣 ILHA DA MAGIA</div><h2>¿Qué querés publicar?</h2><p>Elegí una modalidad y conocé su precio y sus condiciones antes de continuar.</p></div><main class="content"><div class="plain-card"><div class="form-field"><label>Modalidad</label><select id="publish-kind"><option value="event" ${ui.publishType==='event'?'selected':''}>Evento comunitario · GRATIS</option><option value="offer" ${ui.publishType==='offer'?'selected':''}>Plan Básico · ${ilhaPlanMoney('basic')}</option><option value="premium" ${ui.publishType==='premium'?'selected':''}>Plan Premium · ${ilhaPlanMoney('premium')}</option><option value="commercial-event" ${ui.publishType==='commercial-event'?'selected':''}>Plan Evento · ${ilhaPlanMoney('event')}</option></select></div><div id="publish-explain">${publishExplain()}</div><button class="primary full" data-action="publish-next">Continuar →</button></div><button class="secondary full" data-go="plans" style="margin-top:13px">Comparar todos los planes y detalles</button></main>`}
function publishExplain(){if(ui.publishType==='event')return `<div class="notice">GRATIS · Evento comunitario sin precio de entrada. Publicación inmediata, revisión posterior. No es un evento comercial.</div>`;const code=ui.publishType==='offer'?'basic':ui.publishType==='premium'?'premium':'event',p=ilhaCommercialPlans[code];return `<div class="ilha-publish-price"><span><b>${p.name}</b><br>${p.unit}</span><strong>${ilhaPlanMoney(code)}</strong></div><p class="small">${p.short}</p><ul class="ilha-publish-benefits">${p.features.map(x=>`<li>${x}</li>`).join('')}</ul><div class="notice">Formulario → solicitud a ADMIN → coordinación del pago → revisión y aprobación → publicación. Sin cobro automático.</div>`}

function commercialForm(){let plan=ui.commercialPlan||'basic',event=plan==='event',premium=plan==='premium';let kinds=['Turismo','Eventos y fiestas','Boliches y vida nocturna','Música','Gastronomía','Deportes y aventura','Cultura','Ferias','Experiencias','Otros'];return `${header()}${subhead('Solicitar Plan '+({basic:'Básico',premium:'Premium',event:'Evento'}[plan]))}<main class="content"><div class="ilha-plan-summary"><strong>${ilhaCommercialPlans[plan].icon} Plan ${ilhaCommercialPlans[plan].name} · ${ilhaPlanMoney(plan)}</strong><p>${ilhaCommercialPlans[plan].unit} · ${ilhaCommercialPlans[plan].period}. ${ilhaCommercialPlans[plan].short}</p><button type="button" class="textlink" data-go="plans">← Comparar planes</button></div><div class="plain-card"><p>Completá los datos. La solicitud se guarda en ADMIN antes de abrir WhatsApp. No se realizará ningún cobro automático.</p><form data-form="commercial" id="commercial-request"><div class="form-field"><label>Nombre del comercio u organizador *</label><input name="business_name" required maxlength="160"></div><div class="form-field"><label>Responsable *</label><input name="responsible_name" required maxlength="140"></div><div class="form-field"><label>WhatsApp de contacto con código de país *</label><input name="contact_phone" type="tel" inputmode="tel" required placeholder="Ej. +55 48 99999-9999"></div><div class="form-field"><label>Correo (opcional)</label><input name="contact_email" type="email"></div>${ILHA_SMART.contacts()}${ILHA_SMART.location()}${!event?`<section class="ilha-business-profile-fields"><h3>🏪 Perfil de tu negocio</h3><p>Esta información formará la ficha comercial una vez que ADMIN confirme el pago y apruebe la solicitud.</p><div class="form-field"><label>Rubro comercial *</label><select name="business_category" id="business-category" required><option value="">Elegí un rubro</option>${ilhaBusinessCategories.map(([icon,n])=>`<option value="${esc(n)}">${icon} ${esc(n)}</option>`).join('')}</select></div><div class="form-field"><label>Subcategoría *</label><select name="business_subcategory" id="business-subcategory" required><option value="">Primero elegí un rubro</option></select></div><div class="form-field"><label>Descripción del negocio *</label><textarea name="business_description" required minlength="15" maxlength="2000" placeholder="Contá qué ofrece tu negocio, a quién está dirigido y qué lo hace especial."></textarea></div><div class="form-field"><label>Logo del negocio (opcional)</label><input name="business_logo" type="file" accept="image/jpeg,image/png,image/webp"></div><p class="helper">La imagen principal del formulario se utilizará como portada de la ficha.</p></section>`:''}${event?`<h3>Actividad o evento comercial</h3><div class="form-field"><label>Nombre *</label><input name="eventName" required maxlength="100"></div><div class="form-field"><label>Categoría *</label><select name="eventCategory">${kinds.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="form-field"><label>Descripción y actividad *</label><textarea name="eventDescription" required minlength="10" maxlength="1500"></textarea></div><div class="two"><div class="form-field"><label>Inicio *</label><input name="eventStart" type="date" min="${today()}" required></div><div class="form-field"><label>Finalización *</label><input name="eventEnd" type="date" min="${today()}" required></div></div><div class="two"><div class="form-field"><label>Horario inicial</label><input name="eventTimeStart" type="time"></div><div class="form-field"><label>Horario final</label><input name="eventTimeEnd" type="time"></div></div><div class="form-field"><label>Precio de entrada o actividad (R$) *</label><input name="eventPrice" required maxlength="60" placeholder="Ej.: R$ 50"></div>`:Array.from({length:premium?3:1},(_,i)=>`<section class="plain-card" style="margin:12px 0;background:#f4faf9"><h3>${premium?'Publicación '+(i+1)+(i?' · opcional':' · obligatoria'):'Tu oferta o producto'}</h3>${premium?`<div class="form-field"><label>Tipo de publicación (seleccioná “Misión” para crear una misión real)</label><select name="kind${i}"><option value="offer">Oferta / producto / servicio (no es misión)</option><option value="mission">Misión con actividad y superdescuento</option></select></div>`:''}<div class="form-field"><label>Título ${i===0?'*':''}</label><input name="itemName${i}" maxlength="150" ${i===0?'required':''}></div><div class="form-field"><label>Descripción ${i===0?'*':''}</label><textarea name="itemDescription${i}" maxlength="1500" ${i===0?'required':''}></textarea></div><div class="form-field"><label>Beneficio, descuento y condiciones</label><textarea name="itemBenefit${i}" maxlength="700" placeholder="Ej.: 30% de descuento; válido para..."></textarea></div>${premium?`<div class="form-field"><label>Instrucciones de misión (si elegiste misión)</label><textarea name="itemInstructions${i}" maxlength="1000" placeholder="Ej.: realizar una actividad, check-in y fotografía..."></textarea></div>`:''}<div class="form-field"><label>Elegir foto del dispositivo</label><input name="itemFile${i}" type="file" accept="image/jpeg,image/png,image/webp"></div><div class="form-field"><label>O tomar una foto</label><input name="itemCamera${i}" type="file" accept="image/*" capture="environment"></div><div class="form-field"><label>O enlace de imagen</label><input name="itemUrl${i}" type="url" placeholder="https://..."></div></section>`).join('')}<h3>Imagen principal ${event?'del evento':'del negocio'} (opcional)</h3>${ILHA_SMART.media()}<div class="form-field"><label><input type="checkbox" name="confirm" required> Confirmo que puedo publicar estos datos y acepto que la solicitud requiere revisión y pago.</label></div><button class="primary full" type="submit">Guardar solicitud y contactar por WhatsApp</button></form></div></main>`}
function commercialResult(){let r=window.ILHA_LAST_REQUEST;if(!r)return `${header()}${subhead('Solicitud')}<main class="content"><div class="empty">Sin solicitud reciente.</div></main>`;let number=String(window.ILHA_SETTINGS?.whatsapp||'').replace(/\D/g,''),textMsg=`Hola, quiero contratar en ILHA DA MAGIA.%0A`;let message='Hola, quiero contratar en ILHA DA MAGIA.\nSolicitud: '+r.id+'\nPlan: '+({basic:'Básico',premium:'Premium',event:'Evento'}[r.plan_code])+'\nComercio: '+r.business_name+'\nYa completé el formulario. Quiero coordinar el pago y la activación.';return `${header()}${subhead('Solicitud recibida')}<main class="content"><div class="plain-card"><h2>✅ Solicitud guardada en ADMIN</h2><p>Identificador:</p><div class="notice" style="overflow-wrap:anywhere">${esc(r.id)}</div><p>La solicitud está pendiente. WhatsApp no envía el mensaje automáticamente: tenés que tocar Enviar.</p>${number.length>=10&&number.length<=15?`<a class="primary" style="display:block;text-align:center;text-decoration:none" target="_blank" rel="noopener noreferrer" href="https://wa.me/${number}?text=${encodeURIComponent(message)}">Abrir WhatsApp con mensaje preparado ↗</a>`:`<div class="notice">El número oficial todavía no fue configurado en ADMIN. Copiá el mensaje y usá Contacto cuando esté disponible.</div>`}<button class="secondary full" data-action="copy-request" style="margin-top:12px">Copiar mensaje de solicitud</button><button class="secondary full" data-go="home" style="margin-top:12px">Volver al inicio</button></div></main>`}
function eventForm(){return `${header()}${subhead('Publicar evento comunitario')}<main class="content"><div class="plain-card"><h3>Datos del evento</h3><p>Tu evento aparecerá públicamente al enviarlo correctamente y quedará pendiente de revisión posterior.</p><form data-form="event" id="event-form"><div class="form-field"><label>Nombre del evento *</label><input name="name" required maxlength="100" placeholder="Ej.: Encuentro en la plaza"></div><div class="form-field"><label>Descripción *</label><textarea name="description" required maxlength="1500" placeholder="Contanos de qué se trata"></textarea></div><div class="form-field"><label>Categoría *</label><select name="category"><option>Comunitario</option><option>Cultural</option><option>Deportivo</option><option>Educativo</option><option>Musical</option><option>Otro</option></select></div><div class="two"><div class="form-field"><label>Fecha de inicio *</label><input name="start" type="date" min="${today()}" value="${today()}" required></div><div class="form-field"><label>Fecha de finalización *</label><input name="end" type="date" min="${today()}" value="${today()}" required></div></div><div class="two"><div class="form-field"><label>Hora de inicio</label><input name="timeStart" type="time"></div><div class="form-field"><label>Hora de cierre</label><input name="timeEnd" type="time"></div></div>${ILHA_SMART.location()}<div class="form-field"><label>Nombre del organizador *</label><input name="organizer" required maxlength="100"></div>${ILHA_SMART.contacts()}${ILHA_SMART.media()}<div class="notice">🎟️ GRATIS · Evento comunitario sin precio de entrada.</div><div class="form-field"><label><input type="checkbox" name="confirm" required class="toggle"> Confirmo que soy responsable por el contenido y sus datos.</label></div><button class="primary full" type="submit">Publicar evento</button></form></div></main>`}
function eventDetail(){let e=store.events.find(x=>x.id===ui.selectedId);if(!e)return missing();let saved=store.saved.some(x=>x.type==='event'&&x.id===e.id);return `${header()}${subhead('Evento')}<main class="content detail-page">${detailsPhoto(e,'📅')}<div class="detail-head"><span class="detail-category">${esc(e.category||'Evento')} · ${e.free?'GRATIS':'COMERCIAL'}</span><h2>${esc(e.name)}</h2><p>📍 ${esc(e.region||'Florianópolis')}</p></div>${sharePanel(e)}<section class="detail-section"><h3>Sobre el evento</h3><p class="detail-description">${esc(e.description||'')}</p></section><section class="detail-section"><h3>Información del evento</h3><div class="detail-info">${detailInfo('Fecha',fmt(e.start)+(e.end!==e.start?' — '+fmt(e.end):''))}${detailInfo('Horario',(e.timeStart||'A confirmar')+(e.timeEnd?' — '+e.timeEnd:''))}${detailInfo('Entrada',e.free?'GRATIS':e.price||'Consultar precio')}${detailInfo('Organiza',e.organizer)}</div></section><section class="detail-section"><h3>Contacto y ubicación</h3>${detailButtonLinks(e)}</section><section class="detail-section"><button class="detail-action detail-save" data-action="save" data-type="event" data-id="${esc(e.id)}">${saved?'♥ Evento guardado':'♡ Guardar evento'}</button><p class="fineprint">Publicación pública · Sujeta a revisión posterior</p></section></main>`}
function myPosts(){let mine=window.ILHA_MY_EVENTS||[];return `${header()}${subhead('Mis publicaciones')}<main class="content"><div class="plain-card"><h3>Publicaciones y contrataciones</h3><p>Los eventos comunitarios se publican gratuitamente y quedan sujetos a revisión posterior. Los planes comerciales se siguen desde Mis solicitudes.</p><button class="secondary full" style="margin-top:14px" data-go="commercial-requests">Ver mis solicitudes comerciales →</button></div><h2 style="margin-top:25px">Mis eventos comunitarios (${mine.filter(e=>e.mode==='community').length})</h2>${mine.filter(e=>e.mode==='community').map(e=>`<div class="list-card"><div class="list-icon">📅</div><div class="list-main"><strong>${esc(e.name)}</strong><small>${esc(e.start)} · ${esc(e.review_status==='pending'?'Revisión pendiente':e.review_status)} · ${esc(e.end<today()?'Finalizado':e.status==='published'?'Visible':'No visible')}</small></div></div>`).join('')||'<div class="empty">No tenés eventos comunitarios registrados en esta cuenta.</div>'}<button class="primary" data-go="publish">+ Nueva publicación</button></main>`}
const requestNames={pending:'Pendiente',in_contact:'En contacto',awaiting_payment:'Esperando pago',payment_confirmed:'Pago confirmado',approved:'Aprobada y publicada',changes_requested:'Requiere cambios',rejected:'Rechazada'};
let myReqLoading=false,myReqLoaded=false,myReqError='',myReqRows=[],myReqHistory={},myReqEvents=[];
async function syncMyRequests(force=false){if(myReqLoading||myReqLoaded&&!force)return;myReqLoading=true;myReqError='';if(['profile','commercial-requests','my-posts'].includes(ui.page))render();try{const api=window.ILHA_BACKEND;if(!api?.ready)throw Error('No hay conexión con Supabase.');const [r,e]=await Promise.all([api.loadMyRequests(),api.loadMyEvents()]);myReqRows=r.items;myReqHistory=r.history;myReqEvents=e;window.ILHA_MY_EVENTS=e;myReqLoaded=true}catch(err){myReqError=String(err.message||err);myReqLoaded=false}finally{myReqLoading=false;if(['profile','commercial-requests','my-posts'].includes(ui.page))render()}}
function merchantSummary(){let pending=myReqRows.filter(r=>!['approved','rejected'].includes(r.status)).length, approved=myReqRows.filter(r=>r.status==='approved').length, published=myReqRows.filter(r=>r.status==='approved').reduce((n,r)=>n+(r.plan_code==='event'?1:r.payload?.items?.length||0),0);return{total:myReqRows.length,pending,approved,published}}
function commercialRequests(){let s=merchantSummary(),phone=String(window.ILHA_SETTINGS?.whatsapp||'').replace(/\D/g,'');return `${header()}${subhead('Mis solicitudes')}<main class="content"><div class="plain-card"><h3>Mi actividad comercial</h3><p>Los números corresponden a tus solicitudes guardadas en Supabase, no a ventas o visitas estimadas.</p><div class="req-stats">${[['Solicitudes',s.total],['En proceso',s.pending],['Aprobadas',s.approved],['Publicaciones aprobadas',s.published]].map(([label,n])=>`<div class="req-metric"><strong>${n}</strong><span>${label}</span></div>`).join('')}</div><button class="secondary full" data-action="refresh-my-requests">↻ Actualizar solicitudes</button></div>${myReqLoading?'<div class="req-loading">Consultando tus datos…</div>':''}${myReqError?`<div class="notice req-err">No fue posible cargar tus solicitudes: ${esc(myReqError)}. <button data-action="refresh-my-requests">Reintentar</button></div>`:''}<section class="section" style="margin-top:25px">${head('Mis pedidos','Cada solicitud conserva su historial de revisión.')} ${myReqRows.length?myReqRows.map(r=>{let details=r.plan_code==='event'?[r.payload?.event]:r.payload?.items||[];let msg='Hola, escribo por mi solicitud ILHA DA MAGIA.\nSolicitud: '+r.id+'\nPlan: '+r.plan_code+'\nComercio: '+r.business_name+'\nQuiero consultar el pago y la activación.';return `<div class="plain-card req-card"><div class="req-inline"><span class="tag">${esc(({basic:'Básico',premium:'Premium',event:'Evento'})[r.plan_code]||r.plan_code)}</span><span class="req-badge" data-state="${esc(r.status)}">${esc(requestNames[r.status]||r.status)}</span></div><h3 style="margin-top:12px">${esc(r.business_name)}</h3><p class="req-small">Enviada: ${esc(new Date(r.created_at).toLocaleDateString('es-AR'))} · Ref. ${esc(r.id.slice(0,8).toUpperCase())}</p><p><b>Pago:</b> ${r.payment_confirmed?'Confirmado':'Pendiente de confirmación'}</p>${details.map(d=>`<div class="req-item">${esc(d?.name||'Publicación')} ${d?.kind==='mission'?'🎯':''}</div>`).join('')}${r.reviewer_note?`<div class="notice"><b>Mensaje de administración:</b> ${esc(r.reviewer_note)}</div>`:''}${(myReqHistory[r.id]||[]).length?`<details><summary>Ver historial de cambios</summary><div class="req-timeline">${myReqHistory[r.id].map(h=>`<p>${esc(new Date(h.created_at).toLocaleString('es-AR'))} · ${esc(requestNames[h.new_status]||h.new_status)}${h.note?'<br>'+esc(h.note):''}</p>`).join('')}</div></details>`:''}${phone.length>=10&&phone.length<=15?`<a class="secondary" style="display:inline-block;text-decoration:none;margin-top:12px" target="_blank" rel="noopener noreferrer" href="https://wa.me/${phone}?text=${encodeURIComponent(msg)}">Consultar por WhatsApp ↗</a>`:''}</div>`}).join(''):'<div class="empty">Todavía no tenés solicitudes comerciales en esta cuenta. Podés elegir un plan y enviar una nueva.</div>'}<button class="primary full" data-go="plans">Elegir plan comercial</button></section><div class="notice">Visualizaciones, clics y contactos todavía no se miden en esta versión. No mostramos cifras ficticias.</div></main>`}
function activity(){return `${header()}${subhead('Mi actividad')}<main class="content"><div class="two"><div class="plain-card"><h3>${discoveryCount()}</h3><p>Lugares descubiertos</p></div><div class="plain-card"><h3>${store.saved.length}</h3><p>Guardados</p></div><div class="plain-card"><h3>${store.events.length}</h3><p>Eventos publicados</p></div><div class="plain-card"><h3>${store.missions.length}</h3><p>Misiones completadas</p></div></div><div class="notice">Las solicitudes comerciales y sus aprobaciones se consultan en tiempo real desde Mi perfil. Todavía no medimos visitas, visualizaciones ni clics.</div>${menu('📋','Mis solicitudes comerciales','Seguimiento y estadísticas verificadas','commercial-requests')}${menu('🌴','Descubrimientos','Progreso natural','discoveries')}${menu('📣','Publicaciones','Tus eventos publicados','my-posts')}</main>`}
function photos(){let mine=myCommunity();return `${header()}${subhead('Mis fotos')}<main class="content"><section class="detail-section"><h3>📸 Mis aportes a la comunidad</h3><p class="detail-description">Estas son las fotos que compartiste al descubrir lugares de Florianópolis.</p>${mine.length?mine.map(r=>{const p=places.find(x=>x.id===r.place_id),url=contributionPhoto(r);return `<div class="community-profile-item">${url?`<img src="${esc(url)}" loading="lazy" alt="${esc(p?.name||'Lugar descubierto')}">`:''}<div><strong>${esc(p?.name||'Lugar descubierto')}</strong><small>${esc(communityDate(r.created_at))} · ${esc(r.display_name)}</small></div><button class="textlink" data-go="place" data-id="${esc(r.place_id)}">Ver</button></div>`}).join(''):'<p class="community-empty">Cuando compartas un descubrimiento con una foto, aparecerá acá.</p>'}</section></main>`}
function editProfile(){return `${header()}${subhead('Editar perfil')}<main class="content"><div class="plain-card"><h3>Tu perfil de invitado</h3><p>Tu nombre se usará públicamente en los nuevos aportes. El contacto sigue siendo privado y local.</p><form data-form="profile"><div class="form-field"><label>Nombre visible</label><input name="name" value="${esc(store.profile.name)}" maxlength="70" placeholder="Tu nombre"></div><div class="form-field"><label>Contacto (opcional)</label><input name="contact" value="${esc(store.profile.contact)}" maxlength="120" placeholder="Email o teléfono"></div><button class="primary full" type="submit">Guardar perfil</button></form></div></main>`}
function notifications(){const visible=ilhaNotifs.filter(x=>ilhaNotifPrefs[x.category]!==false),unread=visible.filter(x=>!ilhaNotifsRead.has(x.id)).length;return `${header()}${subhead('Notificaciones')}<main class="content"><section class="plain-card"><div class="row-between"><div><h3 style="margin:0">🔔 Tus novedades</h3><p class="ilha-notif-info">${unread} sin leer · ${visible.length} avisos</p></div><button class="secondary" type="button" data-action="notif-refresh">↻ Actualizar</button></div><p class="ilha-notif-info">Las novedades se guardan en la aplicación y se sincronizan con tu sesión. Los avisos automáticos se distribuyen de 09:00 a 13:00, de 13:00 a 19:00 y de 19:00 a 23:00 (hora de Florianópolis), máximo uno por categoría en cada franja.</p></section><section class="ilha-notif-list">${ilhaNotifLoading?'<div class="empty">Cargando tus notificaciones…</div>':ilhaNotifError?`<div class="empty">${store.lang==='PT'?'Não foi possível conectar às notificações:':store.lang==='EN'?'Could not connect to notifications:':'No pudimos conectar con las notificaciones:'} ${esc(ilhaNotifError)}</div>`:!ilhaNotifLoaded?'<div class="empty">Tocá Actualizar para ver las novedades.</div>':visible.length?visible.map(x=>{const read=ilhaNotifsRead.has(x.id),link=ilhaSafeNotificationLink(x.target_url);return `<article class="ilha-notif ${read?'':'unread'}"><div class="ilha-notif-meta"><span>${esc(ilhaNotifCategory(x.category))}</span><span>${x.published_at?esc(new Date(x.published_at).toLocaleDateString(store.lang==='PT'?'pt-BR':store.lang==='EN'?'en-US':'es-AR')):''}</span>${read?'':'<span>● Nueva</span>'}</div><h3>${esc(x.title)}</h3><p>${esc(x.body)}</p><div class="ilha-notif-actions">${!read?`<button class="secondary" data-action="notif-read" data-id="${esc(x.id)}">Marcar leída</button>`:''}${link?`<button class="secondary" data-action="notif-open" data-id="${esc(x.id)}">Abrir novedad ↗</button>`:''}</div></article>`}).join(''):'<div class="empty">No hay novedades en las categorías seleccionadas.</div>'}</section><section class="plain-card"><h3>⚙️ Qué querés recibir</h3><p class="ilha-notif-info">Elegí tus temas. Tus preferencias se guardan en Supabase, no solamente en este celular.</p>${[['general','Anuncios importantes','Información sobre ILHA DA MAGIA'],['events','Eventos','Actividades y fechas nuevas'],['places','Lugares naturales','Nuevos rincones y atractivos'],['missions','Misiones','Retos y experiencias'],['offers','Ofertas','Promociones de comercios']].map(([key,label,desc])=>`<label class="ilha-notif-setting"><span><strong>${label}</strong><small>${desc}</small></span><input type="checkbox" data-action="notification-pref" data-value="${key}" ${ilhaNotifPrefs[key]?'checked':''}></label>`).join('')}<div class="divider"></div><h3>📍 Avisos de lugares cercanos</h3><p class="ilha-notif-info">Radio de 8 km. Compartí tu ubicación solo si querés recomendaciones de proximidad; caduca a las 24 horas y podés borrarla cuando quieras.</p><button type="button" class="secondary" data-action="notif-nearby" data-value="${ilhaNotifyNearbyEnabled?'off':'on'}">${ilhaNotifyNearbyEnabled?'Dejar de compartir ubicación':'Permitir ubicación para avisos cercanos'}</button><div class="divider"></div><h3>📲 Notificaciones del teléfono</h3><p class="ilha-notif-info">Autorizá las notificaciones para recibir avisos aunque la app esté cerrada. En iPhone tenés que abrirla instalada desde la pantalla de inicio.</p><button type="button" class="secondary" data-action="notif-push" data-value="${ilhaNotifPrefs.push_enabled?'off':'on'}">${ilhaNotifPrefs.push_enabled?'Desactivar avisos del teléfono':'Activar notificaciones del teléfono'}</button><p class="ilha-notif-info">Estado: ${typeof Notification==='undefined'?'Este navegador no soporta notificaciones.':Notification.permission==='granted'?'Permiso del dispositivo concedido.':Notification.permission==='denied'?'Notificaciones bloqueadas en ajustes del dispositivo.':'Las alertas del teléfono todavía no están activadas.'}</p></section></main>`}

function handleLocation(){if(!navigator.geolocation){toast('Este navegador no dispone de geolocalización.');return}if(!window.isSecureContext){toast('La ubicación requiere HTTPS o localhost.');return}navigator.geolocation.getCurrentPosition(p=>{store.location={lat:p.coords.latitude,lng:p.coords.longitude,at:Date.now()};persist();toast('Ubicación activada.');render()},()=>toast('No se pudo obtener tu ubicación. Revisá los permisos del navegador.'),{enableHighAccuracy:false,timeout:12000,maximumAge:60000})}
function photoRead(file){return new Promise(resolve=>{if(!file){resolve('');return}if(!file.type.startsWith('image/')){resolve('');return}let r=new FileReader();r.onload=()=>{let img=new Image();img.onload=()=>{let scale=Math.min(1,800/img.width,800/img.height),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.63))};img.onerror=()=>resolve('');img.src=r.result};r.onerror=()=>resolve('');r.readAsDataURL(file)})}
app.addEventListener('click',e=>{let el=e.target.closest('[data-go],[data-action]');if(!el)return;if(el.dataset.action==='share-business'){let b=(window.ILHA_BUSINESSES||[]).find(x=>String(x.id)===String(el.dataset.id));if(b){let url=location.origin+location.pathname+'#business-detail/'+encodeURIComponent(b.id);if(navigator.share)navigator.share({title:b.name,text:'Conocé '+b.name+' en Ilha da Magia',url}).catch(()=>{});else navigator.clipboard?.writeText(url).then(()=>toast('Enlace copiado')).catch(()=>toast('No se pudo copiar el enlace'));}return;}if(el.dataset.go){let page=el.dataset.go;if(page==='commercial-form')ui.commercialPlan=el.dataset.plan||'basic';if(page==='place')ui.discoveryOpen=false;nav(page,{id:el.dataset.id,category:el.dataset.category,query:page==='search'?ui.search:undefined});return}let a=el.dataset.action;switch(a){case'notif-nearby':ilhaSetNearby(el.dataset.value==='on').catch(err=>toast('Ubicación: '+err.message));break;case'notif-push':ilhaTogglePush(el.dataset.value==='on').catch(err=>toast('Notificaciones: '+err.message));break;case'notif-refresh':ilhaLoadNotifications();break;case'notif-read':ilhaMarkRead(el.dataset.id).catch(err=>toast('No se pudo guardar: '+err.message));break;case'notif-open':{const item=ilhaNotifs.find(x=>x.id===el.dataset.id);if(!item)break;const link=ilhaSafeNotificationLink(item.target_url);ilhaMarkRead(item.id).catch(()=>{});if(link)location.assign(link);break}case'refresh-public':refreshPublic();break;case'back':goBack();break;case'lang':ilhaSetLanguage(el.dataset.value);break;case'filter':{let v=el.dataset.value,w=el.dataset.which;if(w==='catalog'){ui.category=v;render()}else if(w==='near'){ui.nearCategory=v;render()}else if(w==='saved'){ui.savedCategory=v;render()}else if(w==='lang'){ilhaSetLanguage(v)}else if(w==='explore'){if(v==='Cerca')nav('near');else if(v==='Hoy')nav('events');else nav('catalog')}break}case'location':handleLocation();break;case'clear-location':store.location=null;persist();ilhaSetNearby( app.addEventListener('change',e=>{if(e.target.id==='business-category'){let select=document.getElementById('business-subcategory');if(select){let subs=ilhaBusinessSubcategories[e.target.value]||[];select.innerHTML='<option value="">Elegí una subcategoría</option>'+subs.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}}if(!['community_gallery','community_camera'].includes(e.target.name))return;const file=e.target.files?.[0],status=document.getElementById('community-photo-status'),preview=document.getElementById('community-image-preview'),button=document.getElementById('community-submit');pendingDiscoveryFile=null;if(pendingDiscoveryPreview)URL.revokeObjectURL(pendingDiscoveryPreview);pendingDiscoveryPreview='';if(!file||!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>5*1024*1024){if(status)status.textContent='Usá JPG, PNG o WebP de hasta 5 MB.';if(preview)preview.hidden=true;if(button)button.disabled=true;return}pendingDiscoveryFile=file;pendingDiscoveryPreview=URL.createObjectURL(file);if(preview){preview.src=pendingDiscoveryPreview;preview.hidden=false}if(status)status.textContent='✓ '+file.name+' · Lista para compartir';if(button)button.disabled=false;});

app.addEventListener('submit',async e=>{let form=e.target.closest('form');if(!form)return;e.preventDefault();if(form.dataset.form==='search'){ui.search=String(new FormData(form).get('q')||'').trim();nav('search',{query:ui.search});return}if(form.dataset.form==='community-discovery'){const btn=form.querySelector('[type=submit]');if(btn?.disabled)return;btn.disabled=true;btn.textContent='Subiendo foto…';try{await publishDiscovery(form)}catch(err){toast('No se pudo publicar: '+String(err.message||err).slice(0,155));if(btn.isConnected){btn.disabled=false;btn.textContent='Reintentar publicación'}}return}if(form.dataset.form==='profile'){let f=new FormData(form);store.profile={name:String(f.get('name')||'').trim(),contact:String(f.get('contact')||'').trim()};persist();toast('Perfil guardado. Tu nombre se usará en los nuevos aportes.');nav('profile');return}if(form.dataset.form==='commercial'){const f=new FormData(form),plan=ui.commercialPlan||'basic',loc=ILHA_SMART.formLocation(f);let phone=String(f.get('contact_phone')||'').replace(/\D/g,'');if(phone.length<10||phone.length>15){toast('Agregá un WhatsApp válido con código de país.');return}if(!loc.region){toast('Elegí una ubicación con búsqueda, GPS o mapa.');return}if(!window.ILHA_BACKEND?.ready){toast('Supabase no disponible.');return}let btn=form.querySelector('[type=submit]');btn.disabled=true;btn.textContent='Guardando…';try{let links=ILHA_SMART.formContacts(f),payload;let upload=async(file,url)=>{if(file instanceof File&&file.size)return await window.ILHA_BACKEND.uploadCommercialMedia(file);return url?ILHA_SMART.cleanUrl(url):null};const media=ILHA_SMART.formImage(f);let cover=await upload(media.file,media.url);if(plan==='event'){let start=String(f.get('eventStart')||''),end=String(f.get('eventEnd')||'');if(!start||!end||end<start||end<today())throw Error('Revisá las fechas del evento.');payload={event:{name:String(f.get('eventName')||'').trim(),description:String(f.get('eventDescription')||'').trim(),category:String(f.get('eventCategory')||'Turismo'),start,end,time_start:String(f.get('eventTimeStart')||''),time_end:String(f.get('eventTimeEnd')||''),price:String(f.get('eventPrice')||'').trim(),photo_url:cover}};if(!payload.event.price)throw Error('Indicá el precio del evento.')}else{let items=[];for(let i=0;i<(plan==='premium'?3:1);i++){let name=String(f.get('itemName'+i)||'').trim(),desc=String(f.get('itemDescription'+i)||'').trim();if(!name&&!desc)continue;if(!name||!desc)throw Error('Completá título y descripción de cada publicación.');let kind=plan==='premium'?String(f.get('kind'+i)||'offer'):'offer',instructions=String(f.get('itemInstructions'+i)||'').trim(),benefit=String(f.get('itemBenefit'+i)||'').trim();if(kind==='mission'&&(!instructions||!benefit))throw Error('Cada misión requiere instrucciones y descuento o beneficio.');let photo=await upload((f.get('itemCamera'+i) instanceof File&&f.get('itemCamera'+i).size)?f.get('itemCamera'+i):f.get('itemFile'+i),String(f.get('itemUrl'+i)||''));items.push({kind,name,description:desc,benefit,instructions:kind==='mission'?instructions+' · Beneficio: '+benefit:benefit,photo_url:photo||cover});}if(!items.length)throw Error('Completá una publicación.');let category=String(f.get('business_category')||''),subcategory=String(f.get('business_subcategory')||''),description=String(f.get('business_description')||'').trim();if(!ilhaBusinessSubcategories[category]||!ilhaBusinessSubcategories[category].includes(subcategory))throw Error('Elegí una categoría y subcategoría comercial válida.');if(description.length<15)throw Error('Describí el negocio con al menos 15 caracteres.');const logoFile=f.get('business_logo');const logo=logoFile instanceof File&&logoFile.size?await window.ILHA_BACKEND.uploadCommercialMedia(logoFile):null;payload={items,business:{category,subcategory,description,logo_url:logo,cover_url:cover}}}let request=await window.ILHA_BACKEND.createCommercialRequest({plan_code:plan,business_name:String(f.get('business_name')||'').tri
