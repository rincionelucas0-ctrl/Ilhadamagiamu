<script type="text/ilha-module">/* ILHA DA MAGIA shared smart location/contact/photo form fields */
(()=>{'use strict';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cleanUrl=(value,kind='website')=>{let s=String(value||'').trim();if(!s)return '';if(kind==='phone')return s.replace(/[^\d+]/g,'');if(kind==='instagram'){s=s.replace(/^@/,'');if(!/^https?:\/\//i.test(s)){s='https://www.instagram.com/'+s.replace(/^instagram\.com\//i,'').replace(/\/+$/,'')+'/';}}
if(kind==='website'&&!/^https?:\/\//i.test(s))s='https://'+s;try{let u=new URL(s);if(!['http:','https:'].includes(u.protocol)||u.username||u.password)throw Error('URL insegura');if(kind==='instagram'&&!/^(www\.)?instagram\.com$/i.test(u.hostname))throw Error('Instagram inválido');return u.href}catch{throw Error('Verificá el enlace de '+(kind==='instagram'?'Instagram':'sitio web')+'.')}};
const contacts=(row={})=>`<div class="smart-contacts"><h4>🔗 Enlaces y contacto</h4><label>Sitio web<input name="website" type="text" inputmode="url" placeholder="minegocio.com.br" value="${esc(row.website||'')}"></label><label>Instagram<input name="instagram" type="text" placeholder="@minegocio" value="${esc(row.instagram||'')}"></label><label>Teléfono / WhatsApp<input name="phone" type="tel" placeholder="+55 48 99999-9999" value="${esc(row.phone||'')}"></label><p class="smart-note">Escribí solo el usuario de Instagram o la dirección web. Nosotros armamos los enlaces.</p></div>`;
const location=(row={})=>`<section class="smart-location" data-smart-location><h4>📍 Ubicación sin coordenadas</h4><label>Buscar lugar o dirección<input data-place-search type="search" placeholder="Ej.: Praia da Joaquina, Florianópolis" value="${esc(row.region||'')}"></label><div class="smart-tools"><button type="button" data-place-action="search">🔎 Buscar</button><button type="button" data-place-action="gps">◎ Usar GPS</button><button type="button" data-place-action="map">🗺️ Marcar en mapa</button></div><div data-place-results role="status"></div><div data-place-map class="smart-map" hidden></div><p data-place-status class="smart-note">${row.lat!=null&&row.lng!=null?'Ubicación guardada. Podés cambiarla.':'Buscá y elegí un resultado, usá GPS o marcá el punto en el mapa.'}</p><input type="hidden" name="lat" value="${esc(row.lat??'')}"><input type="hidden" name="lng" value="${esc(row.lng??'')}"><input type="hidden" name="region" value="${esc(row.region||'')}"></section>`;
const media=(row={})=>`<section class="smart-media"><h4>📷 Imagen</h4><label>Elegir imagen del dispositivo<input type="file" name="imageFile" accept="image/jpeg,image/png,image/webp" data-preview-file></label><label>Tomar foto<input type="file" name="cameraFile" accept="image/*" capture="environment" data-preview-file></label><label>O pegar un enlace de imagen<input type="url" name="imageUrl" placeholder="https://.../foto.jpg" value="${esc(row.photo_url||'')}"></label><img data-preview-image alt="Vista previa" style="${row.photo_url?'':'display:none;'}max-width:100%;max-height:190px;object-fit:contain;border-radius:12px" ${row.photo_url?'src="'+esc(row.photo_url)+'"':''}><p class="smart-note">JPEG, PNG o WebP. Máximo 5 MB. Si elegís un archivo, tendrá prioridad sobre el enlace.</p></section>`;
const mapCache=new WeakMap();let lastLookup=0;
function start(root=document){root.addEventListener('change',e=>{let input=e.target.closest('[data-preview-file]');if(!input?.files?.[0])return;let section=input.closest('.smart-media');section.querySelectorAll('[data-preview-file]').forEach(i=>{if(i!==input)i.value=''});let file=input.files[0];if(!/^image\/(jpeg|png|webp)$/.test(file.type)||file.size>5*1024*1024){alert('Usá una foto JPEG, PNG o WebP de hasta 5 MB.');input.value='';return}let img=section.querySelector('[data-preview-image]');if(img.dataset.blob)URL.revokeObjectURL(img.dataset.blob);img.dataset.blob=URL.createObjectURL(file);img.src=img.dataset.blob;img.style.display='block';});
root.addEventListener('click',async e=>{let btn=e.target.closest('[data-place-action]');if(!btn)return;const box=btn.closest('[data-smart-location]');const action=btn.dataset.placeAction,st=box.querySelector('[data-place-status]'),results=box.querySelector('[data-place-results]');const put=(lat,lng,name)=>{box.querySelector('[name=lat]').value=String(lat);box.querySelector('[name=lng]').value=String(lng);box.querySelector('[name=region]').value=name||box.querySelector('[data-place-search]').value||'Florianópolis';box.querySelector('[data-place-search]').value=name||box.querySelector('[data-place-search]').value;st.textContent='✓ Punto seleccionado. Se guardará automáticamente.';results.innerHTML=''};
if(action==='gps'){if(!navigator.geolocation||!isSecureContext){st.textContent='El GPS requiere HTTPS y permiso de ubicación.';return}st.textContent='Solicitando ubicación…';navigator.geolocation.getCurrentPosition(p=>{put(p.coords.latitude,p.coords.longitude,box.querySelector('[data-place-search]').value||'Ubicación seleccionada por GPS');},err=>st.textContent='No se pudo obtener ubicación: '+err.message,{enableHighAccuracy:true,timeout:15000});return}
if(action==='search'){let q=box.querySelector('[data-place-search]').value.trim();if(q.length<3){st.textContent='Escribí al menos tres caracteres.';return}if(Date.now()-lastLookup<1200){st.textContent='Esperá un momento antes de buscar de nuevo.';return}lastLookup=Date.now();btn.disabled=true;st.textContent='Buscando en OpenStreetMap…';try{let url='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&countrycodes=br&q='+encodeURIComponent(q);let r=await fetch(url,{headers:{'Accept':'application/json'}});if(!r.ok)throw Error('Servicio de búsqueda no disponible');let data=await r.json();results.innerHTML=data.map((p,i)=>`<button type="button" data-choice="${i}">${esc(p.display_name)}</button>`).join('')||'<p>No hubo resultados. Probá con el mapa.</p>';st.textContent='Resultados © OpenStreetMap contributors · Nominatim. Elegí un lugar.';results.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>{let p=data[Number(b.dataset.choice)];put(p.lat,p.lon,p.display_name)}))}catch(err){st.textContent=err.message}finally{btn.disabled=false}return}
if(action==='map'){let node=box.querySelector('[data-place-map]');node.hidden=!node.hidden;if(node.hidden)return;if(!window.L){st.textContent='No se cargó el mapa. Verificá tu conexión.';return}let map=mapCache.get(node);if(!map){let lat=Number(box.querySelector('[name=lat]').value)||-27.5949,lng=Number(box.querySelector('[name=lng]').value)||-48.5482;map=L.map(node).setView([lat,lng],11);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:19}).addTo(map);let marker=L.marker([lat,lng],{draggable:true}).addTo(map);const update=p=>{marker.setLatLng(p);put(p.lat,p.lng,box.querySelector('[data-place-search]').value||'Punto marcado en el mapa')};map.on('click',ev=>update(ev.latlng));marker.on('dragend',()=>update(marker.getLatLng()));mapCache.set(node,map)}setTimeout(()=>map.invalidateSize(),100);st.textContent='Tocá el mapa o arrastrá el marcador.'}})}
function formLocation(fd){let lat=String(fd.get('lat')||''),lng=String(fd.get('lng')||'');return {lat:lat===''?null:Number(lat),lng:lng===''?null:Number(lng),region:String(fd.get('region')||'').trim()};}
function formContacts(fd){return {website:cleanUrl(fd.get('website'),'website'),instagram:cleanUrl(fd.get('instagram'),'instagram'),phone:cleanUrl(fd.get('phone'),'phone')};}
function formImage(fd){let file=fd.get('cameraFile') instanceof File&&fd.get('cameraFile').size?fd.get('cameraFile'):fd.get('imageFile');let url=String(fd.get('imageUrl')||'').trim();return {file:file instanceof File&&file.size?file:null,url:url?cleanUrl(url,'website'):''};}
window.ILHA_SMART={location,contacts,media,start,formLocation,formContacts,formImage,cleanUrl};
})();
</script>

const bottom=()=>`<nav class="bottom" aria-label="Navegación principal">${[['home','⌂',t('home')],['explore','⚲',t('explore')],['events','▦',t('events')],['saved','♡',t('saved')],['profile','♙',t('profile')]].map(([id,ico,label])=>`<button class="tab ${ui.page===id?'active':''}" data-go="${id}" aria-current="${ui.page===id?'page':'false'}"><span class="ico">${ico}</span>${label}</button>`).join('')}</nav>`;
function head(title,description,link,label){return `<div class="heading"><div><h2>${title}</h2>${description?`<p>${description}</p>`:''}</div>${link?`<button class="textlink" data-go="${link}">${label||t('view')}</button>`:''}</div>`}
function searchbar(placeholder){return `<form class="search" data-form="search"><input name="q" type="search" aria-label="Buscar" placeholder="${esc(placeholder)}" value="${esc(ui.search)}"><button type="submit" aria-label="Buscar">→</button></form>`}
function chips(items,which,current){return `<div class="chips">${items.map(([label,val])=>`<button class="chip ${current===val?'selected':''}" data-action="filter" data-which="${which}" data-value="${esc(val)}">${esc(label)}</button>`).join('')}</div>`}
const chipsCat=(which,current)=>chips([[t('all'),'Todo'],...categories.map(c=>[c[0]+' '+c[1],c[1]])],which,current);
const discoveryCount=()=>store.discovered.filter(id=>places.some(p=>p.id===id)).length;
const activeEvents=()=>store.events.filter(e=>e.status==='published'&&e.end>=today());
const matchingEvents=(d)=>activeEvents().filter(e=>e.start<=d&&e.end>=d);
const favorites=(type)=>store.saved.filter(x=>!type||x.type===type);
function distance(a,b){if(!store.location)return Infinity;let R=6371,rad=Math.PI/180,dlat=(a-store.location.lat)*rad,dlng=(b-store.location.lng)*rad,z=Math.sin(dlat/2)**2+Math.cos(store.location.lat*rad)*Math.cos(a*rad)*Math.sin(dlng/2)**2;return 2*R*Math.atan2(Math.sqrt(z),Math.sqrt(1-z))}
function filteredPlaces(cat='Todo',query='',near=false){let q=query.trim().toLocaleLowerCase();let data=places.filter(p=>p.status==='published'&&(cat==='Todo'||p.category===cat)&&(!q||(p.name+' '+p.region+' '+p.description+' '+p.category).toLocaleLowerCase().includes(q)));if(near&&store.location)data.sort((a,b)=>distance(a.lat,a.lng)-distance(b.lat,b.lng));return data}
const safeExternal=u=>{try{let x=new URL(u);return ['https:','http:'].includes(x.protocol)?x.href:''}catch{return ''}};
const distLabel=p=>store.location?` · ${distance(p.lat,p.lng).toFixed(1)} km`:'';
function miniPlace(p){let saved=store.saved.some(s=>s.type==='place'&&s.id===p.id);return `<article class="place-card"><div class="place-art">${p.photo_url?`<img src="${esc(p.photo_url)}" loading="lazy" alt="${esc(p.name)}">`:`<span aria-hidden="true">${icons[p.category]||'🌴'}</span>`}<span class="card-photo-label">${esc(p.category)}</span></div><div class="place-body"><p class="card-kicker">📍 ${esc(p.region||'Florianópolis')}${distLabel(p)}</p><h3>${esc(p.name)}</h3><p class="card-excerpt">${esc(p.description||'Descubrí este rincón de la isla.')}</p><div class="card-actions"><button class="primary" data-go="place" data-id="${p.id}">Ver lugar <span aria-hidden="true">↗</span></button><button class="heart-btn" aria-label="${saved?'Quitar de guardados':'Guardar lugar'}" data-action="save" data-type="place" data-id="${p.id}">${saved?'♥':'♡'}</button></div></div></article>`}
function smallEvent(e){return visualCard(e,'event')}
function visualPhoto(item,ico='🌴'){let photo=safeExternal(item.photo_url||item.photo||'');return `<div class="visual-photo">${photo?`<img src="${esc(photo)}" alt="${esc(item.name||'Fotografía')}" loading="lazy">`:`<span class="photo-placeholder" aria-hidden="true">${ico}</span>`}</div>`}
function visualCard(item,type){let typeNames={offer:'OFERTA',mission:'MISIÓN PREMIUM',event:'EVENTO',place:'LUGAR'},kind=typeNames[type]||'EXPERIENCIA';let detail=type==='offer'?'offer-detail':type==='mission'?'mission-detail':type==='event'?'event':'place';let desc=String(item.description||'').trim();let date=type==='event'?fmt(item.start):null;let region=String(item.region||item.category||'').trim();let meta=type==='event'?[date,region].filter(Boolean).join(' · '):(region||'Florianópolis');let shortDesc=desc.split(/\n/).map(x=>x.trim()).filter(Boolean).filter(x=>!/^beneficio\s*:/i.test(x)).join(' ');let benefit=type==='mission'||type==='offer'?desc.split(/\n/).find(x=>/^beneficio\s*:/i.test(x.trim())):'';let free=Boolean(item.is_free||item.free);return `<article class="visual-card visual-card--${type}">${visualPhoto(item,type==='mission'?'🎯':type==='offer'?'🎁':type==='event'?'📅':'🌴')}<div class="visual-card-content"><span class="visual-eyebrow">${kind}${free?' · GRATIS':''}</span><h3>${esc(item.name)}</h3><p class="visual-card-meta">${esc(meta)}</p>${shortDesc?`<p class="visual-card-excerpt">${esc(shortDesc)}</p>`:''}${benefit?`<p class="visual-benefit">${esc(benefit)}</p>`:''}<button class="visual-card-btn" data-go="${detail}" data-id="${esc(item.id)}">Ver detalles <span aria-hidden="true">→</span></button></div></article>`}
function swipeCards(items,type){return `<div class="swipe-cards" role="region" aria-label="${type==='mission'?'Misiones Premium':type==='offer'?'Ofertas':type==='event'?'Eventos':'Lugares'}; deslizá horizontalmente" tabindex="0">${items.map(x=>visualCard(x,type)).join('')}</div>`}
function detailsPhoto(item,kind){return `<div class="detail-media">${visualPhoto(item,kind)}<span class="detail-photo-tag">${esc(kind==='🎯'?'MISIÓN PREMIUM':kind==='🎁'?'OFERTA':kind==='📅'?(item.free?'GRATIS':'EVENTO'):'DESCUBRÍ')}</span></div>`}
function detailButtonLinks(item,showMap=true){let parts=[];let phone=String(item.phone||item.contact||'').replace(/\D/g,'');if(phone.length>=10&&phone.length<=15)parts.push(`<a href="https://wa.me/${phone}" rel="noopener noreferrer" target="_blank" class="detail-action primary-action">WhatsApp ↗</a>`);let webpage=safeExternal(item.website||item.link||'');if(webpage)parts.push(`<a href="${esc(webpage)}" rel="noopener noreferrer" target="_blank" class="detail-action">Sitio web ↗</a>`);let instagram=safeExternal(item.instagram||'');if(instagram)parts.push(`<a href="${esc(instagram)}" rel="noopener noreferrer" target="_blank" class="detail-action">Instagram ↗</a>`);if(showMap){let map=item.lat!=null&&item.lng!=null?item.lat+','+item.lng:(item.region?item.region+', Florianópolis SC':null);if(map)parts.push(`<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(map)}" rel="noopener noreferrer" target="_blank" class="detail-action">Ver en mapa ↗</a>`)}return parts.length?`<div class="detail-action-grid">${parts.join('')}</div>`:''}
function detailInfo(label,value){return value?`<div class="detail-info-row"><span>${label}</span><strong>${esc(value)}</strong></div>`:''}

function home(){let found=discoveryCount(),left=Math.max(0,places.length-found),near=filteredPlaces(ui.nearCategory,'',true).slice(0,12),todayEvents=matchingEvents(today());return `${header()}<div class="hero"><div class="eyebrow">ILHA DA MAGIA · FLORIANÓPOLIS</div><h1>${t('question')}</h1><p>${t('intro')}</p><div class="location"><span>📍 &nbsp;${store.location?t('locOn'):t('locAsk')}</span><button data-action="location">${store.location?'✓':t('activate')}</button></div>${searchbar('Playas, lugares, comer, hacer...')}</div><main class="content"><section class="section">${head('⏱️ '+t('discover'),t('discoverSub'),'discoveries','Ver progreso')}<div class="feature"><div class="eyebrow">${t('adventure')}</div><div class="floating-count"><strong>${found}</strong><small>DESCUBIERTOS</small></div><h3>Te faltan ${left} lugares</h3><p>Descubriste ${found} de ${places.length} lugares publicados.</p><div class="progress"><span style="width:${Math.min(places.length?found/places.length*100:0,100)}%"></span></div><div class="feature-foot"><span>${found}/${places.length} descubiertos</span><button class="soft-btn" data-go="discoveries">Ver detalles →</button></div></div></section><section class="section">${head('📍 '+t('near'),t('nearSub'),'near')}${chips([[t('all'),'Todo'],['🏖️ Playas','Praias'],['🥾 Trilhas','Trilhas'],['👀 Miradores','Mirantes'],['🌿 Naturaleza','Natureza']],'near',ui.nearCategory)}${store.location?near.length?swipeCards(near,'place'):'<div class="empty">Sin lugares publicados para este filtro.</div>':`<div class="empty"><strong>Activá la ubicación para ver lo que está cerca</strong><p>También podés explorar sin compartir tu ubicación.</p><button class="secondary" data-go="near" style="margin-top:12px">Ver detalles →</button></div>`}</section><section class="section">${head('📅 '+t('today'),t('todaySub'),'events')}${todayEvents.length?swipeCards(todayEvents,'event'):'<div class="empty">No hay eventos para hoy.<p>Consultá el calendario mensual para ver otras fechas.</p><button class="secondary" data-go="events" style="margin-top:12px">Ver calendario →</button></div>'}</section><section class="section">${head('🎯 '+t('premium'),t('premiumSub'),'missions')}${(window.ILHA_MISSIONS||[]).length?swipeCards((window.ILHA_MISSIONS||[]),'mission'):'<div class="empty">Todavía no hay misiones Premium disponibles. <button class="textlink" data-go="missions">Ver detalles →</button></div>'}</section><section class="section">${head('🎁 '+t('offers'),t('offersSub'),'offers')}${(window.ILHA_OFFERS||[]).length?swipeCards((window.ILHA_OFFERS||[]),'offer'):'<div class="empty">Todavía no hay ofertas comerciales publicadas. <button class="textlink" data-go="offers">Ver detalles →</button></div>'}</section><section class="section"><div class="ilha-home-install"><div><strong>📲 Llevá Ilha da Magia con vos</strong><p>Accedé desde el inicio de tu celular.</p></div><button type="button" data-action="open-install-guide">Instalar / Ver pasos →</button></div></section><section class="section"><div class="plain-card"><h3>${t('publish')}</h3><p>Mostrá tu negocio, servicio o experiencia en la isla.</p><button class="primary" data-go="publish">Ver opciones para publicar →</button></div></section></main>`}
function explore(){return `${header()}${subhead(t('explore'))}<div class="feature subhero"><div class="eyebrow">🧭 DESCUBRÍ</div><h2>${t('exploreTitle')}</h2><p>${t('exploreSub')}</p></div><div class="sub-search">${searchbar('Buscar lugares y experiencias')}${chips([[t('all'),'Todo'],['Gratis','Gratis'],['Hoy','Hoy'],['Cerca','Cerca']],'explore','Todo')}</div><main class="content"><section class="section">${head(t('natural'),'Descubrí y conocé la isla.')}<div class="category-grid">${categories.map(([icon,name])=>`<button class="category" data-go="catalog" data-category="${esc(name)}"><span>${icon}</span><strong>${esc(name)}</strong><small>${places.filter(p=>p.category===name).length} lugares para descubrir</small></button>`).join('')}</div></section><section class="section">${head(t('more'),'Descubrí lugares, planes y experiencias.')}${[['🍽️','Comer','offers'],['🎯','Qué hacer','missions'],['🌌','Experiencias','offers'],['🎁','Ofertas','offers'],['📍','Cerca','near'],['🔥','Eventos','events'],['🎯','Viví Ilha','discoveries']].map(([icon,label,page])=>menu(icon,label,'Explorar esta área',page)).join('')}</section></main>`}
function menu(icon,label,desc,page){return `<button class="menu-card" data-go="${page}"><span class="menu-icon">${icon}</span><span class="menu-copy"><strong>${esc(label)}</strong><small>${esc(desc)}</small></span><span class="chev">›</span></button>`}
function monthCalendar(){let y=Number(ui.calendarMonth.slice(0,4)),m=Number(ui.calendarMonth.slice(5,7))-1;let start=new Date(y,m,1),offset=(start.getDay()+6)%7,total=new Date(y,m+1,0).getDate(),cells=Math.ceil((offset+total)/7)*7;let monthLabel=new Intl.DateTimeFormat(store.lang==='PT'?'pt-BR':store.lang==='EN'?'en-US':'es-AR',{month:'long',year:'numeric'}).format(start);let weekdays=store.lang==='EN'?['M','T','W','T','F','S','S']:store.lang==='PT'?['S','T','Q','Q','S','S','D']:['L','M','X','J','V','S','D'];return `<section class="calendar-box" aria-label="Calendario mensual de eventos"><div class="calendar-toolbar"><div><p class="calendar-kicker">EXPLORÁ POR FECHA</p><h3>${esc(monthLabel.charAt(0).toUpperCase()+monthLabel.slice(1))}</h3></div><div class="calendar-controls"><button type="button" data-action="month-prev" aria-label="Mes anterior">‹</button><button type="button" data-action="month-today" aria-label="Volver a este mes">Hoy</button><button type="button" data-action="month-next" aria-label="Mes siguiente">›</button></div></div><div class="calendar-weekdays">${weekdays.map(d=>`<span>${d}</span>`).join('')}</div><div class="calendar-grid">${Array.from({length:cells},(_,i)=>{let num=i-offset+1; if(num<1||num>total)return `<span class="calendar-blank" aria-hidden="true"></span>`;let d=[y,String(m+1).padStart(2,'0'),String(num).padStart(2,'0')].join('-'),count=matchingEvents(d).length,selected=ui.date===d,isToday=d===today();return `<button type="button" class="calendar-day ${selected?'selected':''} ${isToday?'is-today':''}" data-action="date" data-value="${d}" aria-label="${num} de ${esc(monthLabel)}, ${count} evento${count===1?'':'s'}" aria-pressed="${selected}"><span>${num}</span>${count?`<i class="calendar-dot" title="${count} eventos"></i>`:'<i class="calendar-dot empty-dot"></i>'}</button>`}).join('')}</div><p class="calendar-hint"><span class="calendar-dot"></span> Días con eventos publicados</p></section>`}
function events(){let dayEvents=matchingEvents(ui.date);return `${subhead('Eventos y Tours')}<div class="feature subhero"><div class="eyebrow">📅 EVENTOS Y TOURS</div><h2>${t('eventTitle')}</h2><p>${t('eventSub')}</p></div><main class="content">${monthCalendar()}<section class="section calendar-results"><div class="heading"><div><h2>${fmt(ui.date)}</h2><p>${dayEvents.length?dayEvents.length+' evento(s) para este día':'Actividades para el día seleccionado'}</p></div></div>${dayEvents.length?`<div class="visual-list">${dayEvents.map(smallEvent).join('')}</div>`:'<div class="empty">No hay eventos publicados para este día. Elegí otra fecha del calendario.</div>'}</section><div class="plain-card" style="margin-top:24px"><h3>¿Organizás un evento?</h3><p>Los eventos comunitarios son gratuitos y sin límite de cantidad. Las publicaciones comerciales requieren Plan Evento.</p><button class="primary" data-go="publish">Publicar evento</button></div></main>`}
function saved(){const items=store.saved.filter(s=>ui.savedCategory==='Todo'||(ui.savedCategory==='Lugares'&&s.type==='place')||(ui.savedCategory==='Planes'&&s.type==='event')||(ui.savedCategory==='Misiones'&&s.type==='mission')||(ui.savedCategory==='Ofertas'&&s.type==='offer'));return `${subhead(t('saved'))}<div class="feature subhero pink"><div class="eyebrow">♡ TU ILHA DA MAGIA</div><h2>${t('savedTitle')}</h2><p>${t('savedSub')}</p><div class="stat-grid"><div class="stat"><strong>${store.saved.length}</strong><span>guardados</span></div><div class="stat"><strong>${favorites('mission').length}</strong><span>misiones</span></div><div class="stat"><strong>${favorites('place').length}</strong><span>lugares</span></div></div></div><main class="content">${chips([[t('all'),'Todo'],['⏱️ Lugares','Lugares'],['🎉 Planes','Planes'],['🎁 Ofertas','Ofertas'],['🎯 Misiones','Misiones']],'saved',ui.savedCategory)}${items.length?`<div style="margin-top:18px">${items.map(s=>{let p=places.find(x=>s.type==='place'&&x.id===s.id),e=store.events.find(x=>s.type==='event'&&x.id===s.id),name=p?.name||e?.name||'Contenido no disponible';return `<div class="list-card"><div class="list-icon">${p?icons[p.category]:'📅'}</div><div class="list-main"><strong>${esc(name)}</strong><small>${esc(p?.region||e?.region||'')}</small></div><button class="textlink" data-go="${p?'place':'event'}" data-id="${esc(s.id)}">Ver</button><button class="ghost-icon" aria-label="Quitar de guardados" data-action="save" data-id="${esc(s.id)}" data-type="${esc(s.type)}">♥</button></div>`}).join('')}</div>`:`<div class="offer center" style="margin-top:20px;padding:65px 23px"><div class="big-heart">♡</div><h3>Todavía no guardaste nada</h3><p>Cuando encuentres algo que quieras volver a vivir, tocá ♡ y lo vas a tener acá.</p><button class="primary full" data-go="explore" style="margin-top:29px">Explorar ahora</button></div>`}</main>`}
const myStats=()=>[store.posts.length+store.events.length,discoveryCount(),store.missions.length,store.photoRecords.length];
function profile(){let stats=myStats();return `${header()}${subhead(t('profile'))}<main class="content"><div class="feature"><div class="profile-top"><div class="avatar">🙂</div><div style="flex:1"><h2>${esc(store.profile.name||t('profile'))}</h2><p>${t('profileSub')}</p></div><button class="soft-btn" data-go="editprofile">Editar<br>perfil</button></div><div class="profile-stat">${['Publicaciones','Lugares','Misiones','Fotos'].map((label,i)=>`<div class="stat"><strong>${stats[i]}</strong><span>${label}</span></div>`).join('')}</div></div><section class="section" style="margin-top:31px">${head('Mi actividad','Todo lo que hacés dentro de la isla.')}<div class="badge-note">📸 Cada foto que compartís ayuda a que la isla se vea desde experiencias reales.</div>${menu('📋','Mis solicitudes comerciales','Seguimiento, estado del pago y estadísticas verificadas.','commercial-requests')}${[['📊','Mi actividad','Descubrimientos, publicaciones y resultados.','activity'],['🌴','Descubrimientos','Lugares, categorías y progreso.','discoveries'],['🎯','Misiones','Tus misiones y el progreso dentro de la isla.','missions'],['📸','Fotos','Tus fotos y aportes guardados en este dispositivo.','photos']].map(x=>menu(...x)).join('')}</section><section class="section">${head('Mi cuenta','Gestioná tu participación y tus preferencias.')}${[['📣','Publicaciones','Ver y administrar lo que enviaste.','my-posts'],['🔔','Notificaciones','Preferencias y novedades.','notifications'],['⚙️','Configuración','Preferencias y privacidad.','settings'],['❔','Ayuda y soporte','Preguntas frecuentes y contacto.','help'],['📲','Instalar aplicación','Agregá Ilha da Magia a tu celular.','install']].map(x=>menu(...x)).join('')}</section><div class="footer-note">ILHA DA MAGIA · Florianópolis</div></main>`}

function place(){let p=places.find(x=>x.id===ui.selectedId);if(!p)return missing();let saved=store.saved.some(x=>x.type==='place'&&x.id===p.id),done=store.discovered.includes(p.id);return `${header()}${subhead('Lugar natural')}<main class="content detail-page">${detailsPhoto(p,'🌴')}<div class="detail-head"><span class="detail-category">${esc(p.category||'Naturaleza')}</span><h2>${esc(p.name)}</h2><p>📍 ${esc(p.region||'Florianópolis')}${distLabel(p)}</p></div><section class="detail-section"><h3>Sobre este lugar</h3><p class="detail-description">${esc(p.description||'Descubrí este lugar de Florianópolis.')}</p></section>${p.recommendations?`<section class="detail-section"><h3>Recomendaciones</h3><p class="detail-description">${esc(p.recommendations)}</p></section>`:''}<section class="detail-section"><h3>Ubicación y contacto</h3>${detailButtonLinks(p)}</section><section class="detail-section"><h3>Tu aventura</h3><div class="detail-action-grid"><button class="detail-action primary-action" data-action="discover" data-id="${p.id}">${done?'✓ Descubierto':'✓ Marcar descubierto'}</button><button class="detail-action" data-action="save" data-type="place" data-id="${p.id}">${saved?'♥ Guardado':'♡ Guardar lugar'}</button></div><p class="fineprint">Registrar un descubrimiento no entrega puntos ni recompensas de misiones.</p></section></main>`}

function commercialForm(){let plan=ui.commercialPlan||'basic',event=plan==='event',premium=plan==='premium';let kinds=['Turismo','Eventos y fiestas','Boliches y vida nocturna','Música','Gastronomía','Deportes y aventura','Cultura','Ferias','Experiencias','Otros'];return `${header()}${subhead('Solicitar Plan '+({basic:'Básico',premium:'Premium',event:'Evento'}[plan]))}<main class="content"><div class="plain-card"><p>Completá los datos. La solicitud se guarda en ADMIN antes de abrir WhatsApp. No se realizará ningún cobro automático.</p><form data-form="commercial" id="commercial-request"><div class="form-field"><label>Nombre del comercio u organizador *</label><input name="business_name" required maxlength="160"></div><div class="form-field"><label>Responsable *</label><input name="responsible_name" required maxlength="140"></div><div class="form-field"><label>WhatsApp de contacto con código de país *</label><input name="contact_phone" type="tel" inputmode="tel" required placeholder="Ej. +55 48 99999-9999"></div><div class="form-field"><label>Correo (opcional)</label><input name="contact_email" type="email"></div>${ILHA_SMART.contacts()}${ILHA_SMART.location()}${event?`<h3>Actividad o evento comercial</h3><div class="form-field"><label>Nombre *</label><input name="eventName" required maxlength="100"></div><div class="form-field"><label>Categoría *</label><select name="eventCategory">${kinds.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="form-field"><label>Descripción y actividad *</label><textarea name="eventDescription" required minlength="10" maxlength="1500"></textarea></div><div class="two"><div class="form-field"><label>Inicio *</label><input name="eventStart" type="date" min="${today()}" required></div><div class="form-field"><label>Finalización *</label><input name="eventEnd" type="date" min="${today()}" required></div></div><div class="two"><div class="form-field"><label>Horario inicial</label><input name="eventTimeStart" type="time"></div><div class="form-field"><label>Horario final</label><input name="eventTimeEnd" type="time"></div></div><div class="form-field"><label>Precio de entrada o actividad (R$) *</label><input name="eventPrice" required maxlength="60" placeholder="Ej.: R$ 50"></div>`:Array.from({length:premium?3:1},(_,i)=>`<section class="plain-card" style="margin:12px 0;background:#f4faf9"><h3>${premium?'Publicación '+(i+1)+(i?' · opcional':' · obligatoria'):'Tu oferta o producto'}</h3>${premium?`<div class="form-field"><label>Tipo de publicación (seleccioná “Misión” para crear una misión real)</label><select name="kind${i}"><option value="offer">Oferta / producto / servicio (no es misión)</option><option value="mission">Misión con actividad y superdescuento</option></select></div>`:''}<div class="form-field"><label>Título ${i===0?'*':''}</label><input name="itemName${i}" maxlength="150" ${i===0?'required':''}></div><div class="form-field"><label>Descripción ${i===0?'*':''}</label><textarea name="itemDescription${i}" maxlength="1500" ${i===0?'required':''}></textarea></div><div class="form-field"><label>Beneficio, descuento y condiciones</label><textarea name="itemBenefit${i}" maxlength="700" placeholder="Ej.: 30% de descuento; válido para..."></textarea></div>${premium?`<div class="form-field"><label>Instrucciones de misión (si elegiste misión)</label><textarea name="itemInstructions${i}" maxlength="1000" placeholder="Ej.: realizar una actividad, check-in y fotografía..."></textarea></div>`:''}<div class="form-field"><label>Elegir foto del dispositivo</label><input name="itemFile${i}" type="file" accept="image/jpeg,image/png,image/webp"></div><div class="form-field"><label>O tomar una foto</label><input name="itemCamera${i}" type="file" accept="image/*" capture="environment"></div><div class="form-field"><label>O enlace de imagen</label><input name="itemUrl${i}" type="url" placeholder="https://..."></div></section>`).join('')}<h3>Imagen principal ${event?'del evento':'del negocio'} (opcional)</h3>${ILHA_SMART.media()}<div class="form-field"><label><input type="checkbox" name="confirm" required> Confirmo que puedo publicar estos datos y acepto que la solicitud requiere revisión y pago.</label></div><button class="primary full" type="submit">Guardar solicitud y contactar por WhatsApp</button></form></div></main>`}
function commercialResult(){let r=window.ILHA_LAST_REQUEST;if(!r)return `${header()}${subhead('Solicitud')}<main class="content"><div class="empty">Sin solicitud reciente.</div></main>`;let number=String(window.ILHA_SETTINGS?.whatsapp||'').replace(/\D/g,''),textMsg=`Hola, quiero contratar en ILHA DA MAGIA.%0A`;let message='Hola, quiero contratar en ILHA DA MAGIA.\nSolicitud: '+r.id+'\nPlan: '+({basic:'Básico',premium:'Premium',event:'Evento'}[r.plan_code])+'\nComercio: '+r.business_name+'\nYa completé el formulario. Quiero coordinar el pago y la activación.';return `${header()}${subhead('Solicitud recibida')}<main class="content"><div class="plain-card"><h2>✅ Solicitud guardada en ADMIN</h2><p>Identificador:</p><div class="notice" style="overflow-wrap:anywhere">${esc(r.id)}</div><p>La solicitud está pendiente. WhatsApp no envía el mensaje automáticamente: tenés que tocar Enviar.</p>${number.length>=10&&number.length<=15?`<a class="primary" style="display:block;text-align:center;text-decoration:none" target="_blank" rel="noopener noreferrer" href="https://wa.me/${number}?text=${encodeURIComponent(message)}">Abrir WhatsApp con mensaje preparado ↗</a>`:`<div class="notice">El número oficial todavía no fue configurado en ADMIN. Copiá el mensaje y usá Contacto cuando esté disponible.</div>`}<button class="secondary full" data-action="copy-request" style="margin-top:12px">Copiar mensaje de solicitud</button><button class="secondary full" data-go="home" style="margin-top:12px">Volver al inicio</button></div></main>`}
function eventForm(){return `${header()}${subhead('Publicar evento comunitario')}<main class="content"><div class="plain-card"><h3>Datos del evento</h3><p>Tu evento aparecerá públicamente al enviarlo correctamente y quedará pendiente de revisión posterior.</p><form data-form="event" id="event-form"><div class="form-field"><label>Nombre del evento *</label><input name="name" required maxlength="100" placeholder="Ej.: Encuentro en la plaza"></div><div class="form-field"><label>Descripción *</label><textarea name="description" required maxlength="1500" placeholder="Contanos de qué se trata"></textarea></div><div class="form-field"><label>Categoría *</label><select name="category"><option>Comunitario</option><option>Cultural</option><option>Deportivo</option><option>Educativo</option><option>Musical</option><option>Otro</option></select></div><div class="two"><div class="form-field"><label>Fecha de inicio *</label><input name="start" type="date" min="${today()}" value="${today()}" required></div><div class="form-field"><label>Fecha de finalización *</label><input name="end" type="date" min="${today()}" value="${today()}" required></div></div><div class="two"><div class="form-field"><label>Hora de inicio</label><input name="timeStart" type="time"></div><div class="form-field"><label>Hora de cierre</label><input name="timeEnd" type="time"></div></div>${ILHA_SMART.location()}<div class="form-field"><label>Nombre del organizador *</label><input name="organizer" required maxlength="100"></div>${ILHA_SMART.contacts()}${ILHA_SMART.media()}<div class="notice">🎟️ GRATIS · Evento comunitario sin precio de entrada.</div><div class="form-field"><label><input type="checkbox" name="confirm" required class="toggle"> Confirmo que soy responsable por el contenido y sus datos.</label></div><button class="primary full" type="submit">Publicar evento</button></form></div></main>`}
function eventDetail(){let e=store.events.find(x=>x.id===ui.selectedId);if(!e)return missing();let saved=store.saved.some(x=>x.type==='event'&&x.id===e.id);return `${header()}${subhead('Evento')}<main class="content detail-page">${detailsPhoto(e,'📅')}<div class="detail-head"><span class="detail-category">${esc(e.category||'Evento')} · ${e.free?'GRATIS':'COMERCIAL'}</span><h2>${esc(e.name)}</h2><p>📍 ${esc(e.region||'Florianópolis')}</p></div><section class="detail-section"><h3>Sobre el evento</h3><p class="detail-description">${esc(e.description||'')}</p></section><section class="detail-section"><h3>Información del evento</h3><div class="detail-info">${detailInfo('Fecha',fmt(e.start)+(e.end!==e.start?' — '+fmt(e.end):''))}${detailInfo('Horario',(e.timeStart||'A confirmar')+(e.timeEnd?' — '+e.timeEnd:''))}${detailInfo('Entrada',e.free?'GRATIS':e.price||'Consultar precio')}${detailInfo('Organiza',e.organizer)}</div></section><section class="detail-section"><h3>Contacto y ubicación</h3>${detailButtonLinks(e)}</section><section class="detail-section"><button class="detail-action detail-save" data-action="save" data-type="event" data-id="${esc(e.id)}">${saved?'♥ Evento guardado':'♡ Guardar evento'}</button><p class="fineprint">Publicación pública · Sujeta a revisión posterior</p></section></main>`}
function myPosts(){let mine=window.ILHA_MY_EVENTS||[];return `${header()}${subhead('Mis publicaciones')}<main class="content"><div class="plain-card"><h3>Publicaciones y contrataciones</h3><p>Los eventos comunitarios se publican gratuitamente y quedan sujetos a revisión posterior. Los planes comerciales se siguen desde Mis solicitudes.</p><button class="secondary full" style="margin-top:14px" data-go="commercial-requests">Ver mis solicitudes comerciales →</button></div><h2 style="margin-top:25px">Mis eventos comunitarios (${mine.filter(e=>e.mode==='community').length})</h2>${mine.filter(e=>e.mode==='community').map(e=>`<div class="list-card"><div class="list-icon">📅</div><div class="list-main"><strong>${esc(e.name)}</strong><small>${esc(e.start)} · ${esc(e.review_status==='pending'?'Revisión pendiente':e.review_status)} · ${esc(e.end<today()?'Finalizado':e.status==='published'?'Visible':'No visible')}</small></div></div>`).join('')||'<div class="empty">No tenés eventos comunitarios registrados en esta cuenta.</div>'}<button class="primary" data-go="publish">+ Nueva publicación</button></main>`}
const requestNames={pending:'Pendiente',in_contact:'En contacto',awaiting_payment:'Esperando pago',payment_confirmed:'Pago confirmado',approved:'Aprobada y publicada',changes_requested:'Requiere cambios',rejected:'Rechazada'};
let myReqLoading=false,myReqLoaded=false,myReqError='',myReqRows=[],myReqHistory={},myReqEvents=[];
async function syncMyRequests(force=false){if(myReqLoading||myReqLoaded&&!force)return;myReqLoading=true;myReqError='';if(['profile','commercial-requests','my-posts'].includes(ui.page))render();try{const api=window.ILHA_BACKEND;if(!api?.ready)throw Error('No hay conexión con Supabase.');const [r,e]=await Promise.all([api.loadMyRequests(),api.loadMyEvents()]);myReqRows=r.items;myReqHistory=r.history;myReqEvents=e;window.ILHA_MY_EVENTS=e;myReqLoaded=true}catch(err){myReqError=String(err.message||err);myReqLoaded=false}finally{myReqLoading=false;if(['profile','commercial-requests','my-posts'].includes(ui.page))render()}}
function merchantSummary(){let pending=myReqRows.filter(r=>!['approved','rejected'].includes(r.status)).length, approved=myReqRows.filter(r=>r.status==='approved').length, published=myReqRows.filter(r=>r.status==='approved').reduce((n,r)=>n+(r.plan_code==='event'?1:r.payload?.items?.length||0),0);return{total:myReqRows.length,pending,approved,published}}
function commercialRequests(){let s=merchantSummary(),phone=String(window.ILHA_SETTINGS?.whatsapp||'').replace(/\D/g,'');return `${header()}${subhead('Mis solicitudes')}<main class="content"><div class="plain-card"><h3>Mi actividad comercial</h3><p>Los números corresponden a tus solicitudes guardadas en Supabase, no a ventas o visitas estimadas.</p><div class="req-stats">${[['Solicitudes',s.total],['En proceso',s.pending],['Aprobadas',s.approved],['Publicaciones aprobadas',s.published]].map(([label,n])=>`<div class="req-metric"><strong>${n}</strong><span>${label}</span></div>`).join('')}</div><button class="secondary full" data-action="refresh-my-requests">↻ Actualizar solicitudes</button></div>${myReqLoading?'<div class="req-loading">Consultando tus datos…</div>':''}${myReqError?`<div class="notice req-err">No fue posible cargar tus solicitudes: ${esc(myReqError)}. <button data-action="refresh-my-requests">Reintentar</button></div>`:''}<section class="section" style="margin-top:25px">${head('Mis pedidos','Cada solicitud conserva su historial de revisión.')} ${myReqRows.length?myReqRows.map(r=>{let details=r.plan_code==='event'?[r.payload?.event]:r.payload?.items||[];let msg='Hola, escribo por mi solicitud ILHA DA MAGIA.\nSolicitud: '+r.id+'\nPlan: '+r.plan_code+'\nComercio: '+r.business_name+'\nQuiero consultar el pago y la activación.';return `<div class="plain-card req-card"><div class="req-inline"><span class="tag">${esc(({basic:'Básico',premium:'Premium',event:'Evento'})[r.plan_code]||r.plan_code)}</span><span class="req-badge" data-state="${esc(r.status)}">${esc(requestNames[r.status]||r.status)}</span></div><h3 style="margin-top:12px">${esc(r.business_name)}</h3><p class="req-small">Enviada: ${esc(new Date(r.created_at).toLocaleDateString('es-AR'))} · Ref. ${esc(r.id.slice(0,8).toUpperCase())}</p><p><b>Pago:</b> ${r.payment_confirmed?'Confirmado':'Pendiente de confirmación'}</p>${details.map(d=>`<div class="req-item">${esc(d?.name||'Publicación')} ${d?.kind==='mission'?'🎯':''}</div>`).join('')}${r.reviewer_note?`<div class="notice"><b>Mensaje de administración:</b> ${esc(r.reviewer_note)}</div>`:''}${(myReqHistory[r.id]||[]).length?`<details><summary>Ver historial de cambios</summary><div class="req-timeline">${myReqHistory[r.id].map(h=>`<p>${esc(new Date(h.created_at).toLocaleString('es-AR'))} · ${esc(requestNames[h.new_status]||h.new_status)}${h.note?'<br>'+esc(h.note):''}</p>`).join('')}</div></details>`:''}${phone.length>=10&&phone.length<=15?`<a class="secondary" style="display:inline-block;text-decoration:none;margin-top:12px" target="_blank" rel="noopener noreferrer" href="https://wa.me/${phone}?text=${encodeURIComponent(msg)}">Consultar por WhatsApp ↗</a>`:''}</div>`}).join(''):'<div class="empty">Todavía no tenés solicitudes comerciales en esta cuenta. Podés elegir un plan y enviar una nueva.</div>'}<button class="primary full" data-go="plans">Elegir plan comercial</button></section><div class="notice">Visualizaciones, clics y contactos todavía no se miden en esta versión. No mostramos cifras ficticias.</div></main>`}

function contact(){let number=String(window.ILHA_SETTINGS?.whatsapp||'').replace(/\D/g,'');return `${header()}${subhead('Contacto comercial')}<main class="content"><div class="plain-card"><h3>Contrataciones por WhatsApp</h3><p>Consultá por los planes Básico, Premium y Evento.</p>${number.length>=10&&number.length<=15?`<a class="primary" style="display:inline-block;text-decoration:none" target="_blank" rel="noopener noreferrer" href="https://wa.me/${number}?text=${encodeURIComponent('Hola, quiero consultar los planes de ILHA DA MAGIA')}">Escribir por WhatsApp ↗</a>`:'<div class="notice">El contacto oficial todavía no fue configurado en ADMIN.</div>'}<button class="secondary full" data-go="plans" style="margin-top:20px">Revisar planes</button></div></main>`}

async function refreshPublic(){const backend=window.ILHA_BACKEND;if(!backend?.ready){toast('Sin conexión a Supabase.');return}try{const data=await backend.loadPublic();places.splice(0,places.length,...(data.places||[]));store.events=data.events||[];window.ILHA_SETTINGS=data.settings||{};window.ILHA_OFFERS=data.offers||[];window.ILHA_MISSIONS=data.missions||[];render();if(data.errors?.length)toast('Algunos contenidos no cargaron: '+data.errors.join(' · '));else toast('Publicaciones actualizadas.')}catch(err){toast('No se pudo actualizar: '+err.message)}}
function toggleSaved(type,id){let idx=store.saved.findIndex(x=>x.type===type&&x.id===id);if(idx<0){store.saved.push({type,id});toast('Agregado a Guardados ♡')}else{store.saved.splice(idx,1);toast('Quitado de Guardados')}persist();render()}
function handleLocation(){if(!navigator.geolocation){toast('Este navegador no dispone de geolocalización.');return}if(!window.isSecureContext){toast('La ubicación requiere HTTPS o localhost.');return}navigator.geolocation.getCurrentPosition(p=>{store.location={lat:p.coords.latitude,lng:p.coords.longitude,at:Date.now()};persist();toast('Ubicación activada.');render()},()=>toast('No se pudo obtener tu ubicación. Revisá los permisos del navegador.'),{enableHighAccuracy:false,timeout:12000,maximumAge:60000})}
function photoRead(file){return new Promise(resolve=>{if(!file){resolve('');return}if(!file.type.startsWith('image/')){resolve('');return}let r=new FileReader();r.onload=()=>{let img=new Image();img.onload=()=>{let scale=Math.min(1,800/img.width,800/img.height),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.63))};img.onerror=()=>resolve('');img.src=r.result};r.onerror=()=>resolve('');r.readAsDataURL(file)})}
app.addEventListener('click',e=>{let el=e.target.closest('[data-go],[data-action]');if(!el)return;if(el.dataset.go){let page=el.dataset.go;if(page==='commercial-form')ui.commercialPlan=el.dataset.plan||'basic';nav(page,{id:el.dataset.id,category:el.dataset.category,query:page==='search'?ui.search:undefined});return}let a=el.dataset.action;switch(a){case'refresh-public':refreshPublic();break;case'back':goBack();break;case'lang':store.lang=el.dataset.value;persist();render();break;case'filter':{let v=el.dataset.value,w=el.dataset.which;if(w==='catalog'){ui.category=v;render()}else if(w==='near'){ui.nearCategory=v;render()}else if(w==='saved'){ui.savedCategory=v;render()}else if(w==='lang'){store.lang=v;persist();render()}else if(w==='explore'){if(v==='Cerca')nav('near');else if(v==='Hoy')nav('events');else nav('catalog')}break}case'location':handleLocation();break;case'clear-location':store.location=null;persist();toast('Ubicación borrada de este dispositivo.');render();break;case'date':ui.date=el.dataset.value;render();break;case'month-prev':case'month-next':{let [year,month]=ui.calendarMonth.split('-').map(Number);let delta=a==='month-prev'?-1:1;let nxt=new Date(year,month-1+delta,1);ui.calendarMonth=nxt.getFullYear()+'-'+String(nxt.getMonth()+1).padStart(2,'0');render();break}case'month-today':ui.calendarMonth=today().slice(0,7);ui.date=today();render();break;case'save':toggleSaved(el.dataset.type,el.dataset.id);break;case'discover':{let id=el.dataset.id;if(!store.discovered.includes(id)){store.discovered.push(id);persist();toast('¡Nuevo lugar descubierto!')}else{store.discovered=store.discovered.filter(x=>x!==id);persist();toast('Descubrimiento desmarcado')}render();break}case'publish-next':if(ui.publishType==='event')nav('event-form');else{ui.commercialPlan=ui.publishType==='commercial-event'?'event':ui.publishType==='premium'?'premium':'basic';nav('commercial-form')}break;case'refresh-my-requests':syncMyRequests(true);break;case'copy-request':{let r=window.ILHA_LAST_REQUEST;if(r){let s='Hola, quiero contratar ILHA DA MAGIA. Solicitud: '+r.id+' Plan: '+r.plan_code+' Comercio: '+r.business_name+'. Quiero coordinar el pago.';navigator.clipboard?.writeText(s).then(()=>toast('Mensaje copiado')).catch(()=>toast('No se pudo copiar'));}break;}case'delete-event':toast('Para retirar una publicación pública, contactá con administración.');break;case'clear-data':if(confirm('¿Eliminar favoritos, descubrimientos, perfil y eventos guardados en este navegador?')){localStorage.removeItem('ilha-v04');store=structuredClone(defaults);ui.page='home';render();toast('Datos locales eliminados')}break;}});
app.addEventListener('change',e=>{if(e.target.id==='publish-kind'){ui.publishType=e.target.value;$('#publish-explain').innerHTML=publishExplain()}if(e.target.dataset.action==='pref'){store.preferences[e.target.dataset.value]=e.target.checked;persist();toast('Preferencia guardada localmente.')}});
app.addEventListener('submit',async e=>{let form=e.target.closest('form');if(!form)return;e.preventDefault();if(form.dataset.form==='search'){ui.search=String(new FormData(form).get('q')||'').trim();nav('search',{query:ui.search});return}if(form.dataset.form==='profile'){let f=new FormData(form);store.profile={name:String(f.get('name')||'').trim(),contact:String(f.get('contact')||'').trim()};persist();toast('Perfil guardado en este dispositivo.');nav('profile');return}if(form.dataset.form==='commercial'){const f=new FormData(form),plan=ui.commercialPlan||'basic',loc=ILHA_SMART.formLocation(f);let phone=String(f.get('contact_phone')||'').replace(/\D/g,'');if(phone.length<10||phone.length>15){toast('Agregá un WhatsApp válido con código de país.');return}if(!loc.region){toast('Elegí una ubicación con búsqueda, GPS o mapa.');return}if(!window.ILHA_BACKEND?.ready){toast('Supabase no disponible.');return}let btn=form.querySelector('[type=submit]');btn.disabled=true;btn.textContent='Guardando…';try{let links=ILHA_SMART.formContacts(f),payload;let upload=async(file,url)=>{if(file instanceof File&&file.size)return await window.ILHA_BACKEND.uploadCommercialMedia(file);return url?ILHA_SMART.cleanUrl(url):null};const media=ILHA_SMART.formImage(f);let cover=await upload(media.file,media.url);if(plan==='event'){let start=String(f.get('eventStart')||''),end=String(f.get('eventEnd')||'');if(!start||!end||end<start||end<today())throw Error('Revisá las fechas del evento.');payload={event:{name:String(f.get('eventName')||'').trim(),description:String(f.get('eventDescription')||'').trim(),category:String(f.get('eventCategory')||'Turismo'),start,end,time_start:String(f.get('eventTimeStart')||''),time_end:String(f.get('eventTimeEnd')||''),price:String(f.get('eventPrice')||'').trim(),photo_url:cover}};if(!payload.event.price)throw Error('Indicá el precio del evento.')}else{let items=[];for(let i=0;i<(plan==='premium'?3:1);i++){let name=String(f.get('itemName'+i)||'').trim(),desc=String(f.get('itemDescription'+i)||'').trim();if(!name&&!desc)continue;if(!name||!desc)throw Error('Completá título y descripción de cada publicación.');let kind=plan==='premium'?String(f.get('kind'+i)||'offer'):'offer',instructions=String(f.get('itemInstructions'+i)||'').trim(),benefit=String(f.get('itemBenefit'+i)||'').trim();if(kind==='mission'&&(!instructions||!benefit))throw Error('Cada misión requiere instrucciones y descuento o beneficio.');let photo=await upload((f.get('itemCamera'+i) instanceof File&&f.get('itemCamera'+i).size)?f.get('itemCamera'+i):f.get('itemFile'+i),String(f.get('itemUrl'+i)||''));items.push({kind,name,description:desc,benefit,instructions:kind==='mission'?instructions+' · Beneficio: '+benefit:benefit,photo_url:photo||cover});}if(!items.length)throw Error('Completá una publicación.');payload={items}}let request=await window.ILHA_BACKEND.createCommercialRequest({plan_code:plan,business_name:String(f.get('business_name')||'').trim(),responsible_name:String(f.get('responsible_name')||'').trim(),contact_phone:phone,contact_email:String(f.get('contact_email')||'').trim()||null,instagram:links.instagram||null,website:links.website||null,region:loc.region,lat:loc.lat,lng:loc.lng,payload});window.ILHA_LAST_REQUEST=request;myReqLoaded=false;toast('Solicitud guardada en ADMIN.');nav('commercial-result')}catch(err){toast('No se pudo guardar: '+String(err.message||err).slice(0,170))}finally{btn.disabled=false;btn.textContent='Guardar solicitud y contactar por WhatsApp'}return}if(form.dataset.form==='event'){let f=new FormData(form),start=String(f.get('start')||''),end=String(f.get('end')||'');if(end<start||start<today()){toast('Revisá las fechas del evento.');return}if(!window.ILHA_BACKEND?.ready){toast(window.ILHA_BACKEND?.connectionMessage?.()||'No se pudo conectar Supabase.');return}let btn=form.querySelector('[type=submit]');btn.disabled=true;btn.textContent='Publicando…';try{let event=await window.ILHA_BACKEND.createEvent({name:String(f.get('name')).trim(),description:String(f.get('description')).trim(),category:String(f.get('category')),start,end,timeStart:String(f.get('timeStart')||''),timeEnd:String(f.get('timeEnd')||''),...ILHA_SMART.formLocation(f),...ILHA_SMART.formContacts(f),organizer:String(f.get('organizer')).trim(),contact:ILHA_SMART.formContacts(f).phone||null,free:true,price:null,photoFile:ILHA_SMART.formImage(f).file,photoUrl:ILHA_SMART.formImage(f).url});store.events.unshift(event);persist();toast('¡Evento publicado! Pendiente de revisión posterior.');nav('event',{id:event.id});}catch(err){toast('No se pudo publicar: '+String(err.message||err).slice(0,170))}finally{btn.disabled=false;btn.textContent='Publicar evento'}return}});
